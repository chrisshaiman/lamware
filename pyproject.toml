[project]
name = "malware-sandbox-infra"
version = "0.1.0"
description = "Distributed malware analysis platform — CAPEv2 on bare metal KVM"
authors = [{ name = "Christopher Shaiman" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "G",   # flake8-logging-format (catches f-string logging)
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # line too long — ruff format handles wrapping
]

[tool.ruff.lint.per-file-ignores]
# Several api test modules set up sys.modules stubs / fixtures (the exec-with-stubs
# loaders and the auth-test purge block) before importing the module under test, so
# E402 (import-not-at-top) is expected and intentional there. Production code stays strict.
"api/tests/*" = ["E402"]

[tool.bandit]
exclude_dirs = [
    "tests",
    "packer/ansible/roles/konstruktoid.hardening",
    "frontend",
]
skips = [
    "B104",  # hardcoded_bind_all_interfaces — API binds 0.0.0.0 intentionally (behind WireGuard)
    "B108",  # hardcoded_tmp_directory — CLI tools use /tmp by design on Linux
    "B110",  # try_except_pass — intentional in non-fatal paths (commented)
    "B404",  # import subprocess — security tooling legitimately shells out
    "B603",  # subprocess_without_shell — all commands are hardcoded, no user input
    "B105",  # hardcoded_password_string — fake_credentials.py is intentional test data
    "B607",  # start_process_with_partial_path — known executables (wslpath, explorer.exe)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
