[project]
name = "lamware-api"
version = "0.1.0"
description = "FastAPI backend for the lamware malware analysis platform"
authors = [{ name = "Christopher Shaiman" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
    "asyncpg>=0.30",
    "PyJWT[crypto]>=2.9",
    "httpx>=0.27",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["httpx", "pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
