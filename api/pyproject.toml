[project]
name = "lamware-api"
# Keep in sync with the root VERSION file (enforced by tests/test_version_consistency.py).
version = "0.1.0"
description = "FastAPI backend for the lamware malware analysis platform"
authors = [{ name = "Christopher Shaiman" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlmodel>=0.0.22",
    "psycopg2-binary>=2.9",
    "pydantic-settings>=2.0",
    "asyncpg>=0.30",
    "PyJWT[crypto]>=2.9",
    "httpx>=0.27",
    "alembic>=1.13",
    # Required by routers/samples.py — `@router.post("/submit")` takes Form data, and
    # FastAPI raises at IMPORT time ("Form data requires python-multipart") without it.
    # It was undeclared here and absent from CI's install list; nothing noticed because
    # every api test stubs its imports except test_ws_endpoint.py, which imports the
    # real app.main — and that file was excluded from CI. Found by un-excluding it (#208).
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["httpx", "pytest", "pytest-asyncio"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[tool.pytest.ini_options]
# Add api/ to sys.path so `from app.xxx import ...` works when pytest's
# rootdir is the repo root (found via root pyproject.toml).
pythonpath = ["."]
