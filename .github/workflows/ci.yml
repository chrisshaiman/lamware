name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Python: lint (ruff) + tests (pytest)
  # ---------------------------------------------------------------------------
  python:
    name: Python lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        # ansible/ joined in #206. It holds the entire analysis pipeline — ~12k lines
        # that were unlinted while the gate reported green. G004 is deferred there until
        # 2026-10-31; see pyproject.toml and pipeline/tests/test_lint_scope.py.
        run: ruff check api/ shared/ pipeline/ ansible/

      - name: Test (pytest)
        # tests/smoke is the live post-deploy Playwright gate (needs a browser + the live
        # site); it is intentionally not run in CI — exclude it from collection here.
        run: pytest --tb=short --ignore=tests/smoke

  # ---------------------------------------------------------------------------
  # API: pytest (FastAPI app + investigation agent unit tests)
  # ---------------------------------------------------------------------------
  api:
    name: Test (api)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Read the dependency list FROM api/pyproject.toml rather than repeating it here.
      # It used to be hand-typed, and drifted: python-multipart was missing from both
      # copies, so `import app.main` raised at import time on a clean install. Nothing
      # caught it because the only test importing the real app.main was excluded from
      # CI (#208). Installing exactly what the manifest declares makes every run a check
      # that the manifest is complete.
      #
      # The package itself is not `pip install ./api` — its build-backend is
      # non-standard and a flat layout breaks auto-discovery. ./shared installs
      # lamware-shared so api tests can import it without a venv.
      - name: Install api dependencies
        run: |
          python - <<'PY' > /tmp/api-deps.txt
          import tomllib
          with open("api/pyproject.toml", "rb") as fh:
              print("\n".join(tomllib.load(fh)["project"]["dependencies"]))
          PY
          pip install -r /tmp/api-deps.txt pytest pytest-asyncio ./shared

      - name: Test (api pytest)
        # Integration tests skip without LAMWARE_TEST_URL.
        #
        # test_ws_* used to be excluded here because the exec-with-stubs unit tests
        # leaked sys.modules at import time and broke their real imports. The leak is
        # fixed (tests/_module_stubs.py) rather than worked around, so the WebSocket
        # endpoint — the weakest auth path in the codebase — now has CI coverage.
        # test_no_module_stub_leaks.py fails if either the leak or the exclusion returns.
        working-directory: api
        run: python -m pytest -q

  # ---------------------------------------------------------------------------
  # Packages: shared + pipeline unit tests
  # ---------------------------------------------------------------------------
  packages:
    name: Test (shared + pipeline)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install packages
        # [test] pulls anthropic/httpx so the #205 tests can import the interpret
        # container script for real instead of stubbing its dependencies.
        run: pip install ./shared "./pipeline[test]" pytest hypothesis

      - name: Test
        run: |
          python -m pytest shared/tests -q
          python -m pytest pipeline/tests -q

  # ---------------------------------------------------------------------------
  # Ansible: lint
  # ---------------------------------------------------------------------------
  ansible:
    name: Ansible lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install ansible-lint and dependencies
        run: |
          pip install ansible-lint
          # requirements.yml is the single source of truth for Galaxy deps —
          # do not add collections here, add them there.
          ansible-galaxy install -r ansible/requirements.yml

      - name: Run ansible-lint
        run: ansible-lint ansible/site.yml

  # ---------------------------------------------------------------------------
  # Terraform validate — all root modules
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dir:
          # OVH is the only deployed target. The AWS root modules were removed with
          # the rest of the decommissioned stack (ADR-016, #211).
          - ovh

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "~1.10"

      - name: terraform init (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        # -backend=false skips S3/OVH backend auth — validate only needs provider schemas
        run: terraform init -backend=false

      - name: terraform validate (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: terraform validate

  # ---------------------------------------------------------------------------
  # Packer syntax — every template, individually
  # ---------------------------------------------------------------------------
  packer:
    name: Packer syntax
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Must satisfy the templates' `required_version`. It said ~1.11 while the
      # templates were pinned to ~> 1.16.0, which would fail every `packer
      # validate` here — a CI job that cannot pass is not a check, and the two
      # declarations drifting apart is the thing test_packer_version_pin guards.
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
        with:
          version: "~1.16"

      # Per file, because `packer validate .` merges the directory into one config
      # and the windows11-* templates each declare `variable "ovmf_vars"`. That
      # duplicate-variable error is what made `make validate` abort at step one and
      # silently validate nothing for months (#228) — with no CI job to notice.
      #
      # -syntax-only because a full validate needs the gitignored pkrvars, installed
      # plugins, and artifacts from earlier build stages. Asserting "the HCL parses"
      # is honest; asserting more here would be a check that cannot pass.
      - name: packer validate -syntax-only (per template)
        run: |
          for f in packer/*.pkr.hcl; do
            echo "==> $f"
            packer validate -syntax-only "$f"
          done

  # ---------------------------------------------------------------------------
  # Frontend: type-check, build, unit tests
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --ignore-scripts: nothing in this tree needs postinstall, and skipping it
      # removes an arbitrary-code-execution step from dependency install.
      - name: Install
        working-directory: frontend
        run: npm ci --ignore-scripts

      # `npm run build` is `tsc -b && vite build`, so this IS the type-check. Until
      # now a type error merged green — there was no frontend job at all (#172).
      - name: Build (type-checks via tsc -b)
        working-directory: frontend
        run: npm run build

      - name: Unit tests
        working-directory: frontend
        run: npm test

      # NOT run here yet: `npm run lint` reports 5 pre-existing errors in components
      # unrelated to this change (setState-in-effect, impure-during-render,
      # fast-refresh export). Adding it now would land CI red. Tracked separately —
      # see the follow-up issue rather than a silently-omitted acceptance criterion.

  # ---------------------------------------------------------------------------
  # Security: gitleaks, bandit, ruff via pre-commit + pip-audit + semgrep
  # ---------------------------------------------------------------------------
  security:
    name: Security scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit (all files)
        run: pre-commit run --all-files

      # The pre-commit gitleaks hook's entry is
      #     gitleaks git --pre-commit --redact --staged --verbose
      # `--staged` scans the git INDEX. On a fresh actions/checkout nothing is
      # staged, so it scans an empty diff and exits 0 unconditionally — the CI half
      # of the secret-scanning control has never examined a single file. It works
      # locally, where a commit actually has staged content, which is why the
      # difference went unnoticed.
      #
      # Scan the working tree instead. Version pinned to match .pre-commit-config
      # so local and CI agree on rules, and the archive is checksum-verified
      # against the release's own manifest.
      - name: Secret scan (gitleaks — scans the tree, not an empty index)
        run: |
          set -euo pipefail
          VERSION=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL "$BASE/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          curl -sSfL "$BASE/gitleaks_${VERSION}_checksums.txt" -o /tmp/gitleaks.sums
          ( cd /tmp && grep "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks.sums \
              | sed "s#gitleaks_${VERSION}_linux_x64.tar.gz#gitleaks.tgz#" \
              | sha256sum -c - )
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks dir . --redact --no-banner

      # Audit the tree we actually ship. Until #211 this audited a root
      # requirements.txt that named only decommissioned files (anthropic/boto3/Pillow
      # for the deleted src/ Lambda handlers), while the live API's dependencies were
      # hand-typed inline in the api job and audited nowhere — the control reported
      # green against the wrong dependency tree.
      #
      # api/ is installed by resolving its declared dependencies rather than the
      # package itself: its build-backend is non-standard and a flat layout breaks
      # `pip install ./api`. Reading pyproject keeps this from becoming a third
      # hand-maintained copy of the dependency list.
      - name: Audit dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip install ./shared ./pipeline
          python - <<'PY' > /tmp/api-deps.txt
          import tomllib
          with open("api/pyproject.toml", "rb") as fh:
              print("\n".join(tomllib.load(fh)["project"]["dependencies"]))
          PY
          pip install -r /tmp/api-deps.txt -r requirements-dev.txt
          pip-audit
          # The interpret container ships its own anthropic pin, which is the one
          # actually deployed. The deleted root requirements.txt pinned a DIFFERENT
          # version (0.102.0 vs the container's 0.52.0), so the audit was reporting on
          # a version running nowhere while the deployed one went unchecked.
          # Guarded by tests/test_audit_covers_container_deps.py.
          pip-audit -r ansible/roles/interpret/templates/requirements.txt.j2

      - name: Semgrep SAST (Python patterns)
        run: |
          pip install semgrep
          semgrep scan --config p/python api/ shared/ pipeline/ ansible/ --error

      - name: Audit frontend dependencies (npm audit)
        # Gate rather than raw `npm audit --audit-level=high`: that form is
        # all-or-nothing, so one advisory that cannot apply here (RSC-mode, in a
        # client-only SPA) turns the job permanently red and the only lever npm offers
        # is lowering the threshold for everything. The gate holds the threshold at
        # high/critical and requires each exception to carry a reason and an expiry —
        # see frontend/audit-exceptions.json.
        run: |
          cd frontend
          npm ci --ignore-scripts
          node scripts/audit-gate.mjs
