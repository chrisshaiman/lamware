name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Python: lint (ruff) + tests (pytest)
  # ---------------------------------------------------------------------------
  python:
    name: Python lint & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check src/

      - name: Test (pytest)
        # tests/smoke is the live post-deploy Playwright gate (needs a browser + the live
        # site); it is intentionally not run in CI — exclude it from collection here.
        run: pytest --tb=short --ignore=tests/smoke

  # ---------------------------------------------------------------------------
  # Ansible: lint
  # ---------------------------------------------------------------------------
  ansible:
    name: Ansible lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-lint and dependencies
        run: |
          pip install ansible-lint
          ansible-galaxy install -r ansible/requirements.yml
          ansible-galaxy collection install ansible.posix community.general

      - name: Run ansible-lint
        run: ansible-lint ansible/site.yml

  # ---------------------------------------------------------------------------
  # Terraform validate — all root modules
  # ---------------------------------------------------------------------------
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dir:
          - aws/bootstrap
          - aws/envs/prod
          - ovh

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.10"

      - name: terraform init (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        # -backend=false skips S3/OVH backend auth — validate only needs provider schemas
        run: terraform init -backend=false

      - name: terraform validate (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: terraform validate

  # ---------------------------------------------------------------------------
  # Security: gitleaks, bandit, ruff via pre-commit + pip-audit + semgrep
  # ---------------------------------------------------------------------------
  security:
    name: Security scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit (all files)
        run: pre-commit run --all-files

      - name: Audit dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Semgrep SAST (Python patterns)
        run: |
          pip install semgrep
          semgrep scan --config p/python src/ api/ --error

      - name: Audit frontend dependencies (npm audit)
        run: |
          cd frontend
          npm ci --ignore-scripts
          npm audit --audit-level=high
