# .pre-commit-config.yaml
# Install: pre-commit install
# Run all: pre-commit run --all-files

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        # Was `^src/`, which pointed at the decommissioned Lambda handlers. Deleting
        # src/ (#211) would have left this hook silently matching ZERO files while
        # still reporting green — a scope narrower than it looks was already the
        # complaint in #206. These are the live Python trees.
        files: ^(api|shared|pipeline)/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
