[project]
name = "lamware-pipeline"
# Keep in sync with the root VERSION file (enforced by tests/test_version_consistency.py).
version = "0.1.0"
description = "lamware analysis pipeline (de-templated package)"
authors = [{ name = "Christopher Shaiman" }]
requires-python = ">=3.12"
dependencies = ["lamware-shared", "pydantic>=2", "psycopg2-binary>=2.9", "requests>=2.31", "ppdeep==20260221"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lamware_pipeline*"]
