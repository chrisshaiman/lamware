---
# =============================================================================
# site.yml — Main Ansible playbook
# Runs all roles against the sandbox host in order.
# Each role is idempotent — safe to re-run after config changes.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Configure malware sandbox host
  hosts: sandbox
  become: true
  gather_facts: true

  vars_files:
    - vars/main.yml
    - vars/secrets.yml

  pre_tasks:
    - name: Validate required variables are populated
      ansible.builtin.assert:
        that:
          - wireguard_peer_pubkey | length > 0
          - cape_api_key | length > 0
          - bazaar_auth_key | length > 0
        fail_msg: |
          One or more required variables are empty:
            wireguard_peer_pubkey — your laptop's WireGuard public key (wg pubkey < ~/wg-private.key)
            cape_api_key          — Cape API token (ansible/vars/secrets.yml)
            bazaar_auth_key       — MalwareBazaar auth key (ansible/vars/secrets.yml)

    # Separate from the block above, and tagged `always`, because the assert above
    # does NOT run on a tagged deploy — and a key rotation is exactly a tagged deploy
    # (make deploy TAGS=litellm,api,interpret,ntfy-alerts). Two gaps compound there:
    # pre_tasks are skipped unless tagged `always`, and `| mandatory` at the call
    # sites fires only on UNDEFINED, not on empty. Without this, a rotation with an
    # unfilled vault entry renders master_key: "" into LiteLLM's config and reports
    # success — the same silently-passing guard as #238 itself.
    #
    # Scoped to this one variable rather than tagging the whole block, so tagged
    # workflows that tolerate an empty optional secret keep working.
    - name: Validate the LiteLLM master key (runs on tagged deploys too)
      ansible.builtin.assert:
        that:
          - litellm_master_key is defined
          - litellm_master_key | length > 0
        fail_msg: |
          litellm_master_key is unset or empty in ansible/vars/secrets.yml.
          It authenticates the API, the interpret container, and the daily digest to
          the LiteLLM router, and has no default by design (#238).

            python3 -c "import secrets; print('sk-' + secrets.token_urlsafe(32))"
            ansible-vault edit ansible/vars/secrets.yml
      tags: [always]

    # --- Deploy provenance (#151) ------------------------------------------
    #
    # Tagged `always` for exactly the reason the assert above is: a TAGGED deploy is
    # when drift happens, and pre_tasks are skipped unless tagged. `make deploy
    # TAGS=pipeline` is the common case, so a provenance marker that only appeared on
    # full deploys would be absent precisely when it is needed.
    #
    # Records BRANCH and DIRTY, not just the SHA. On 2026-08-03 a `TAGS=pipeline`
    # deploy ran from a clean `main` while the change under test (the qwen@15 arm)
    # existed only on a feature branch. The host silently reverted to main's copy and
    # the next eval would have run at the wrong depth for 50 minutes. A bare SHA would
    # have looked perfectly healthy — main was clean and current. What was needed was
    # the ability to ask "is THIS commit live?", which `make provenance` now answers.
    - name: Read the deploying checkout's git HEAD
      ansible.builtin.command:
        cmd: git rev-parse HEAD
        chdir: "{{ playbook_dir }}/.."
      register: _deploy_sha
      changed_when: false
      delegate_to: localhost
      become: false
      run_once: true
      tags: [always]

    - name: Read the deploying checkout's branch
      ansible.builtin.command:
        cmd: git rev-parse --abbrev-ref HEAD
        chdir: "{{ playbook_dir }}/.."
      register: _deploy_branch
      changed_when: false
      delegate_to: localhost
      become: false
      run_once: true
      tags: [always]

    # Uncommitted changes mean the deployed bytes correspond to NO commit, so the SHA
    # alone is a lie. Recorded rather than blocked: deploying a work-in-progress is a
    # legitimate thing to do deliberately, and an unexplained hard failure here would
    # just teach people to skip the check.
    - name: Detect uncommitted changes in the deploying checkout
      ansible.builtin.command:
        cmd: git status --porcelain
        chdir: "{{ playbook_dir }}/.."
      register: _deploy_dirty
      changed_when: false
      delegate_to: localhost
      become: false
      run_once: true
      tags: [always]

    - name: Ensure the provenance directory exists
      ansible.builtin.file:
        path: /opt/lamware
        state: directory
        mode: "0755"
      tags: [always]

    - name: Write the deploy provenance marker
      ansible.builtin.copy:
        dest: /opt/lamware/deploy-provenance.json
        mode: "0644"
        content: |
          {{
            {
              "sha": _deploy_sha.stdout,
              "branch": _deploy_branch.stdout,
              "dirty": (_deploy_dirty.stdout | length) > 0,
              "dirty_files": (_deploy_dirty.stdout_lines | default([]))[:20],
              "tags": (ansible_run_tags | default(["all"])),
              "deployed_at": (ansible_date_time.iso8601 | default("unknown")),
              "deployed_by": (lookup("env", "USER") | default("unknown", true)),
            } | to_nice_json
          }}
      tags: [always]

    - name: Report what is being deployed
      ansible.builtin.debug:
        msg: >-
          Deploying {{ _deploy_sha.stdout[:12] }} ({{ _deploy_branch.stdout }}){{
          ' [DIRTY — deployed bytes match no commit]' if (_deploy_dirty.stdout | length) > 0 else '' }}
          tags={{ ansible_run_tags | default(['all']) | join(',') }}
      tags: [always]

  roles:
    # 1. OS hardening — CIS-aligned baseline (konstruktoid)
    - role: hardening
      tags: [hardening]

    # 2. KVM/QEMU/libvirt — must run before networking (virsh needed for bridge)
    - role: kvm
      tags: [kvm]

    # 3. Networking — detonation bridge + iptables air-gap + INetSim INPUT rules
    #    Requires libvirt (virsh) from KVM role.
    - role: networking
      tags: [networking]

    # 4. INetSim — host-side network simulator for guest VM traffic (ADR-011)
    #    Must run after networking (needs virbr-det bridge IP to exist).
    #    Must run before cape (cape routing.conf references inetsim_server).
    - role: inetsim
      tags: [inetsim]

    # 5. WireGuard VPN
    - role: wireguard
      tags: [wireguard]

    # 6. DSDT-patched QEMU binary + cape user/repo setup
    - role: qemu-patched
      tags: [qemu-patched]

    # 7. MongoDB 8.0 — standalone, required by Cape
    - role: mongodb
      tags: [mongodb]

    # 8. CAPEv2 — cape2.sh installer + config + services
    - role: cape
      tags: [cape]

    # 9. Guest VMs — libvirt domains + snapshots
    - role: cape-guests
      tags: [cape-guests]

    # 10. Podman — container runtime for analysis tool stages
    - role: podman
      tags: [podman]

    # 10a. Ollama — local LLM serving for the summary stages (LiteLLM routes to it)
    - role: ollama
      tags: [ollama]

    # 10a-2. llama.cpp — local LLM serving for the agentic RE and vision stages.
    #        Separate from ollama: llama.cpp splits reasoning into
    #        `reasoning_content` and grammar-constrains forced-tool args, which is
    #        what makes structured RE output reliable (2026-07-23 spike, PR #180).
    - role: llama-cpp
      tags: [llama-cpp]

    # 10b. LiteLLM proxy — routes all Claude API calls through local proxy
    - role: litellm
      tags: [litellm]

    # 10c. Keycloak — identity broker for enterprise SSO
    - role: keycloak
      tags: [keycloak]

    # 11. PCAP analysis — containerized Zeek + Suricata for network traffic
    - role: pcap-analysis
      tags: [pcap-analysis]

    # 12. Triage — containerized YARA/ssdeep/FLOSS analysis
    - role: triage
      tags: [triage]

    # 12. Volatility 3 — containerized memory forensics
    - role: volatility
      tags: [volatility]

    # 13. Ghidra — containerized headless static analysis
    - role: ghidra
      tags: [ghidra]

    # 13a. Python sandbox — isolated Python execution for investigation agent
    - role: python-sandbox
      tags: [python-sandbox, investigate]

    # 13b. .NET analysis — containerized ILSpy decompilation
    - role: dotnet-analysis
      tags: [dotnet-analysis]

    # 13c. Go analysis — containerized GoReSym metadata extraction
    - role: go-analysis
      tags: [go-analysis]

    # 13d. PyInstaller analysis — containerized pyinstxtractor + decompyle3
    - role: pyinstaller-analysis
      tags: [pyinstaller-analysis]

    # 13e. Java analysis — containerized CFR decompiler
    - role: java-analysis
      tags: [java-analysis]

    # 13f. Office macro analysis — containerized olevba extraction
    - role: office-macro-analysis
      tags: [office-macro-analysis]

    # 13g. PowerShell analysis — containerized PSDecode deobfuscation
    - role: powershell-analysis
      tags: [powershell-analysis]

    # 13h. Screenshot analysis — dedup + QR detection
    - role: screenshot-analysis
      tags: [screenshot-analysis]

    # 13i. PDF generation — containerized WeasyPrint rendering
    - role: pdf-generation
      tags: [pdf-generation]

    # 14. LLM interpretation — agentic Claude analysis of Ghidra output
    - role: interpret
      tags: [interpret]

    # 15. PostgreSQL — analysis database (uses Cape's existing PostgreSQL instance)
    - role: postgres
      tags: [postgres]

    # 16. Pipeline orchestrator — chains triage → Cape → Volatility → Ghidra
    - role: pipeline
      tags: [pipeline]

    # 17. lamware API — FastAPI REST backend
    - role: api
      tags: [api]

    # 18b. React frontend — Vite SPA behind nginx reverse proxy
    - role: frontend
      tags: [frontend]

    # 19. Sample feeder — interactive CLI for MalwareBazaar sample ingestion (ADR-015)
    - role: sample-feeder
      tags: [sample-feeder]

    # 20. Auto-feeder — unattended MalwareBazaar ingestion (disabled by default)
    - role: auto-feeder
      tags: [auto-feeder]

    # 21. Network monitor — air-gap integrity checking (cron, every 5 min)
    - role: network-monitor
      tags: [network-monitor]

    # 22. ntfy alerts — push notifications and daily digest
    - role: ntfy-alerts
      tags: [ntfy-alerts]

    # 23. fail2ban — SSH, nginx rate-limit, and Keycloak auth jails
    - role: fail2ban
      tags: [fail2ban]

    # 24. Certbot — Let's Encrypt auto-renewal and cert expiry monitoring
    - role: certbot
      tags: [certbot]
