---
# ansible/requirements.yml — Galaxy role and collection dependencies
# Install before running the playbook:
#   ansible-galaxy install -r ansible/requirements.yml
# (handled automatically by: make configure)

roles:
  - name: konstruktoid.hardening
    src: https://github.com/konstruktoid/ansible-role-hardening
    version: v4.4.1

collections:
  # ini_file module (used by cape role for conf edits)
  - name: community.general
    version: "12.5.0"
  # PostgreSQL modules (used by postgres role for DB/user management)
  - name: community.postgresql
    version: ">=3.0.0"
  # sysctl module (kvm, networking, podman roles) and mount (pipeline role)
  - name: ansible.posix
    version: ">=1.5.4"
  # ipaddr filter (cape, frontend, api roles) — splits the host out of
  # wireguard_address. Needs the netaddr Python package on the controller.
  - name: ansible.utils
    version: ">=2.5.0"
  # openssh_keypair, used by konstruktoid.hardening's sshconfig.yml. NOTHING in
  # this repo imports it — it is a transitive dependency of the pinned role, and
  # the role does not declare its own collection requirements, so nobody
  # installs it for us.
  #
  # It was missing here for as long as the role has been pinned. It only
  # surfaced on a second workstation: `ansible` (the bundle) ships
  # community.crypto, `ansible-core` does not, and this machine has core 2.21.2.
  # On the original laptop the dependency was satisfied by accident.
  - name: community.crypto
    version: ">=2.20.0"
