---
# roles/pipeline/defaults/main.yml

# Pipeline install directory
pipeline_install_dir: /opt/pipeline
pipeline_reports_dir: /opt/pipeline/reports

# Cape API polling
pipeline_cape_poll_interval: 30   # seconds between status checks
pipeline_cape_timeout: 1200       # 20 minutes max wait for Cape

# Report retention (days) — cron job purges older reports
pipeline_report_retention_days: 7

# Volatility trigger signatures — Cape signature names that trigger Stage 3
pipeline_volatility_triggers:
  - injection_createremotethread
  - injection_ntqueueapcthread
  - injection_write_process
  - injection_rwx
  - process_hollowing
  - reflective_dll_loading
  - shellcode_execution
  - api_unhooking
  - antisandbox_unhook
  - creates_suspended_process
  - packed_binary
  - creates_service
  - modifies_runkey
  - scheduled_task_creation
  - rootkit_ssdt_hook

# Extra Volatility plugins mapped by trigger category
pipeline_volatility_extra_plugins:
  injection:
    triggers:
      - injection_createremotethread
      - injection_ntqueueapcthread
      - injection_write_process
      - injection_rwx
      - creates_suspended_process
    plugins:
      - windows.handles
  # vadinfo is expensive (10+ min on 4GB dumps) — only run for techniques
  # where full memory layout matters, not standard injection
  memory_layout:
    triggers:
      - process_hollowing
      - reflective_dll_loading
    plugins:
      - windows.vadinfo
  persistence:
    triggers:
      - creates_service
      - modifies_runkey
      - scheduled_task_creation
    plugins:
      - windows.registry.printkey
  rootkit:
    triggers:
      - rootkit_ssdt_hook
    plugins:
      - windows.ssdt
      - windows.callbacks
  file_dropping:
    triggers:
      - packed_binary
    plugins:
      - windows.filescan

# Volatility performance
pipeline_volatility_ramdisk: /opt/pipeline/ramdisk   # tmpfs mount for fast dump I/O (empty = disabled)
pipeline_volatility_parallel_workers: 3              # concurrent plugin containers

# PCAP analysis (Stage 2.7) — Zeek + Suricata on Cape's network capture
pipeline_pcap_enabled: true
pipeline_pcap_timeout: 120              # seconds

# Malfind shellcode analysis (Stage 3.5)
# Extract and analyze injected code regions from memory dumps
pipeline_malfind_enabled: true
pipeline_malfind_max_candidates: 5       # top N shellcode regions to analyze
pipeline_malfind_min_size: 256           # skip regions smaller than this (bytes)
pipeline_malfind_max_size: 10485760      # skip regions larger than 10MB
pipeline_malfind_min_score: 2            # minimum heuristic score (0-10)
pipeline_malfind_benign_processes:       # processes with commonly legitimate RWX
  - csrss.exe
  - smss.exe
  - MsMpEng.exe
  - fontdrvhost.exe
