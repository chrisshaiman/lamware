---
# =============================================================================
# roles/pipeline/tasks/main.yml
# Deploys the pipeline orchestrator script, reports directory, and cleanup cron.
#
# Depends on: triage (containerized triage must be available)
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

# -------------------------------------------------------------------------
# System users and shared group — created here because pipeline runs
# before api in site.yml. Both pipeline and lamware-api need the lamware
# group to exist before directory ownership is set.
# -------------------------------------------------------------------------

- name: Create lamware shared group
  ansible.builtin.group:
    name: lamware
    system: true

- name: Create pipeline primary group
  ansible.builtin.group:
    name: pipeline
    system: true

- name: Create lamware-api primary group
  ansible.builtin.group:
    name: lamware-api
    system: true

- name: Create pipeline system user
  ansible.builtin.user:
    name: pipeline
    system: true
    group: pipeline
    groups: lamware
    append: true
    shell: /bin/bash
    home: /home/pipeline
    create_home: true

- name: Configure subuid for pipeline (rootless Podman)
  ansible.builtin.lineinfile:
    path: /etc/subuid
    regexp: "^pipeline:"
    line: "pipeline:200000:65536"
    create: true
    mode: "0644"

- name: Configure subgid for pipeline (rootless Podman)
  ansible.builtin.lineinfile:
    path: /etc/subgid
    regexp: "^pipeline:"
    line: "pipeline:200000:65536"
    create: true
    mode: "0644"

- name: Create Podman config directory for pipeline user
  ansible.builtin.file:
    path: /home/pipeline/.config/containers
    state: directory
    owner: pipeline
    group: pipeline
    mode: "0700"

- name: Create Podman local storage directory for pipeline user
  ansible.builtin.file:
    path: /home/pipeline/.local/share/containers
    state: directory
    owner: pipeline
    group: pipeline
    mode: "0700"

- name: Deploy Podman containers.conf for pipeline user (cgroupfs, no systemd)
  ansible.builtin.copy:
    dest: /home/pipeline/.config/containers/containers.conf
    owner: pipeline
    group: pipeline
    mode: "0644"
    content: |
      [engine]
      cgroup_manager = "cgroupfs"
      events_logger = "file"

- name: Deploy Podman storage.conf for pipeline user
  ansible.builtin.copy:
    dest: /home/pipeline/.config/containers/storage.conf
    owner: pipeline
    group: pipeline
    mode: "0644"
    content: |
      [storage]
      driver = "overlay"
      graphroot = "/home/pipeline/.local/share/containers/storage"

- name: Enable lingering for pipeline user (rootless Podman cgroups)
  ansible.builtin.command:
    cmd: loginctl enable-linger pipeline
  changed_when: false

# -------------------------------------------------------------------------
# Network lockdown — restrict pipeline user to localhost services only.
# The interpret container uses --network=host, so these rules apply to
# LLM API calls. Direct internet access is blocked; all Claude traffic
# goes through the LiteLLM proxy on localhost:4000.
# -------------------------------------------------------------------------

- name: Allow pipeline user to reach LiteLLM proxy (localhost:4000)
  ansible.builtin.iptables:
    chain: OUTPUT
    protocol: tcp
    uid_owner: pipeline
    out_interface: lo
    destination_port: "4000"
    jump: ACCEPT
    comment: "pipeline: LiteLLM proxy"

- name: Allow pipeline user to reach PostgreSQL (localhost:5432)
  ansible.builtin.iptables:
    chain: OUTPUT
    protocol: tcp
    uid_owner: pipeline
    out_interface: lo
    destination_port: "5432"
    jump: ACCEPT
    comment: "pipeline: PostgreSQL"

- name: Allow pipeline user to reach CAPE API (localhost:8000)
  ansible.builtin.iptables:
    chain: OUTPUT
    protocol: tcp
    uid_owner: pipeline
    out_interface: lo
    destination_port: "8000"
    jump: ACCEPT
    comment: "pipeline: CAPE API"

- name: Allow pipeline user to reach MongoDB (localhost:27017)
  ansible.builtin.iptables:
    chain: OUTPUT
    protocol: tcp
    uid_owner: pipeline
    out_interface: lo
    destination_port: "27017"
    jump: ACCEPT
    comment: "pipeline: MongoDB"

- name: Block all other outbound traffic from pipeline user
  ansible.builtin.iptables:
    chain: OUTPUT
    uid_owner: pipeline
    jump: DROP
    comment: "pipeline: block all other outbound"

- name: Create lamware-api system user
  ansible.builtin.user:
    name: lamware-api
    system: true
    group: lamware-api
    groups: lamware
    append: true
    shell: /usr/sbin/nologin
    home: /opt/lamware-api
    create_home: false

- name: Add cape user to lamware group
  ansible.builtin.user:
    name: "{{ cape_user }}"
    groups: lamware
    append: true

# -------------------------------------------------------------------------
# lamware packages — deliver source trees to the host so the pipeline venv
# (pipeline user) and the lamware-api venv can each install lamware_shared
# from the same on-disk source. lamware_pipeline is pipeline-only.
# -------------------------------------------------------------------------

- name: Create package staging directory
  ansible.builtin.file:
    path: "{{ pipeline_install_dir }}/pkg"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0755"

- name: Deploy lamware-shared package source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../shared"
    dest: "{{ pipeline_install_dir }}/pkg/"
    owner: pipeline
    group: lamware
    mode: "0644"

- name: Deploy lamware-pipeline package source
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../pipeline"
    dest: "{{ pipeline_install_dir }}/pkg/"
    owner: pipeline
    group: lamware
    mode: "0644"

- name: Ensure staged package source is traversable by the lamware group
  # Both the pipeline venv (owner) and the api venv (group lamware) install
  # from this tree. Symbolic +X grants execute (traverse) on directories only,
  # leaving files non-executable. Idempotent on already-deployed hosts, unlike
  # copy's directory_mode (which only touches newly created dirs).
  ansible.builtin.file:
    path: "{{ pipeline_install_dir }}/pkg"
    state: directory
    owner: pipeline
    group: lamware
    mode: "u=rwX,g=rX,o="
    recurse: true

# -------------------------------------------------------------------------
# Pipeline virtualenv — the host-side orchestrator (run-pipeline.py), report
# generator, and wrapper DB-failure handler run from this venv, so the
# pipeline runtime no longer depends on --break-system-packages.
#
# The `pipeline` user is iptables-network-locked (cannot reach PyPI), so:
#   * the venv is created as the pipeline user (offline — bundled ensurepip)
#   * a wheelhouse is built as ROOT (root is not network-locked, and building
#     on the host guarantees correct platform/python3.12 wheels)
#   * all installs run as the pipeline user, offline, from that wheelhouse
# -------------------------------------------------------------------------

- name: Ensure python3-venv is installed (for the pipeline virtualenv)
  ansible.builtin.apt:
    name: python3-venv
    state: present

- name: Create the pipeline virtualenv (offline; bundled ensurepip)
  ansible.builtin.command:
    cmd: python3 -m venv "{{ pipeline_install_dir }}/venv"
    creates: "{{ pipeline_install_dir }}/venv/bin/pip"
  become: true
  become_user: pipeline

- name: Create the pipeline wheelhouse directory
  ansible.builtin.file:
    path: "{{ pipeline_install_dir }}/wheelhouse"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"

- name: Check whether the wheelhouse already holds wheels
  ansible.builtin.find:
    paths: "{{ pipeline_install_dir }}/wheelhouse"
    patterns: "*.whl"
  register: pipeline_wheelhouse_existing

- name: Populate the wheelhouse as root (reaches PyPI; the pipeline user cannot)
  # Building on the host guarantees wheels match the host platform + python3.12.
  # Includes pip/setuptools/wheel because py3.12 venvs omit setuptools, and the
  # offline source-builds of the lamware packages need a build backend.
  ansible.builtin.command:
    cmd: >
      python3 -m pip download
      --dest {{ pipeline_install_dir }}/wheelhouse
      pip setuptools wheel
      requests weasyprint markdown psycopg2-binary pydantic
  register: pipeline_wheelhouse
  changed_when: "'Saved' in pipeline_wheelhouse.stdout"
  when: pipeline_wheelhouse_existing.matched | int == 0

- name: Make the wheelhouse readable by the pipeline user
  # The populate step runs as ROOT (the pipeline user is network-locked), and on
  # a hardened host root's umask leaves the downloaded wheels 0600 root:root —
  # unreadable by the become_user: pipeline installs that follow. Hand ownership
  # to pipeline:lamware and grant traverse/read (symbolic +X = dirs only). Runs
  # UNCONDITIONALLY (not gated on the populate `when`) so a wheelhouse left
  # root-owned by an earlier failed run self-heals on the next converge.
  ansible.builtin.file:
    path: "{{ pipeline_install_dir }}/wheelhouse"
    owner: pipeline
    group: lamware
    mode: "u=rwX,g=rX,o="
    recurse: true

- name: Bootstrap build tools into the venv (offline)
  ansible.builtin.command:
    cmd: >
      {{ pipeline_install_dir }}/venv/bin/pip install
      --no-index --find-links {{ pipeline_install_dir }}/wheelhouse
      --upgrade pip setuptools wheel
  become: true
  become_user: pipeline
  register: pipeline_venv_buildtools
  changed_when: "'Successfully installed' in pipeline_venv_buildtools.stdout"

- name: Install third-party runtime deps into the venv (offline, as pipeline)
  ansible.builtin.command:
    cmd: >
      {{ pipeline_install_dir }}/venv/bin/pip install
      --no-index --find-links {{ pipeline_install_dir }}/wheelhouse
      requests weasyprint markdown psycopg2-binary
  become: true
  become_user: pipeline
  register: pipeline_venv_thirdparty
  changed_when: "'Successfully installed' in pipeline_venv_thirdparty.stdout"

- name: Install lamware-shared + lamware-pipeline into the venv (offline, as pipeline)
  # --no-build-isolation: use the venv's just-installed setuptools instead of
  # fetching a build backend from PyPI (which the pipeline user cannot reach).
  ansible.builtin.command:
    cmd: >
      {{ pipeline_install_dir }}/venv/bin/pip install
      --no-index --no-build-isolation --find-links {{ pipeline_install_dir }}/wheelhouse
      {{ pipeline_install_dir }}/pkg/shared
      {{ pipeline_install_dir }}/pkg/pipeline
  become: true
  become_user: pipeline
  register: pipeline_venv_local
  changed_when: "'Successfully installed' in pipeline_venv_local.stdout"

- name: Create pipeline directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "2750"
  loop:
    - "{{ pipeline_install_dir }}"
    - "{{ pipeline_install_dir }}/stages"
    - "{{ pipeline_reports_dir }}"

- name: Create ramdisk mount point for Volatility
  ansible.builtin.file:
    path: "{{ pipeline_volatility_ramdisk }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "2750"
  when: pipeline_volatility_ramdisk | default('') | length > 0

- name: Mount ramdisk (tmpfs) for Volatility memory dumps
  ansible.posix.mount:
    path: "{{ pipeline_volatility_ramdisk }}"
    src: tmpfs
    fstype: tmpfs
    opts: "size=12g,uid=pipeline,gid=lamware,mode=2750"
    state: mounted
  when: pipeline_volatility_ramdisk | default('') | length > 0

- name: Deploy pipeline config.json
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ pipeline_install_dir }}/config.json"
    owner: pipeline
    group: lamware
    mode: "0640"

- name: Verify the pipeline venv imports every runtime dep (as the pipeline user)
  become: true
  become_user: pipeline
  ansible.builtin.command:
    cmd: >
      {{ pipeline_install_dir }}/venv/bin/python -c
      "import lamware_shared, lamware_pipeline, psycopg2, weasyprint, requests, markdown;
      from lamware_pipeline.config import PipelineConfig;
      from lamware_shared.tool_validators import validate_ghidra_args"
  changed_when: false

- name: Deploy run-pipeline.py
  ansible.builtin.template:
    src: run-pipeline.py.j2
    dest: "{{ pipeline_install_dir }}/run-pipeline.py"
    owner: pipeline
    group: pipeline
    mode: "0750"
  no_log: true  # contains cape_api_key

- name: Deploy pipeline stage modules
  # These 13 stage modules contain no Jinja — plain Python deployed verbatim.
  # copy: resolves src from the role's files/ dir (cape.py.j2 stays a template
  # below because it carries the cape_api_key secret).
  ansible.builtin.copy:
    src: "stages/{{ item }}"
    dest: "{{ pipeline_install_dir }}/stages/{{ item }}"
    owner: pipeline
    group: pipeline
    mode: "0640"
  loop:
    - __init__.py
    - triage.py
    - volatility.py
    - pcap.py
    - dotnet.py
    - go.py
    - pyinstaller.py
    - java.py
    - office.py
    - powershell.py
    - script_analysis.py
    - ghidra.py
    - interpret.py

# cape.py.j2 contains cape_api_key — deploy separately with no_log
- name: Deploy cape stage module (contains API key)
  ansible.builtin.template:
    src: "stages/cape.py.j2"
    dest: "{{ pipeline_install_dir }}/stages/cape.py"
    owner: pipeline
    group: pipeline
    mode: "0640"
  no_log: true

- name: Deploy pipeline helper modules
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ pipeline_install_dir }}/{{ item | replace('.j2', '') }}"
    owner: pipeline
    group: pipeline
    mode: "0640"
  loop:
    - ioc_extract.py.j2

- name: Deploy pipeline helper modules (contain DB password)
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ pipeline_install_dir }}/{{ item | replace('.j2', '') }}"
    owner: pipeline
    group: pipeline
    mode: "0640"
  no_log: true
  loop:
    - db_ingest.py.j2
    - pipeline_status.py.j2

- name: Deploy pipeline wrapper script
  ansible.builtin.template:
    src: run-pipeline-wrapper.sh.j2
    dest: "{{ pipeline_install_dir }}/run-pipeline"
    owner: pipeline
    group: pipeline
    mode: "0750"
  no_log: true  # contains DB password

- name: Deploy generate-report.py
  ansible.builtin.template:
    src: generate-report.py.j2
    dest: "{{ pipeline_install_dir }}/generate-report.py"
    owner: pipeline
    group: pipeline
    mode: "0750"

- name: Create convenience symlink for pipeline
  ansible.builtin.file:
    src: "{{ pipeline_install_dir }}/run-pipeline"
    dest: /usr/local/bin/run-pipeline
    state: link

- name: Create convenience symlink for report generator
  ansible.builtin.file:
    src: "{{ pipeline_install_dir }}/generate-report.py"
    dest: /usr/local/bin/generate-report
    state: link

- name: Deploy cleanup cron script
  ansible.builtin.template:
    src: pipeline-cleanup.sh.j2
    dest: "{{ pipeline_install_dir }}/cleanup.sh"
    owner: pipeline
    group: pipeline
    mode: "0750"

- name: Allow pipeline user to use crontab (hardening restricts via cron.allow)
  ansible.builtin.lineinfile:
    path: /etc/cron.allow
    line: pipeline
    create: true
    mode: "0600"

- name: Schedule daily report cleanup
  ansible.builtin.cron:
    name: "pipeline-report-cleanup"
    user: pipeline
    hour: "3"
    minute: "0"
    job: "{{ pipeline_install_dir }}/cleanup.sh"
