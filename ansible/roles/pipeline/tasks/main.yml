---
# =============================================================================
# roles/pipeline/tasks/main.yml
# Deploys the pipeline orchestrator script, reports directory, and cleanup cron.
#
# Depends on: triage (containerized triage must be available)
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Install pipeline Python dependencies
  ansible.builtin.pip:
    name:
      - requests
      - weasyprint
    state: present
    break_system_packages: true

- name: Fix pip package permissions for cape user
  ansible.builtin.shell: chmod -R a+rX /usr/local/lib/python3.12/dist-packages/
  args:
    executable: /bin/bash
  changed_when: false

- name: Create pipeline directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0750"
  loop:
    - "{{ pipeline_install_dir }}"
    - "{{ pipeline_install_dir }}/stages"
    - "{{ pipeline_reports_dir }}"

- name: Deploy run-pipeline.py
  ansible.builtin.template:
    src: run-pipeline.py.j2
    dest: "{{ pipeline_install_dir }}/run-pipeline.py"
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0750"

- name: Deploy pipeline stage modules
  ansible.builtin.template:
    src: "stages/{{ item }}"
    dest: "{{ pipeline_install_dir }}/stages/{{ item | replace('.j2', '') }}"
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0640"
  loop:
    - __init__.py.j2
    - triage.py.j2
    - cape.py.j2
    - volatility.py.j2
    - ghidra.py.j2
    - interpret.py.j2

- name: Deploy pipeline helper modules
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ pipeline_install_dir }}/{{ item | replace('.j2', '') }}"
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0640"
  loop:
    - ioc_extract.py.j2
    - db_ingest.py.j2

- name: Deploy pipeline wrapper script
  ansible.builtin.template:
    src: run-pipeline-wrapper.sh.j2
    dest: "{{ pipeline_install_dir }}/run-pipeline"
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0750"

- name: Deploy generate-report.py
  ansible.builtin.template:
    src: generate-report.py.j2
    dest: "{{ pipeline_install_dir }}/generate-report.py"
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0750"

- name: Create convenience symlink for pipeline
  ansible.builtin.file:
    src: "{{ pipeline_install_dir }}/run-pipeline"
    dest: /usr/local/bin/run-pipeline
    state: link

- name: Create convenience symlink for report generator
  ansible.builtin.file:
    src: "{{ pipeline_install_dir }}/generate-report.py"
    dest: /usr/local/bin/generate-report
    state: link

- name: Deploy cleanup cron script
  ansible.builtin.template:
    src: pipeline-cleanup.sh.j2
    dest: "{{ pipeline_install_dir }}/cleanup.sh"
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0750"

- name: Allow cape user to use crontab (hardening restricts via cron.allow)
  ansible.builtin.lineinfile:
    path: /etc/cron.allow
    line: "{{ cape_user }}"
    create: true
    mode: "0600"

- name: Schedule daily report cleanup
  ansible.builtin.cron:
    name: "pipeline-report-cleanup"
    user: "{{ cape_user }}"
    hour: "3"
    minute: "0"
    job: "{{ pipeline_install_dir }}/cleanup.sh"
