---
# =============================================================================
# roles/pipeline/tasks/main.yml
# Deploys the pipeline orchestrator script, reports directory, and cleanup cron.
#
# Depends on: triage (containerized triage must be available)
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

# -------------------------------------------------------------------------
# System users and shared group — created here because pipeline runs
# before api in site.yml. Both pipeline and lamware-api need the lamware
# group to exist before directory ownership is set.
# -------------------------------------------------------------------------

- name: Create lamware shared group
  ansible.builtin.group:
    name: lamware
    system: true

- name: Create pipeline primary group
  ansible.builtin.group:
    name: pipeline
    system: true

- name: Create lamware-api primary group
  ansible.builtin.group:
    name: lamware-api
    system: true

- name: Create pipeline system user
  ansible.builtin.user:
    name: pipeline
    system: true
    group: pipeline
    groups: lamware
    append: true
    shell: /bin/bash
    home: /home/pipeline
    create_home: true

- name: Configure subuid for pipeline (rootless Podman)
  ansible.builtin.lineinfile:
    path: /etc/subuid
    regexp: "^pipeline:"
    line: "pipeline:200000:65536"
    create: true
    mode: "0644"

- name: Configure subgid for pipeline (rootless Podman)
  ansible.builtin.lineinfile:
    path: /etc/subgid
    regexp: "^pipeline:"
    line: "pipeline:200000:65536"
    create: true
    mode: "0644"

- name: Create Podman config directory for pipeline user
  ansible.builtin.file:
    path: /home/pipeline/.config/containers
    state: directory
    owner: pipeline
    group: pipeline
    mode: "0700"

- name: Create Podman local storage directory for pipeline user
  ansible.builtin.file:
    path: /home/pipeline/.local/share/containers
    state: directory
    owner: pipeline
    group: pipeline
    mode: "0700"

- name: Deploy Podman containers.conf for pipeline user (cgroupfs, no systemd)
  ansible.builtin.copy:
    dest: /home/pipeline/.config/containers/containers.conf
    owner: pipeline
    group: pipeline
    mode: "0644"
    content: |
      [engine]
      cgroup_manager = "cgroupfs"
      events_logger = "file"

- name: Deploy Podman storage.conf for pipeline user
  ansible.builtin.copy:
    dest: /home/pipeline/.config/containers/storage.conf
    owner: pipeline
    group: pipeline
    mode: "0644"
    content: |
      [storage]
      driver = "overlay"
      graphroot = "/home/pipeline/.local/share/containers/storage"

- name: Enable lingering for pipeline user (rootless Podman cgroups)
  ansible.builtin.command:
    cmd: loginctl enable-linger pipeline
  changed_when: false

- name: Create lamware-api system user
  ansible.builtin.user:
    name: lamware-api
    system: true
    group: lamware-api
    groups: lamware
    append: true
    shell: /usr/sbin/nologin
    home: /opt/lamware-api
    create_home: false

- name: Add cape user to lamware group
  ansible.builtin.user:
    name: "{{ cape_user }}"
    groups: lamware
    append: true

- name: Install pipeline Python dependencies
  ansible.builtin.pip:
    name:
      - requests
      - weasyprint
      - markdown
    state: present
    break_system_packages: true

- name: Fix pip package permissions for pipeline user
  ansible.builtin.shell: chmod -R a+rX /usr/local/lib/python3.12/dist-packages/
  args:
    executable: /bin/bash
  changed_when: false

- name: Create pipeline directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "2750"
  loop:
    - "{{ pipeline_install_dir }}"
    - "{{ pipeline_install_dir }}/stages"
    - "{{ pipeline_reports_dir }}"

- name: Create ramdisk mount point for Volatility
  ansible.builtin.file:
    path: "{{ pipeline_volatility_ramdisk }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "2750"
  when: pipeline_volatility_ramdisk | default('') | length > 0

- name: Mount ramdisk (tmpfs) for Volatility memory dumps
  ansible.posix.mount:
    path: "{{ pipeline_volatility_ramdisk }}"
    src: tmpfs
    fstype: tmpfs
    opts: "size=12g,uid=pipeline,gid=lamware,mode=2750"
    state: mounted
  when: pipeline_volatility_ramdisk | default('') | length > 0

- name: Deploy run-pipeline.py
  ansible.builtin.template:
    src: run-pipeline.py.j2
    dest: "{{ pipeline_install_dir }}/run-pipeline.py"
    owner: pipeline
    group: pipeline
    mode: "0750"
  no_log: true  # contains cape_api_key

- name: Deploy pipeline stage modules
  ansible.builtin.template:
    src: "stages/{{ item }}"
    dest: "{{ pipeline_install_dir }}/stages/{{ item | replace('.j2', '') }}"
    owner: pipeline
    group: pipeline
    mode: "0640"
  loop:
    - __init__.py.j2
    - triage.py.j2
    - volatility.py.j2
    - pcap.py.j2
    - dotnet.py.j2
    - go.py.j2
    - pyinstaller.py.j2
    - java.py.j2
    - office.py.j2
    - powershell.py.j2
    - script_analysis.py.j2
    - ghidra.py.j2
    - interpret.py.j2

# cape.py.j2 contains cape_api_key — deploy separately with no_log
- name: Deploy cape stage module (contains API key)
  ansible.builtin.template:
    src: "stages/cape.py.j2"
    dest: "{{ pipeline_install_dir }}/stages/cape.py"
    owner: pipeline
    group: pipeline
    mode: "0640"
  no_log: true

- name: Deploy pipeline helper modules
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ pipeline_install_dir }}/{{ item | replace('.j2', '') }}"
    owner: pipeline
    group: pipeline
    mode: "0640"
  loop:
    - ioc_extract.py.j2

- name: Deploy pipeline helper modules (contain DB password)
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "{{ pipeline_install_dir }}/{{ item | replace('.j2', '') }}"
    owner: pipeline
    group: pipeline
    mode: "0640"
  no_log: true
  loop:
    - db_ingest.py.j2
    - pipeline_status.py.j2

- name: Deploy pipeline wrapper script
  ansible.builtin.template:
    src: run-pipeline-wrapper.sh.j2
    dest: "{{ pipeline_install_dir }}/run-pipeline"
    owner: pipeline
    group: pipeline
    mode: "0750"
  no_log: true  # contains DB password

- name: Deploy generate-report.py
  ansible.builtin.template:
    src: generate-report.py.j2
    dest: "{{ pipeline_install_dir }}/generate-report.py"
    owner: pipeline
    group: pipeline
    mode: "0750"

- name: Create convenience symlink for pipeline
  ansible.builtin.file:
    src: "{{ pipeline_install_dir }}/run-pipeline"
    dest: /usr/local/bin/run-pipeline
    state: link

- name: Create convenience symlink for report generator
  ansible.builtin.file:
    src: "{{ pipeline_install_dir }}/generate-report.py"
    dest: /usr/local/bin/generate-report
    state: link

- name: Deploy cleanup cron script
  ansible.builtin.template:
    src: pipeline-cleanup.sh.j2
    dest: "{{ pipeline_install_dir }}/cleanup.sh"
    owner: pipeline
    group: pipeline
    mode: "0750"

- name: Allow pipeline user to use crontab (hardening restricts via cron.allow)
  ansible.builtin.lineinfile:
    path: /etc/cron.allow
    line: pipeline
    create: true
    mode: "0600"

- name: Schedule daily report cleanup
  ansible.builtin.cron:
    name: "pipeline-report-cleanup"
    user: pipeline
    hour: "3"
    minute: "0"
    job: "{{ pipeline_install_dir }}/cleanup.sh"
