---
# =============================================================================
# roles/pcap-analysis/tasks/main.yml
# Builds the Zeek + Suricata PCAP analysis container.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Create pcap-analysis directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0750"
  loop:
    - "{{ pcap_analysis_install_dir }}"
    - "{{ pcap_analysis_install_dir }}/build"
    - "{{ pcap_analysis_install_dir }}/output"
    - "{{ pcap_analysis_install_dir }}/rules"

- name: Deploy Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ pcap_analysis_install_dir }}/build/Containerfile"
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0644"

- name: Deploy analyze-pcap.py
  ansible.builtin.template:
    src: analyze-pcap.py.j2
    dest: "{{ pcap_analysis_install_dir }}/build/analyze-pcap.py"
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0755"

- name: Deploy suricata.yaml
  ansible.builtin.template:
    src: suricata.yaml.j2
    dest: "{{ pcap_analysis_install_dir }}/build/suricata.yaml"
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0644"

- name: Download Suricata rules (ET Open)
  ansible.builtin.get_url:
    url: "{{ suricata_rules_url }}"
    dest: "{{ pcap_analysis_install_dir }}/rules/emerging-all.rules"
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0644"

- name: Build pcap-analysis container image
  ansible.builtin.command:
    cmd: >
      podman build
      --network=host
      -t localhost/pcap-analysis:latest
      -f {{ pcap_analysis_install_dir }}/build/Containerfile
      {{ pcap_analysis_install_dir }}/build
  become: true
  become_user: "{{ cape_user }}"
  changed_when: true

- name: Deploy pcap-analysis wrapper script
  ansible.builtin.template:
    src: run-pcap-analysis-wrapper.sh.j2
    dest: "{{ pcap_analysis_install_dir }}/run-pcap-analysis"
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0750"

- name: Create convenience symlink
  ansible.builtin.file:
    src: "{{ pcap_analysis_install_dir }}/run-pcap-analysis"
    dest: /usr/local/bin/run-pcap-analysis
    state: link
