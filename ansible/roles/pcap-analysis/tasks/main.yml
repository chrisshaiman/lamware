---
# =============================================================================
# roles/pcap-analysis/tasks/main.yml
# Builds the Zeek + Suricata PCAP analysis container.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Create pcap-analysis directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"
  loop:
    - "{{ pcap_analysis_install_dir }}"
    - "{{ pcap_analysis_install_dir }}/build"
    - "{{ pcap_analysis_install_dir }}/output"
    - "{{ pcap_analysis_install_dir }}/rules"

- name: Deploy Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ pcap_analysis_install_dir }}/build/Containerfile"
    owner: pipeline
    group: pipeline
    mode: "0644"

- name: Deploy analyze-pcap.py
  ansible.builtin.template:
    src: analyze-pcap.py.j2
    dest: "{{ pcap_analysis_install_dir }}/build/analyze-pcap.py"
    owner: pipeline
    group: pipeline
    mode: "0755"

- name: Deploy suricata.yaml
  ansible.builtin.template:
    src: suricata.yaml.j2
    dest: "{{ pcap_analysis_install_dir }}/build/suricata.yaml"
    owner: pipeline
    group: pipeline
    mode: "0644"

- name: Download Suricata rules (ET Open)
  ansible.builtin.get_url:
    url: "{{ suricata_rules_url }}"
    dest: "{{ pcap_analysis_install_dir }}/rules/emerging-all.rules"
    owner: pipeline
    group: pipeline
    mode: "0644"

# Fetched by the role, as root, because the build runs as `pipeline` — a user
# whose egress allowlist covers loopback:5432 and loopback:8000 and which cannot
# resolve DNS. The `curl` this replaces could never have worked from a cold
# cache; it survived on an image built before that lockdown existed.
#
# Since ADR-023 the key is not part of the image: the build no longer runs apt.
# It is handed to lamware-fetch's package resolution (signing_keys below), which
# is the only place the Zeek repo is read.
- name: Fetch the Zeek repo signing key
  ansible.builtin.get_url:
    url: "{{ zeek_repo_key_url }}"
    dest: "{{ zeek_repo_key_path }}"
    checksum: "sha256:{{ zeek_repo_key_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Remove the key from where the image build used to read it
  ansible.builtin.file:
    path: "{{ pcap_analysis_install_dir }}/build/zeek-repo-key.asc"
    state: absent

- name: Build the pcap-analysis image hermetically (ADR-023)
  ansible.builtin.include_role:
    name: build-fetch
    tasks_from: image
  vars:
    hb_name: pcap-analysis
    hb_build_dir: "{{ pcap_analysis_install_dir }}/build"
    hb_tag: localhost/pcap-analysis:latest
    hb_base_images: ["{{ pcap_analysis_base_image }}"]
    hb_deb_sets:
      - name: main
        image: "{{ pcap_analysis_base_image }}"
        sources: "{{ pcap_analysis_apt_sources }}"
        packages: "{{ pcap_analysis_debs }}"
      # Zeek in its own set: the only one that reads OBS, and the only one whose
      # version is not fixed by a snapshot (see defaults).
      - name: zeek
        image: "{{ pcap_analysis_base_image }}"
        sources: "{{ pcap_analysis_apt_sources + pcap_analysis_zeek_obs_sources }}"
        packages: "{{ pcap_analysis_zeek_debs }}"
        signing_keys: ["{{ zeek_repo_key_path }}"]

- name: Deploy pcap-analysis wrapper script
  ansible.builtin.template:
    src: run-pcap-analysis-wrapper.sh.j2
    dest: "{{ pcap_analysis_install_dir }}/run-pcap-analysis"
    owner: pipeline
    group: pipeline
    mode: "0750"

- name: Create convenience symlink
  ansible.builtin.file:
    src: "{{ pcap_analysis_install_dir }}/run-pcap-analysis"
    dest: /usr/local/bin/run-pcap-analysis
    state: link
