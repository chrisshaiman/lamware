---
# roles/ntfy-alerts/tasks/main.yml
#
# Deploys the ntfy notification module and daily digest.
#
# Author: Christopher Shaiman
# License: Apache 2.0

# Alert delivery runs as its own user (#729). Every sender that ran as
# `pipeline` — the daily digest and the spool runner — failed after the pipeline
# egress lockdown (no DNS, no route to ntfy). This user is outside it.
- name: Create the alert delivery user
  ansible.builtin.user:
    name: "{{ ntfy_user }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin

# setgid so files the digest writes (latest-digest.json, which /api/alerts
# serves) are group lamware without the notify user joining that group.
- name: Create ntfy-alerts directory
  ansible.builtin.file:
    path: "{{ ntfy_install_dir }}"
    state: directory
    owner: "{{ ntfy_user }}"
    group: lamware
    mode: "2750"

# The directory used to be pipeline-owned, so its bytecode cache is too. Python
# loads a cached .pyc whose recorded source mtime and size match without
# re-reading the source, so a pipeline-writable cache in a directory the notify
# user imports from would let pipeline run code as the notify user, which has
# egress. Removed when it is not the notify user's; it regenerates.
- name: Check who owns the module bytecode cache
  ansible.builtin.stat:
    path: "{{ ntfy_install_dir }}/__pycache__"
  register: ntfy_pycache

- name: Remove a bytecode cache the notify user does not own
  ansible.builtin.file:
    path: "{{ ntfy_install_dir }}/__pycache__"
    state: absent
  when: ntfy_pycache.stat.exists and ntfy_pycache.stat.pw_name != ntfy_user

- name: Hand the digest's existing output files to the notify user
  ansible.builtin.file:
    path: "{{ ntfy_install_dir }}/{{ item }}"
    owner: "{{ ntfy_user }}"
    group: lamware
    mode: "0640"
  loop: [digest.log, digest.err, latest-digest.json]
  failed_when: false   # absent on a fresh host; the digest creates them

- name: Deploy ntfy notification module
  ansible.builtin.template:
    src: ntfy_notify.py.j2
    dest: "{{ ntfy_install_dir }}/ntfy_notify.py"
    owner: "{{ ntfy_user }}"
    # group lamware, matching the DIRECTORY, not pipeline (#347). auto-feeder
    # runs as its own user and is in lamware; with group pipeline it could
    # traverse the directory and not read the module. It has been importing
    # successfully only because a stale, group-readable .pyc happened to be
    # valid — CPython validates the cache by stat()ing the source and then
    # loads the bytecode without opening it. The next redeploy invalidates
    # that cache, and the import raises PermissionError, which is an OSError
    # and NOT caught by the `except ImportError` guard around it.
    group: lamware
    mode: "0750"
  # Carries ntfy_topic, which is the ONLY access control on a public ntfy
  # relay — see #352. --diff would print it. Same reasoning as the digest
  # below; not no_log, for the same reason.
  diff: false

# Owner-only: only the notify user runs it, and it carries the DB password and
# the LiteLLM key. It used to be group lamware, readable by every member.
- name: Deploy daily digest script
  ansible.builtin.template:
    src: daily-digest.py.j2
    dest: "{{ ntfy_install_dir }}/daily-digest.py"
    owner: "{{ ntfy_user }}"
    group: "{{ ntfy_user }}"
    mode: "0700"
  # Suppresses the rendered body under --diff, which would otherwise print
  # litellm_master_key. NOT no_log: that also censors failure messages, so a
  # firing `| mandatory` would report "censored" instead of naming the missing
  # variable — the opaque-guard problem #238 exists to fix.
  diff: false

# -------------------------------------------------------------------------
# Relay for alerts raised by pipeline-uid processes (#729)
#
# The spool runner runs as pipeline and cannot reach ntfy. It hands the alert
# over as a file (ntfy_enqueue.py); a path unit delivers it as the notify user
# (ntfy_relay.py). Pipeline gains no code execution and no network: it can only
# submit alert text, which the relay size-caps, rate-limits and defangs.
# -------------------------------------------------------------------------

- name: Create the alert drop box
  # 1730 notify:pipeline — pipeline can create files (w+x) but not list, read,
  # or (sticky) delete anyone else's; nobody else can enter.
  ansible.builtin.file:
    path: "{{ ntfy_dropbox_dir }}"
    state: directory
    owner: "{{ ntfy_user }}"
    group: pipeline
    mode: "1730"

- name: Deploy the alert enqueue script (run by pipeline-uid callers)
  ansible.builtin.template:
    src: ntfy_enqueue.py.j2
    dest: "{{ ntfy_install_dir }}/ntfy_enqueue.py"
    owner: "{{ ntfy_user }}"
    group: lamware
    mode: "0750"

- name: Deploy the alert relay
  ansible.builtin.template:
    src: ntfy_relay.py.j2
    dest: "{{ ntfy_install_dir }}/ntfy_relay.py"
    owner: "{{ ntfy_user }}"
    group: "{{ ntfy_user }}"
    mode: "0700"

- name: Deploy the alert relay units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - lamware-notify-relay.service
    - lamware-notify-relay.path

- name: Enable and start the relay trigger
  ansible.builtin.systemd:
    name: lamware-notify-relay.path
    enabled: true
    state: started
    # Unconditional and cheap: picks up a changed .service/.path on every run.
    daemon_reload: true

# -------------------------------------------------------------------------
# Digest scheduling
#
# Gated on ntfy_digest_enabled ALONE, not on ntfy_enabled (#351).
#
# ntfy_enabled is a DELIVERY setting; latest-digest.json is generated DATA that
# /api/alerts serves to the dashboard. Coupling them meant "I do not want phone
# notifications" silently also meant "the dashboard stops updating", with no
# error and no staleness indicator. send_alert already no-ops when disabled, so
# the digest still generates and the push simply does not happen.
#
# A systemd timer, not cron (#729): the notify user is not in /etc/cron.allow,
# which every hardening run rewrites, and has no reason to own a crontab.
# -------------------------------------------------------------------------

- name: Deploy the daily digest units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - lamware-digest.service
    - lamware-digest.timer

- name: Schedule the daily digest
  ansible.builtin.systemd:
    name: lamware-digest.timer
    enabled: true
    state: started
    daemon_reload: true
  when: ntfy_digest_enabled | bool

- name: Unschedule the daily digest if disabled
  ansible.builtin.systemd:
    name: lamware-digest.timer
    enabled: false
    state: stopped
    daemon_reload: true
  when: not (ntfy_digest_enabled | bool)

# -------------------------------------------------------------------------
# Orphaned schedules (#348)
#
# `ansible.builtin.cron` is scoped per user, so an entry installed under a
# PREVIOUS owner is invisible to both tasks above: the role can neither remove
# it nor report it. The digest cron was once installed for `cape`, the role
# later moved to `pipeline`, and the cape copy kept firing every night at 20:00
# — failing with "Permission denied" against a 0750 pipeline:pipeline script,
# into the same log the working copy writes, since at least 2026-08-04.
#
# Enumerated explicitly rather than globbed: removing cron entries by pattern
# across every user on the host is a much larger blast radius than this problem
# justifies.
# -------------------------------------------------------------------------

- name: Remove orphaned digest cron entries from previous owners
  ansible.builtin.cron:
    name: "lamware daily digest"
    user: "{{ item }}"
    state: absent
  loop: "{{ ntfy_digest_former_cron_users }}"

- name: Assert no crontab schedules the digest, and the timer matches the setting
  # The removal above only covers owners we thought to name. This checks the
  # outcome instead of trusting the list: a job left in any crontab would run
  # alongside the timer, which is precisely how #348 hid.
  ansible.builtin.shell: |
    set -o pipefail
    n=$(grep -l "daily-digest.py" /var/spool/cron/crontabs/* 2>/dev/null | wc -l)
    t=$(systemctl is-enabled lamware-digest.timer 2>/dev/null || true)
    echo "$n $t"
  args:
    executable: /bin/bash
  register: ntfy_digest_schedule
  changed_when: false
  failed_when: >
    (ntfy_digest_schedule.stdout.split() | first | int) != 0
    or ((ntfy_digest_enabled | bool)
        != ((ntfy_digest_schedule.stdout.split() | last) == 'enabled'))
