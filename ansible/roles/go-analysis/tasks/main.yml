---
# =============================================================================
# roles/go-analysis/tasks/main.yml
# Builds the GoReSym Go binary analysis container.
#
# GoReSym (MIT licensed) extracts function names, types, and build info
# from Go binaries by parsing the pclntab metadata structure.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Create go-analysis directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: lamware
    mode: "0750"
  loop:
    - "{{ go_analysis_install_dir }}"
    - "{{ go_analysis_install_dir }}/build"

- name: Create the data directories (pipeline's; ADR-025)
  # Runtime output only. Everything else under the install directory is
  # root-owned code the pipeline reads and runs but cannot change.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"
  loop:
    - "{{ go_analysis_install_dir }}/output"

- name: Root-own what is already in the build context (ADR-025)
  # Earlier deploys left these pipeline-owned, and a file this role no longer
  # ships would keep its old owner. follow: false: never chown a link's target.
  ansible.builtin.file:
    path: "{{ go_analysis_install_dir }}/build"
    state: directory
    owner: root
    group: lamware
    # g+rX: the pipeline (group lamware) must read the context it builds;
    # go-w: and must not write it. Symbolic, so existing 0644/0755 files keep
    # their modes and a deploy does not change the context for nothing.
    mode: "u+rwX,g+rX,go-w"
    recurse: true
    follow: false

- name: Download GoReSym release
  ansible.builtin.get_url:
    url: "{{ goresym_url }}"
    dest: "{{ go_analysis_install_dir }}/build/GoReSym-linux.zip"
    # The version says what to ask for; the hash says which bytes are acceptable.
    checksum: "sha256:{{ goresym_sha256 }}"
    owner: root
    group: lamware
    mode: "0644"

- name: Extract GoReSym binary
  ansible.builtin.unarchive:
    src: "{{ go_analysis_install_dir }}/build/GoReSym-linux.zip"
    dest: "{{ go_analysis_install_dir }}/build/"
    remote_src: true
    owner: root
    group: lamware

- name: Deploy Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ go_analysis_install_dir }}/build/Containerfile"
    owner: root
    group: lamware
    mode: "0644"

- name: Deploy analyze-go.py
  ansible.builtin.template:
    src: analyze-go.py.j2
    dest: "{{ go_analysis_install_dir }}/build/analyze-go.py"
    owner: root
    group: lamware
    mode: "0755"

- name: Build the go-analysis image hermetically (ADR-023)
  ansible.builtin.include_role:
    name: build-fetch
    tasks_from: image
  vars:
    hb_name: go-analysis
    hb_build_dir: "{{ go_analysis_install_dir }}/build"
    hb_tag: localhost/go-analysis:latest
    hb_base_images:
      - ref: "{{ build_fetch_python_slim }}"
        id: "{{ build_fetch_python_slim_id }}"

- name: Deploy go-analysis wrapper script
  ansible.builtin.template:
    src: run-go-analysis-wrapper.sh.j2
    dest: "{{ go_analysis_install_dir }}/run-go-analysis"
    owner: root
    group: lamware
    mode: "0750"

- name: Create convenience symlink
  ansible.builtin.file:
    src: "{{ go_analysis_install_dir }}/run-go-analysis"
    dest: /usr/local/bin/run-go-analysis
    state: link
