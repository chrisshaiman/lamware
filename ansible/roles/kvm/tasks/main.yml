---
# =============================================================================
# roles/kvm/tasks/main.yml
# Ensures KVM/QEMU/libvirt are installed and configured for Cape sandbox use.
# Packer already installed the packages; this role ensures services are
# enabled, the cape user has the right group memberships, and hugepages
# are configured for stable VM memory allocation.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

# Packer installs these packages, but ensure idempotency in case this role
# is ever run against a freshly provisioned host without a Packer image.
- name: Ensure KVM and libvirt packages are present
  ansible.builtin.apt:
    name:
      - qemu-kvm
      - qemu-utils
      - qemu-system-data
      - libvirt-daemon-system
      - libvirt-clients
      - virtinst
      - cpu-checker
      - libguestfs-tools
      - bridge-utils
      - dnsmasq-base
      - libhugetlbfs-bin
      - ovmf
      - swtpm
      - swtpm-tools
      - seabios
      - ipxe-qemu
    state: present
    update_cache: false

- name: Ensure libvirt group exists
  ansible.builtin.group:
    name: libvirt
    state: present

- name: Enable and start libvirtd
  ansible.builtin.systemd:
    name: libvirtd
    state: started
    enabled: true

# CAPE drives its guests through libvirt as the cape user. `libvirt` is what lets
# it reach the read-write socket; what it may do there is decided by the access
# rule below (ADR-027), not by the group. It is not in `kvm`: libvirt starts QEMU
# as libvirt-qemu, and nothing in CAPE opens /dev/kvm, so the group was only a
# host-kernel surface and write access to group-writable guest disks.
- name: Add cape user to the libvirt group
  ansible.builtin.user:
    name: "{{ cape_user }}"
    groups: libvirt
    append: true

- name: Read the kvm group's members
  ansible.builtin.getent:
    database: group
    key: kvm

- name: Take cape out of the kvm group (ADR-027)
  ansible.builtin.command: gpasswd -d {{ cape_user }} kvm
  when: cape_user in (ansible_facts.getent_group.kvm[2] | default('')).split(',')
  changed_when: true
  register: kvm_cape_left_kvm

# A process keeps the groups it started with: CAPE's services hold kvm until they
# restart. cape-rooter runs as root and is unaffected. cape lingers, so its
# systemd user manager runs from boot and passes kvm to everything it starts; it
# was missed the first time (security-test check 19 caught it).
- name: Read cape's uid (its user manager is user@<uid>)
  ansible.builtin.getent:
    database: passwd
    key: "{{ cape_user }}"
  when: kvm_cape_left_kvm is changed

- name: Restart CAPE and cape's user manager so they drop the kvm group
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop:
    - cape
    - cape-processor
    - cape-web
    - "user@{{ ansible_facts.getent_passwd[cape_user][1] }}.service"
  when: kvm_cape_left_kvm is changed

# --- libvirt access control (ADR-027) ----------------------------------------
# The rule goes in BEFORE access_drivers is switched on: with access control on and
# no rule, libvirt's own defaults apply, and they refuse snapshot/start/stop/... to
# every caller, root included (measured: task 1312 failed that way).
- name: Install the libvirt access rule
  ansible.builtin.template:
    src: 49-lamware-libvirt.rules.j2
    dest: /etc/polkit-1/rules.d/49-lamware-libvirt.rules
    owner: root
    group: root
    mode: "0644"

- name: Remove the audit rule left by the ADR-027 spike
  ansible.builtin.file:
    path: /etc/polkit-1/rules.d/49-lamware-libvirt-audit.rules
    state: absent

- name: Switch on libvirt access control
  ansible.builtin.lineinfile:
    path: /etc/libvirt/libvirtd.conf
    regexp: '^\s*access_drivers\s*='
    line: 'access_drivers = [ "polkit" ]   # ADR-027, managed by Ansible (kvm role)'
  register: kvm_libvirt_acl_conf

# libvirtd reads access_drivers only at start. A restart does not stop running
# guests, but CAPE loses its connection mid-analysis, so refuse rather than restart
# under a detonation.
- name: List running guests before restarting libvirtd
  ansible.builtin.command: virsh -c qemu:///system list --name
  register: kvm_running_guests
  changed_when: false
  when: kvm_libvirt_acl_conf is changed

- name: Refuse to restart libvirtd under a running guest
  ansible.builtin.assert:
    that: kvm_running_guests.stdout | trim == ""
    fail_msg: "guests running ({{ kvm_running_guests.stdout | trim }}); re-run when the sandbox is idle"
  when: kvm_libvirt_acl_conf is changed

- name: Restart libvirtd to apply access control
  ansible.builtin.systemd_service:
    name: libvirtd
    state: restarted
  when: kvm_libvirt_acl_conf is changed

# Behavioural, as cape: an allowed call succeeds (the control) and a refused one
# is refused. A refusal without the control would also pass with libvirt down.
- name: As cape, list domains (must be allowed)
  ansible.builtin.command: virsh -c qemu:///system list --all --name
  become: true
  become_user: "{{ cape_user }}"
  register: kvm_acl_allowed
  changed_when: false
  failed_when: kvm_acl_allowed.rc != 0 or (cape_guests[0].name not in kvm_acl_allowed.stdout)

- name: As cape, list networks (must be refused)
  ansible.builtin.command: virsh -c qemu:///system net-list --all
  become: true
  become_user: "{{ cape_user }}"
  register: kvm_acl_refused
  changed_when: false
  failed_when: kvm_acl_refused.rc == 0 or 'access denied' not in kvm_acl_refused.stderr

# Hugepages pre-allocate memory for KVM guests, reducing latency from
# page faults during analysis and preventing the host from swapping VM
# memory under load. Count set via kvm_hugepages_2mb (defaults/main.yml).
- name: Configure hugepages in GRUB
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX='
    line: 'GRUB_CMDLINE_LINUX="hugepages={{ kvm_hugepages_2mb }} default_hugepagesz=2M hugepagesz=2M"'
    backup: true
  notify: Update GRUB

- name: Set hugepages at runtime (takes effect without reboot)
  ansible.posix.sysctl:
    name: vm.nr_hugepages
    value: "{{ kvm_hugepages_2mb }}"
    state: present
    sysctl_file: /etc/sysctl.d/90-hugepages.conf
    reload: true

# Disable the default virbr0 NAT network — analysis VMs must not have
# an uncontrolled internet path. The networking role creates the air-gapped
# detonation network instead.
- name: Check if default libvirt network is active
  ansible.builtin.command: virsh net-info default
  register: kvm_virsh_default_info
  changed_when: false
  failed_when: false

- name: Destroy default libvirt network if active
  ansible.builtin.command: virsh net-destroy default
  when: >
    kvm_virsh_default_info.rc == 0 and
    'Active:         yes' in kvm_virsh_default_info.stdout
  changed_when: true

- name: Undefine default libvirt network
  ansible.builtin.command: virsh net-undefine default
  when: kvm_virsh_default_info.rc == 0
  changed_when: true
  failed_when: false

# ---------------------------------------------------------------------------
# Nested virtualisation OFF for detonation guests (#305, CVE-2026-64561)
# ---------------------------------------------------------------------------
#
# Zapscape is a use-after-free in KVM's shadow-MMU recursive zap path that gives a
# guest-to-host escape with root. Its two controllable prerequisites are kernel
# privilege inside the L1 guest, and nested virtualisation exposed to that guest.
#
# The first is satisfied here BY DESIGN: these guests detonate live malware with no
# in-guest containment, so SYSTEM and driver loading are expected, not exceptional.
# That leaves the second as the only prerequisite we control.
#
# Verified on the host 2026-08-06: kernel 6.8.0-110-generic, GenuineIntel,
# kvm_intel nested = Y, and the live domain XML passing `host-passthrough` with only
# the `hypervisor` CPUID bit disabled — so VMX was reaching the guests.
#
# WHY HOST-WIDE RATHER THAN PER-GUEST XML. `<feature policy='disable' name='vmx'/>`
# in guest-domain.xml.j2 has the same CPUID effect, but has to be remembered for every
# guest anyone defines later, and a forgotten one fails open and silently. A module
# parameter cannot be forgotten. Same reasoning as #238: a control that depends on
# remembering is documentation, not enforcement.
#
# WHY THIS STAYS EVEN AFTER THE KERNEL IS PATCHED (decision deferred, see the backlog
# item on #305). Patching fixes THIS bug; disabling nesting removes the precondition
# for the next one. The same researcher has published three KVM escapes — Januscape
# (CVE-2026-53359), ITScape and Zapscape, one of them a 16-year-old flaw — so this is
# an actively productive attack surface, and nothing in this deployment uses nesting.
#
# COST: a guest can no longer see VMX in CPUID. That is itself a weak virtualisation
# tell against ADR-012's anti-detection goal, but a mild one — plenty of real corporate
# machines ship with VT-x disabled in firmware — and far weaker than the `hypervisor`
# bit already cleared. Verified against the Win11 build first: no VBS/HVCI/Device Guard
# configuration anywhere in packer or the autounattend, no <hyperv> enlightenments in
# the domain XML, and Secure Boot deliberately left in Setup Mode with no keys enrolled,
# which is what stops Windows 11 auto-enabling VBS on otherwise capable hardware.
- name: Disable nested virtualisation on the KVM modules (#305)
  ansible.builtin.copy:
    dest: /etc/modprobe.d/99-lamware-no-nested.conf
    mode: "0644"
    content: |
      # Managed by Ansible (roles/kvm) — see #305 / CVE-2026-64561.
      # Detonation guests run hostile code; nested virtualisation is an escape
      # prerequisite and is unused by this deployment. Do not enable without
      # reading the rationale in roles/kvm/tasks/main.yml.
      options kvm_intel nested=0
      options kvm_amd nested=0
  register: kvm_nested_conf

# Deliberately NOT auto-reloading the module. `modprobe -r kvm_intel` requires every
# VM to be stopped, so doing it inside a routine deploy would kill running detonations
# without warning. Report the pending state instead and let an operator choose the
# window — a loud, accurate "not yet in effect" beats a deploy that silently reboots
# the analysis fleet.
- name: Read the live nested setting
  ansible.builtin.command: cat /sys/module/kvm_intel/parameters/nested
  register: kvm_nested_live
  changed_when: false
  failed_when: false

- name: Report whether the nested-virt mitigation is actually in effect
  ansible.builtin.debug:
    msg: >-
      {{
        'nested virt is OFF — #305 mitigation active'
        if kvm_nested_live.stdout | default('') | trim in ['N', '0']
        else 'WARNING: nested virt is STILL ENABLED (' ~ (kvm_nested_live.stdout | default('?') | trim) ~
             '). The modprobe.d file is in place but the module has not been reloaded. ' ~
             'Stop all guests and `modprobe -r kvm_intel && modprobe kvm_intel`, or reboot. (#305)'
      }}

# =============================================================================
# vhost: kernel-side virtio backends this deployment never uses.
#
# Both detonation guests are defined with emulated e1000 NICs and the qemu
# (userspace) disk driver, and neither has a vsock device, so vhost_net,
# vhost_vsock and the vhost core never load in normal operation (lsmod on the
# host: none present). What they offer instead is attack surface: /dev/vhost-*
# are 0660 root:kvm, and the kvm group includes the cape service account,
# whose job is to run hostile code one layer away. A vhost bug reachable from
# that device is a host-kernel bug reachable by the user most exposed to
# compromise, for a feature nothing here needs.
#
# `install <module> /bin/false` refuses autoload and manual load alike;
# `blacklist` alone only stops alias-driven autoload. Both are written.
# =============================================================================

- name: Disable the unused vhost kernel modules
  ansible.builtin.copy:
    dest: /etc/modprobe.d/99-lamware-no-vhost.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/kvm). Guests use emulated e1000 and the qemu
      # disk driver; no vsock. See roles/kvm/tasks/main.yml for the rationale.
      blacklist vhost
      blacklist vhost_net
      blacklist vhost_vsock
      install vhost /bin/false
      install vhost_net /bin/false
      install vhost_vsock /bin/false

# As with nested virt: a modprobe.d file cannot unload a module that is already
# resident. Report the live state rather than assume the file took effect.
- name: Read which vhost modules are loaded
  ansible.builtin.shell:
    cmd: set -o pipefail; lsmod | awk '$1 ~ /^vhost/ {print $1}'
    executable: /bin/bash
  register: kvm_vhost_live
  changed_when: false
  failed_when: false

- name: Report whether the vhost modules are actually absent
  ansible.builtin.debug:
    msg: >-
      {{
        'no vhost module is loaded — the modprobe.d refusal is in effect'
        if (kvm_vhost_live.stdout | default('') | trim) == ''
        else 'WARNING: vhost modules STILL LOADED (' ~ (kvm_vhost_live.stdout_lines | default([]) | join(', ')) ~
             '). The modprobe.d file refuses future loads only; `modprobe -r` them with the guests stopped, or reboot.'
      }}

# =============================================================================
# AppArmor: let libvirtd execute its own helper.
#
# The shipped libvirtd profile permits /usr/libexec/* but libvirt-daemon installs
# virt-aa-helper at /usr/lib/libvirt/virt-aa-helper, and libvirtd invokes it
# there. When the two disagree, EVERY domain start fails:
#
#   error: internal error: cannot load AppArmor profile 'libvirt-<uuid>'
#   ... cannot execute binary /usr/lib/libvirt/virt-aa-helper: Permission denied
#
#   audit: operation="exec" profile="libvirtd"
#          name="/usr/lib/libvirt/virt-aa-helper" comm="rpc-libvirtd"
#
# That is total loss of analysis capability, and it is silent until something
# tries to start a guest -- Cape's guests are normally shut off, so the host
# looks healthy. Hit on 2026-09-02 after the libvirt packages were reinstalled to
# repair the half-replaced source build (#528).
#
# A local/ include rather than editing the profile: package updates overwrite the
# shipped file and would silently drop an inline edit.
# =============================================================================

- name: Allow libvirtd to execute virt-aa-helper at its packaged path
  ansible.builtin.copy:
    dest: /etc/apparmor.d/local/usr.sbin.libvirtd
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/kvm). See tasks/main.yml for why.
      # The shipped profile allows /usr/libexec/* only; the package installs the
      # helper at /usr/lib/libvirt/. Without this, no domain can start.
      /usr/lib/libvirt/virt-aa-helper PUxr,
      /usr/lib/libvirt/* PUxr,

      # The patched QEMU lives in /usr/local/bin (cape_qemu_binary), where a
      # qemu-system-x86 package update cannot silently replace it with stock
      # and undo the DSDT/brand patching. libvirtd must execute it both to
      # probe capabilities and to define a domain naming it as <emulator>:
      #
      #   error: Failed to start QEMU binary /usr/local/bin/qemu-system-x86_64
      #          for probing: cannot execute binary: Permission denied
      #
      # Without this, `virsh define` fails for EVERY guest, which is how the
      # 2026-09-03 image install stopped.
      /usr/local/bin/qemu-system-x86_64 PUxr,
      /usr/local/bin/qemu-* PUxr,
  notify: Reload libvirtd apparmor profile

# =============================================================================
# Mask the standalone dnsmasq service.
#
# libvirt runs its OWN dnsmasq per network, from
# /var/lib/libvirt/dnsmasq/detonation.conf, and that is the one serving DNS and
# DHCP on the detonation bridge. The packaged system service listens on all
# interfaces by default, so it tries to bind the same address and loses:
#
#   dnsmasq[...]: failed to create listening socket for 192.168.100.1:
#                 Address already in use
#   dnsmasq.service: Failed with result 'exit-code'
#
# It has failed on every boot since. Harmless in itself -- libvirt won the race
# and the guests have DNS -- but a permanently failed unit is noise that trains
# people to ignore `systemctl --failed`, which is where the NEXT real failure
# will appear. This host had four genuine failed units after the 2026-09-02
# reboot and they were harder to spot for it (#528).
#
# Masked rather than disabled: masking survives a package update re-enabling it.
# Masked rather than removing the dnsmasq package: only dnsmasq-base is required
# (installed above), but the full package was installed by hand on this host and
# removing packages out from under an operator is a bigger action than silencing
# a unit we can show is redundant.
# =============================================================================

- name: Mask the standalone dnsmasq service (libvirt runs its own)
  ansible.builtin.systemd_service:
    name: dnsmasq
    enabled: false
    masked: true
    state: stopped
  failed_when: false
