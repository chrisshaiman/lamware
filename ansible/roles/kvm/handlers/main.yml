---
- name: Update GRUB
  ansible.builtin.command: update-grub
  changed_when: true
  # Note: hugepage change in GRUB requires a reboot to take full effect.
  # Runtime sysctl change in tasks/main.yml handles the current session.

- name: Reload libvirtd apparmor profile
  ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/usr.sbin.libvirtd
  changed_when: true
  notify: Restart libvirtd after apparmor reload

- name: Restart libvirtd after apparmor reload
  ansible.builtin.systemd_service:
    name: libvirtd
    state: restarted
  failed_when: false

# --- ADR-027 ------------------------------------------------------------------
# Handlers with `listen` run in the order written here, so the guard comes first.
# A libvirtd restart does not stop running guests, but CAPE loses its connection
# mid-analysis, so refuse rather than restart under a detonation.
- name: List running guests before restarting libvirtd
  ansible.builtin.command: virsh -c qemu:///system list --name
  register: kvm_running_guests
  changed_when: false
  listen: Apply libvirt access control

- name: Refuse to restart libvirtd under a running guest
  ansible.builtin.assert:
    that: kvm_running_guests.stdout | trim == ""
    fail_msg: "guests running ({{ kvm_running_guests.stdout | trim }}); re-run when the sandbox is idle"
  listen: Apply libvirt access control

- name: Restart libvirtd to apply access control
  ansible.builtin.systemd_service:
    name: libvirtd
    state: restarted
  listen: Apply libvirt access control

# cape-rooter runs as root and is unaffected. cape lingers, so its systemd user
# manager runs from boot and passes kvm to everything it starts; it was missed the
# first time (security-test check 19 caught it).
- name: Read cape's uid (its user manager is user@<uid>)
  ansible.builtin.getent:
    database: passwd
    key: "{{ cape_user }}"
  listen: Drop the kvm group from cape's processes

- name: Restart CAPE and cape's user manager so they drop the kvm group
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
  loop:
    - cape
    - cape-processor
    - cape-web
    - "user@{{ ansible_facts.getent_passwd[cape_user][1] }}.service"
  listen: Drop the kvm group from cape's processes
