---
# =============================================================================
# roles/pyinstaller-analysis/tasks/main.yml
# Builds the PyInstaller decompilation container.
#
# pyinstxtractor (GPL-3.0) unpacks PyInstaller archives.
# decompyle3 (GPL-3.0) decompiles Python bytecode to source.
# Both invoked as subprocesses — not linked into Apache 2.0 code.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Create pyinstaller-analysis directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: lamware
    mode: "0750"
  loop:
    - "{{ pyinstaller_analysis_install_dir }}"
    - "{{ pyinstaller_analysis_install_dir }}/build"

- name: Create the data directories (pipeline's; ADR-025)
  # Runtime output only. Everything else under the install directory is
  # root-owned code the pipeline reads and runs but cannot change.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"
  loop:
    - "{{ pyinstaller_analysis_install_dir }}/output"

- name: Root-own what is already in the build context (ADR-025)
  # Earlier deploys left these pipeline-owned, and a file this role no longer
  # ships would keep its old owner. follow: false: never chown a link's target.
  ansible.builtin.file:
    path: "{{ pyinstaller_analysis_install_dir }}/build"
    state: directory
    owner: root
    group: lamware
    # g+rX: the pipeline (group lamware) must read the context it builds;
    # go-w: and must not write it. Symbolic, so existing 0644/0755 files keep
    # their modes and a deploy does not change the context for nothing.
    mode: "u+rwX,g+rX,go-w"
    recurse: true
    follow: false

- name: Deploy Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ pyinstaller_analysis_install_dir }}/build/Containerfile"
    owner: root
    group: lamware
    mode: "0644"

- name: Deploy analyze-pyinstaller.py
  ansible.builtin.template:
    src: analyze-pyinstaller.py.j2
    dest: "{{ pyinstaller_analysis_install_dir }}/build/analyze-pyinstaller.py"
    owner: root
    group: lamware
    mode: "0755"

# Fetched HERE, as root, not inside the container build.
#
# The build runs as `pipeline`, whose outbound is restricted to loopback:5432 and
# loopback:8000 — it cannot resolve DNS at all (#343). Two deploys failed on
# `Could not resolve host: github.com` before that was understood. Ansible already
# runs as root, which has network, so fetching here puts the download where the
# network exists and leaves the build hermetic.
#
# `checksum` is the point, not a formality: it verifies the exact bytes BEFORE the
# build starts. A commit sha alone still trusts whatever the network hands back
# mid-build, and a build is a bad place to discover you got something else.
- name: Fetch pinned pycdc source into the build context
  ansible.builtin.get_url:
    url: "https://codeload.github.com/zrax/pycdc/tar.gz/{{ pycdc_commit }}"
    dest: "{{ pyinstaller_analysis_install_dir }}/build/pycdc.tar.gz"
    checksum: "sha256:{{ pycdc_sha256 }}"
    owner: root
    group: lamware
    mode: "0644"

- name: Fetch pinned pyinstxtractor into the build context
  ansible.builtin.get_url:
    url: >-
      https://raw.githubusercontent.com/extremecoders-re/pyinstxtractor/{{ pyinstxtractor_commit }}/pyinstxtractor.py
    dest: "{{ pyinstaller_analysis_install_dir }}/build/pyinstxtractor.py"
    checksum: "sha256:{{ pyinstxtractor_sha256 }}"
    owner: root
    group: lamware
    mode: "0644"

- name: Build the pyinstaller-analysis image hermetically (ADR-023)
  ansible.builtin.include_role:
    name: build-fetch
    tasks_from: image
  vars:
    hb_name: pyinstaller-analysis
    hb_build_dir: "{{ pyinstaller_analysis_install_dir }}/build"
    hb_tag: localhost/pyinstaller-analysis:latest
    hb_base_images:
      - ref: "{{ build_fetch_python_slim }}"
        id: "{{ build_fetch_python_slim_id }}"
    hb_deb_sets:
      - name: build
        image: "{{ build_fetch_python_slim }}"
        sources: "{{ build_fetch_trixie_sources }}"
        packages: "{{ pyinstaller_analysis_debs_build }}"

- name: Deploy pyinstaller-analysis wrapper script
  ansible.builtin.template:
    src: run-pyinstaller-analysis-wrapper.sh.j2
    dest: "{{ pyinstaller_analysis_install_dir }}/run-pyinstaller-analysis"
    owner: root
    group: lamware
    mode: "0750"

- name: Create convenience symlink
  ansible.builtin.file:
    src: "{{ pyinstaller_analysis_install_dir }}/run-pyinstaller-analysis"
    dest: /usr/local/bin/run-pyinstaller-analysis
    state: link
