---
# =============================================================================
# roles/postgres/tasks/main.yml
# Creates the malware analysis database in the existing PostgreSQL instance
# (already installed by Cape). Separate database, separate user.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

# PostgreSQL is already installed and running (Cape dependency).
# We just create our database and apply the schema.

- name: Install psycopg2 for pipeline scripts
  ansible.builtin.pip:
    name: psycopg2-binary
    state: present
    break_system_packages: true

- name: Fix pip package permissions for cape user
  ansible.builtin.shell: chmod -R a+rX /usr/local/lib/python3.12/dist-packages/
  args:
    executable: /bin/bash
  changed_when: false

- name: Create pipeline database user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgres_db_user }}"
    password: "{{ postgres_db_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE

- name: Create malware analysis database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ postgres_db_name }}"
    owner: "{{ postgres_db_user }}"
    encoding: UTF-8

- name: Create LiteLLM database user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ litellm_db_user | default('litellm') }}"
    password: "{{ litellm_db_password | default('litellm') }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE

- name: Create LiteLLM spend tracking database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ litellm_db_name | default('litellm') }}"
    owner: "{{ litellm_db_user | default('litellm') }}"
    encoding: UTF-8

- name: Create Keycloak database user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ keycloak_db_user | default('keycloak') }}"
    password: "{{ keycloak_db_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE

- name: Create Keycloak database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ keycloak_db_name | default('keycloak') }}"
    owner: "{{ keycloak_db_user | default('keycloak') }}"
    encoding: UTF-8

# --- Schema migrations (Alembic) ---
# The schema is fully managed by Alembic (see api/alembic/). The legacy
# schema.sql + migration_00X.sql files were retired in Phase B once Alembic was
# proven on prod (ADR-018). Alembic runs from a dedicated postgres-owned venv
# because the lamware-api venv is mode 0750 and unreadable by postgres. DDL stays
# with the postgres user; the runtime pipeline user remains DML-only.

- name: Create Alembic migrations runner directory
  ansible.builtin.file:
    path: /opt/lamware-migrations
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Create venv for the Alembic runner
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: python3 -m venv /opt/lamware-migrations/venv
    creates: /opt/lamware-migrations/venv/bin/alembic

- name: Install Alembic into the runner venv
  become: true
  become_user: postgres
  # pip module (not bare command) so re-deploys are a no-op once present: with
  # state=present it does not re-hit PyPI when the requirements are satisfied,
  # which keeps repeat deploys idempotent and offline-safe.
  ansible.builtin.pip:
    name:
      - "alembic>=1.13"
      - "SQLAlchemy>=2.0"
      - "psycopg2-binary>=2.9"
    virtualenv: /opt/lamware-migrations/venv
    state: present

- name: Copy alembic.ini into the runner
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../api/alembic.ini"
    dest: /opt/lamware-migrations/alembic.ini
    owner: postgres
    group: postgres
    mode: "0640"

- name: Copy the alembic project tree into the runner
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../api/alembic/"
    dest: /opt/lamware-migrations/alembic/
    owner: postgres
    group: postgres
    mode: "0640"
    directory_mode: "0750"

- name: Check whether the samples table exists
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    db: "{{ postgres_db_name }}"
    query: >
      SELECT EXISTS (SELECT FROM information_schema.tables
      WHERE table_name = 'samples');
  register: postgres_alembic_samples_check

- name: Check whether the alembic_version table exists
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    db: "{{ postgres_db_name }}"
    query: >
      SELECT EXISTS (SELECT FROM information_schema.tables
      WHERE table_name = 'alembic_version');
  register: postgres_alembic_version_check

# Guard (mutually exclusive, covers all states):
#   alembic_version exists              -> upgrade head  (normal: apply any new revisions)
#   no alembic_version, samples exists  -> stamp 0001    (adopt a pre-Alembic DB; the
#                                          original prod adoption path)
#   no alembic_version, no samples      -> upgrade head  (fresh DB: build from Alembic)
- name: Adopt existing schema at baseline (stamp 0001)
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: /opt/lamware-migrations/venv/bin/alembic stamp 0001
    chdir: /opt/lamware-migrations
  environment:
    ALEMBIC_DATABASE_URL: "postgresql+psycopg2:///{{ postgres_db_name }}"
  when:
    - not postgres_alembic_version_check.query_result[0].exists
    - postgres_alembic_samples_check.query_result[0].exists
  changed_when: true

- name: Apply Alembic migrations (upgrade head)
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: /opt/lamware-migrations/venv/bin/alembic upgrade head
    chdir: /opt/lamware-migrations
  environment:
    ALEMBIC_DATABASE_URL: "postgresql+psycopg2:///{{ postgres_db_name }}"
  when: >
    postgres_alembic_version_check.query_result[0].exists
    or not postgres_alembic_samples_check.query_result[0].exists
  changed_when: true

- name: Grant table privileges to pipeline user
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db_name }}"
    roles: "{{ postgres_db_user }}"
    type: table
    objs: ALL_IN_SCHEMA
    privs: SELECT,INSERT,UPDATE,DELETE
    schema: public

- name: Grant sequence privileges to pipeline user
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db_name }}"
    roles: "{{ postgres_db_user }}"
    type: sequence
    objs: ALL_IN_SCHEMA
    privs: USAGE,SELECT
    schema: public
