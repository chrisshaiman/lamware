---
# =============================================================================
# roles/postgres/tasks/main.yml
# Creates the malware analysis database in the existing PostgreSQL instance
# (already installed by Cape). Separate database, separate user.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

# PostgreSQL is already installed and running (Cape dependency).
# We just create our database and apply the schema.

- name: Install psycopg2 for pipeline scripts
  ansible.builtin.pip:
    name: psycopg2-binary
    state: present
    break_system_packages: true

- name: Fix pip package permissions for cape user
  ansible.builtin.shell: chmod -R a+rX /usr/local/lib/python3.12/dist-packages/
  args:
    executable: /bin/bash
  changed_when: false

- name: Create pipeline database user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgres_db_user }}"
    password: "{{ postgres_db_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE

- name: Create malware analysis database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ postgres_db_name }}"
    owner: "{{ postgres_db_user }}"
    encoding: UTF-8

- name: Create LiteLLM database user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ litellm_db_user | default('litellm') }}"
    password: "{{ litellm_db_password | default('litellm') }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE

- name: Create LiteLLM spend tracking database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ litellm_db_name | default('litellm') }}"
    owner: "{{ litellm_db_user | default('litellm') }}"
    encoding: UTF-8

- name: Create Keycloak database user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ keycloak_db_user | default('keycloak') }}"
    password: "{{ keycloak_db_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE

- name: Create Keycloak database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ keycloak_db_name | default('keycloak') }}"
    owner: "{{ keycloak_db_user | default('keycloak') }}"
    encoding: UTF-8

- name: Deploy schema SQL
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/pipeline/files/schema.sql"
    dest: /tmp/pipeline-schema.sql
    mode: "0644"

- name: Check if schema already applied
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    db: "{{ postgres_db_name }}"
    query: "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_name = 'samples');"
  register: postgres_schema_check

- name: Apply schema (first time only)
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: psql -d {{ postgres_db_name }} -f /tmp/pipeline-schema.sql
  changed_when: true
  when: not postgres_schema_check.query_result[0].exists

- name: Deploy migration SQL
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/pipeline/files/migration_001_ioc_mappings_and_status.sql"
    dest: /tmp/pipeline-migration-001.sql
    mode: "0644"

- name: Apply migration (idempotent — uses IF NOT EXISTS)
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: psql -d {{ postgres_db_name }} -f /tmp/pipeline-migration-001.sql
  changed_when: true

- name: Clean up migration file
  ansible.builtin.file:
    path: /tmp/pipeline-migration-001.sql
    state: absent

- name: Deploy auth migration SQL
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/pipeline/files/migration_002_auth.sql"
    dest: /tmp/pipeline-migration-002.sql
    mode: "0644"

- name: Apply auth migration (idempotent — uses IF NOT EXISTS)
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: psql -d {{ postgres_db_name }} -f /tmp/pipeline-migration-002.sql
  changed_when: true

- name: Clean up auth migration file
  ansible.builtin.file:
    path: /tmp/pipeline-migration-002.sql
    state: absent

- name: Grant table privileges to pipeline user
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db_name }}"
    roles: "{{ postgres_db_user }}"
    type: table
    objs: ALL_IN_SCHEMA
    privs: SELECT,INSERT,UPDATE,DELETE
    schema: public

- name: Grant sequence privileges to pipeline user
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db_name }}"
    roles: "{{ postgres_db_user }}"
    type: sequence
    objs: ALL_IN_SCHEMA
    privs: USAGE,SELECT
    schema: public

- name: Clean up schema file
  ansible.builtin.file:
    path: /tmp/pipeline-schema.sql
    state: absent
