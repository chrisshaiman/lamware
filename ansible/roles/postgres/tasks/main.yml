---
# =============================================================================
# roles/postgres/tasks/main.yml
# Creates the malware analysis database in the existing PostgreSQL instance
# (already installed by Cape). Separate database, separate user.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

# PostgreSQL is already installed and running (Cape dependency).
# We just create our database and apply the schema.

- name: Install psycopg2 for pipeline scripts
  ansible.builtin.pip:
    name: psycopg2-binary
    state: present
    break_system_packages: true

- name: Fix pip package permissions for cape user
  ansible.builtin.shell: chmod -R a+rX /usr/local/lib/python3.12/dist-packages/
  args:
    executable: /bin/bash
  changed_when: false

- name: Create pipeline database user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ postgres_db_user }}"
    password: "{{ postgres_db_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE

- name: Create malware analysis database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ postgres_db_name }}"
    owner: "{{ postgres_db_user }}"
    encoding: UTF-8

- name: Create LiteLLM database user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ litellm_db_user | default('litellm') }}"
    password: "{{ litellm_db_password | default('litellm') }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE

- name: Create LiteLLM spend tracking database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ litellm_db_name | default('litellm') }}"
    owner: "{{ litellm_db_user | default('litellm') }}"
    encoding: UTF-8

- name: Create Keycloak database user
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ keycloak_db_user | default('keycloak') }}"
    password: "{{ keycloak_db_password }}"
    role_attr_flags: NOSUPERUSER,NOCREATEDB,NOCREATEROLE

- name: Create Keycloak database
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ keycloak_db_name | default('keycloak') }}"
    owner: "{{ keycloak_db_user | default('keycloak') }}"
    encoding: UTF-8

- name: Deploy schema SQL
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/pipeline/files/schema.sql"
    dest: /tmp/pipeline-schema.sql
    mode: "0644"

- name: Check if schema already applied
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    db: "{{ postgres_db_name }}"
    query: "SELECT EXISTS (SELECT FROM information_schema.tables WHERE table_name = 'samples');"
  register: postgres_schema_check

- name: Apply schema (first time only)
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: psql -d {{ postgres_db_name }} -f /tmp/pipeline-schema.sql
  changed_when: true
  when: not postgres_schema_check.query_result[0].exists

- name: Deploy migration SQL
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/pipeline/files/migration_001_ioc_mappings_and_status.sql"
    dest: /tmp/pipeline-migration-001.sql
    mode: "0644"

- name: Apply migration (idempotent — uses IF NOT EXISTS)
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: psql -d {{ postgres_db_name }} -f /tmp/pipeline-migration-001.sql
  changed_when: true

- name: Clean up migration file
  ansible.builtin.file:
    path: /tmp/pipeline-migration-001.sql
    state: absent

- name: Deploy auth migration SQL
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/pipeline/files/migration_002_auth.sql"
    dest: /tmp/pipeline-migration-002.sql
    mode: "0644"

- name: Apply auth migration (idempotent — uses IF NOT EXISTS)
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: psql -d {{ postgres_db_name }} -f /tmp/pipeline-migration-002.sql
  changed_when: true

- name: Clean up auth migration file
  ansible.builtin.file:
    path: /tmp/pipeline-migration-002.sql
    state: absent

- name: Deploy investigation migration SQL
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/roles/pipeline/files/migration_003_investigation.sql"
    dest: /tmp/pipeline-migration-003.sql
    mode: "0644"

- name: Apply investigation migration (idempotent — uses IF NOT EXISTS)
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: psql -d {{ postgres_db_name }} -f /tmp/pipeline-migration-003.sql
  changed_when: true

- name: Clean up investigation migration file
  ansible.builtin.file:
    path: /tmp/pipeline-migration-003.sql
    state: absent

# --- Alembic migrations (Phase A: runs alongside the legacy SQL above) ---
# The legacy schema.sql + migration_00X tasks above remain as a rollback net.
# Alembic runs from a dedicated postgres-owned venv because the lamware-api venv
# is mode 0750 and unreadable by postgres. DDL stays with the postgres user;
# the runtime pipeline user remains DML-only.

- name: Create Alembic migrations runner directory
  ansible.builtin.file:
    path: /opt/lamware-migrations
    state: directory
    owner: postgres
    group: postgres
    mode: "0750"

- name: Create venv for the Alembic runner
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: python3 -m venv /opt/lamware-migrations/venv
    creates: /opt/lamware-migrations/venv/bin/alembic

- name: Install Alembic into the runner venv
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: >
      /opt/lamware-migrations/venv/bin/pip install
      "alembic>=1.13" "SQLAlchemy>=2.0" "psycopg2-binary>=2.9"
  changed_when: true

- name: Copy alembic.ini into the runner
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../api/alembic.ini"
    dest: /opt/lamware-migrations/alembic.ini
    owner: postgres
    group: postgres
    mode: "0640"

- name: Copy the alembic project tree into the runner
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../api/alembic/"
    dest: /opt/lamware-migrations/alembic/
    owner: postgres
    group: postgres
    mode: "0640"
    directory_mode: "0750"

- name: Check whether the samples table exists (after legacy tasks)
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    db: "{{ postgres_db_name }}"
    query: >
      SELECT EXISTS (SELECT FROM information_schema.tables
      WHERE table_name = 'samples');
  register: alembic_samples_check

- name: Check whether the alembic_version table exists
  become: true
  become_user: postgres
  community.postgresql.postgresql_query:
    db: "{{ postgres_db_name }}"
    query: >
      SELECT EXISTS (SELECT FROM information_schema.tables
      WHERE table_name = 'alembic_version');
  register: alembic_version_check

# Guard (mutually exclusive, covers all four states):
#   alembic_version exists                  -> upgrade head  (ongoing case)
#   no alembic_version, samples exists      -> stamp 0001    (adopt existing schema:
#                                              prod first run, OR fresh DB where the
#                                              legacy schema.sql just built it)
#   no alembic_version, no samples          -> upgrade head  (truly empty DB: build
#                                              from Alembic — the post-Phase-B path)
- name: Adopt existing schema at baseline (stamp 0001)
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: /opt/lamware-migrations/venv/bin/alembic stamp 0001
    chdir: /opt/lamware-migrations
  environment:
    ALEMBIC_DATABASE_URL: "postgresql+psycopg2:///{{ postgres_db_name }}"
  when:
    - not alembic_version_check.query_result[0].exists
    - alembic_samples_check.query_result[0].exists
  changed_when: true

- name: Apply Alembic migrations (upgrade head)
  become: true
  become_user: postgres
  ansible.builtin.command:
    cmd: /opt/lamware-migrations/venv/bin/alembic upgrade head
    chdir: /opt/lamware-migrations
  environment:
    ALEMBIC_DATABASE_URL: "postgresql+psycopg2:///{{ postgres_db_name }}"
  when: >
    alembic_version_check.query_result[0].exists
    or not alembic_samples_check.query_result[0].exists
  changed_when: true

- name: Grant table privileges to pipeline user
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db_name }}"
    roles: "{{ postgres_db_user }}"
    type: table
    objs: ALL_IN_SCHEMA
    privs: SELECT,INSERT,UPDATE,DELETE
    schema: public

- name: Grant sequence privileges to pipeline user
  become: true
  become_user: postgres
  community.postgresql.postgresql_privs:
    database: "{{ postgres_db_name }}"
    roles: "{{ postgres_db_user }}"
    type: sequence
    objs: ALL_IN_SCHEMA
    privs: USAGE,SELECT
    schema: public

- name: Clean up schema file
  ansible.builtin.file:
    path: /tmp/pipeline-schema.sql
    state: absent
