---
# =============================================================================
# roles/sample-feeder/tasks/main.yml
# Deploys the MalwareBazaar sample feeder CLI tool.
#
# The feeder is an interactive CLI tool — not a daemon. The operator SSHs
# in via WireGuard and runs it manually with filters to review and submit
# samples to Cape.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

# ADR-025: code and configuration are root's. The feeder runs as
# sample_feeder_user and the auto-feeder (another user) reads the same config
# and seen-hash file, so neither may be able to change what the other runs or
# where the other writes.
- name: Create sample-feeder install directory (root-owned; ADR-025)
  ansible.builtin.file:
    path: "{{ sample_feeder_dir }}"
    state: directory
    owner: root
    group: lamware
    mode: "0750"

- name: Install pyzipper for AES-encrypted MalwareBazaar zips
  ansible.builtin.pip:
    name: pyzipper
    state: present
    break_system_packages: true

- name: Fix pip package permissions for cape user
  ansible.builtin.shell: chmod -R a+rX /usr/local/lib/python3.12/dist-packages/
  args:
    executable: /bin/bash
  changed_when: false

# -------------------------------------------------------------------------
# Deploy CLI tool and config
# -------------------------------------------------------------------------

- name: Deploy sample_feeder.py
  ansible.builtin.template:
    src: sample_feeder.py.j2
    dest: "{{ sample_feeder_dir }}/sample_feeder.py"
    owner: root
    group: "{{ sample_feeder_user }}"
    mode: "0750"

- name: Write sample-feeder config
  ansible.builtin.template:
    src: sample-feeder.conf.j2
    dest: "{{ sample_feeder_dir }}/config.json"
    owner: root
    # It holds the CAPE API token and the MalwareBazaar key. Group lamware made
    # them readable by cape and lamware-api too; the only other reader is the
    # auto-feeder. Root-owned (ADR-025): the auto-feeder acts on this file, so
    # the feeder user must not be able to change it.
    group: "{{ auto_feeder_user | default('auto-feeder') }}"
    mode: "0640"
  no_log: true

# The CLI runs as sample_feeder_user and needs the keys too. An ACL, not group
# lamware: that group also holds cape and lamware-api.
- name: Let the feeder user read the config (ACL)
  ansible.posix.acl:
    path: "{{ sample_feeder_dir }}/config.json"
    entity: "{{ sample_feeder_user }}"
    etype: user
    permissions: r
    state: present

# Shared state both feeders rewrite in place, so it must exist before either
# runs (the root-owned directory refuses to create it for them).
- name: Create the shared seen-hash file if missing
  ansible.builtin.copy:
    content: "[]\n"
    dest: "{{ sample_feeder_state_file }}"
    force: false
    owner: root
    group: lamware
    mode: "0660"

- name: Keep the shared seen-hash file root-owned and group-writable
  ansible.builtin.file:
    path: "{{ sample_feeder_state_file }}"
    owner: root
    group: lamware
    mode: "0660"

- name: Create convenience symlink
  ansible.builtin.file:
    src: "{{ sample_feeder_dir }}/sample_feeder.py"
    dest: /usr/local/bin/sample-feeder
    state: link
