---
# roles/auto-feeder/defaults/main.yml

# Master switch — off by default, opt-in
auto_feeder_enabled: false

# Installation directory
auto_feeder_install_dir: /opt/auto-feeder

# Cooldown between ingestion cycles (minutes)
# Must be longer than a typical pipeline run (CAPE ~3min + analysis ~5min)
auto_feeder_interval_minutes: 15

# Sample selection — empty lists = unfiltered (all recent samples)
auto_feeder_family_allowlist: []
auto_feeder_tag_allowlist: []

# How many recent samples to fetch from MalwareBazaar per cycle
# (selector is a sample count, not a time window)
auto_feeder_recent_count: 100

# Guardrails
auto_feeder_max_failures: 3
auto_feeder_disk_threshold: 80
auto_feeder_daily_budget_usd: 10.0
auto_feeder_pause_file: /opt/pipeline/control/PAUSE
auto_feeder_max_sample_size_bytes: 268435456  # 256 MB

# Separate user — not subject to pipeline iptables lockdown.
# Downloads from MalwareBazaar need outbound HTTPS.
# Pipeline execution delegated via sudo -u pipeline.
auto_feeder_user: auto-feeder
