---
# =============================================================================
# roles/networking/tasks/main.yml
# Creates the isolated detonation bridge network and applies iptables
# air-gap rules per SECURITY_CONSTRAINTS.md:
#
#   virbr-det → eth0  DROP  (no VM internet egress)
#   virbr-det → wg0   DROP  (no VM access to management VPN)
#   virbr-det → host  REJECT unless allowlisted (ADR-020 amendment, guest_input.yml)
#
# libvirt isolated networks (no <forward> element) block external routing
# by default. Explicit iptables rules are belt-and-suspenders — they survive
# libvirt rule flushes and make the constraint auditable with `iptables -L`.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Disable rpcbind (unnecessary RPC service, actively probed by scanners)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - rpcbind
    - rpcbind.socket
  failed_when: false

- name: Install iptables-persistent (saves rules across reboots)
  ansible.builtin.apt:
    name:
      - iptables-persistent
      - netfilter-persistent
    state: present
    update_cache: false

# -------------------------------------------------------------------------
# Detonation bridge — libvirt isolated network
# -------------------------------------------------------------------------

# Kept in a root-only directory, not the shared /tmp (M14). The definition is
# handed to `virsh net-define` as root; staging it where every local user can
# create names put a pre-planted path (a directory, at least) between the
# template and the define. It also stays, so a re-define reads the reviewed file.
- name: Create the root-only directory for libvirt definitions
  ansible.builtin.file:
    path: "{{ networking_libvirt_def_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Copy detonation network XML definition
  ansible.builtin.template:
    src: detonation-network.xml.j2
    dest: "{{ networking_libvirt_def_dir }}/detonation-network.xml"
    owner: root
    group: root
    mode: "0600"

- name: Check if detonation libvirt network is defined
  ansible.builtin.command: virsh net-info detonation
  register: networking_virsh_info
  changed_when: false
  failed_when: false

- name: Define detonation libvirt network
  ansible.builtin.command: virsh net-define {{ networking_libvirt_def_dir }}/detonation-network.xml
  when: networking_virsh_info.rc != 0
  changed_when: true

- name: Start detonation libvirt network
  ansible.builtin.command: virsh net-start detonation
  when: >
    networking_virsh_info.rc != 0 or
    'Active:         yes' not in networking_virsh_info.stdout
  changed_when: true

- name: Set detonation network to autostart
  ansible.builtin.command: virsh net-autostart detonation
  when: >
    networking_virsh_info.rc != 0 or
    'Autostart:      yes' not in networking_virsh_info.stdout
  changed_when: true

# The old staging copy, from before the definition moved out of /tmp.
- name: Remove the old /tmp copy of the network XML
  ansible.builtin.file:
    path: /tmp/detonation-network.xml
    state: absent

# -------------------------------------------------------------------------
# iptables air-gap rules (belt-and-suspenders on top of libvirt isolation)
# Inserted at the top of FORWARD chain so they run before any ACCEPT rules
# that libvirt may add. Use -C to check idempotently before inserting.
# -------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Guest DNS -> INetSim (#456)
#
# `route = none` in Cape's routing.conf is deliberate: guests are confined to
# virbr-det by the rules below, and INetSim listens on the gateway, so Cape
# installs no routing of its own. That works for HTTP/HTTPS/SMTP/FTP, which
# INetSim binds directly on the gateway address.
#
# It does not work for DNS. libvirt's per-network dnsmasq binds :53 on that same
# gateway when the network starts, so INetSim's DNS can never have it. INetSim
# reported the service as started and exited silently; every analysis since has
# resolved nothing.
#
# Redirect here rather than fixing it any of the other ways:
#   - Cape's own inetsim route would install dns_forward, but only under
#     `route = inetsim`, which duplicates the confinement these rules already
#     provide and changes the containment model to fix a port conflict.
#   - `<dns enable="no"/>` on the libvirt network frees :53, but it is not
#     established whether dnsmasq still advertises a resolver over DHCP once its
#     DNS is off. If it stops, guests end up with no resolver at all.
# A PREROUTING redirect touches neither.
# -----------------------------------------------------------------------------

- name: Check guest DNS redirect to INetSim
  ansible.builtin.command:
    cmd: >-
      iptables -t nat -C PREROUTING -i {{ detonation_bridge }}
      -p {{ item }} --dport 53 -j REDIRECT --to-ports {{ inetsim_dns_port }}
  register: networking_dns_redirect_check
  changed_when: false
  failed_when: false
  loop:
    - udp
    - tcp

- name: Redirect guest DNS to INetSim's alternate port
  ansible.builtin.iptables:
    table: nat
    chain: PREROUTING
    in_interface: "{{ detonation_bridge }}"
    protocol: "{{ item.item }}"
    destination_port: "53"
    jump: REDIRECT
    to_ports: "{{ inetsim_dns_port }}"
    action: insert
    rule_num: 1
    state: present
  loop: "{{ networking_dns_redirect_check.results }}"
  loop_control:
    label: "{{ item.item }}/53 -> {{ inetsim_dns_port }}"
  when: item.rc != 0
  # No notify: the unconditional "Save iptables rules" task at the end of this
  # file persists everything, and a handler by that name does not exist.

- name: Check air-gap rule — virbr-det → eth0
  ansible.builtin.command: >
    iptables -C FORWARD -i {{ detonation_bridge }} -o {{ management_interface }} -j DROP
  register: networking_rule_eth0_check
  changed_when: false
  failed_when: false

- name: Insert air-gap rule — virbr-det → eth0 (no VM internet egress)
  ansible.builtin.iptables:
    chain: FORWARD
    in_interface: "{{ detonation_bridge }}"
    out_interface: "{{ management_interface }}"
    jump: DROP
    action: insert
    rule_num: 1
    comment: "Cape detonation air-gap: no VM internet egress"
  when: networking_rule_eth0_check.rc != 0

- name: Check air-gap rule — virbr-det → wg0
  ansible.builtin.command: >
    iptables -C FORWARD -i {{ detonation_bridge }} -o wg0 -j DROP
  register: networking_rule_wg0_check
  changed_when: false
  failed_when: false

- name: Insert air-gap rule — virbr-det → wg0 (no VM access to management VPN)
  ansible.builtin.iptables:
    chain: FORWARD
    in_interface: "{{ detonation_bridge }}"
    out_interface: wg0
    jump: DROP
    action: insert
    rule_num: 2
    comment: "Cape detonation air-gap: no VM access to management VPN"
  when: networking_rule_wg0_check.rc != 0

# -------------------------------------------------------------------------
# ip6tables air-gap rules — mirror the IPv4 DROP rules for IPv6
# -------------------------------------------------------------------------
# Ubuntu 24.04 enables IPv6 by default. Without matching ip6tables rules,
# a VM escape could route traffic over IPv6 even though the IPv4 path is
# blocked. Belt-and-suspenders alongside disabling IPv6 forwarding below.

- name: Check ip6tables air-gap rule — virbr-det → eth0
  ansible.builtin.command: >
    ip6tables -C FORWARD -i {{ detonation_bridge }} -o {{ management_interface }} -j DROP
  register: networking_rule6_eth0_check
  changed_when: false
  failed_when: false

- name: Insert ip6tables air-gap rule — virbr-det → eth0
  ansible.builtin.iptables:
    ip_version: ipv6
    chain: FORWARD
    in_interface: "{{ detonation_bridge }}"
    out_interface: "{{ management_interface }}"
    jump: DROP
    action: insert
    rule_num: 1
    comment: "Cape detonation air-gap (IPv6): no VM internet egress"
  when: networking_rule6_eth0_check.rc != 0

- name: Check ip6tables air-gap rule — virbr-det → wg0
  ansible.builtin.command: >
    ip6tables -C FORWARD -i {{ detonation_bridge }} -o wg0 -j DROP
  register: networking_rule6_wg0_check
  changed_when: false
  failed_when: false

- name: Insert ip6tables air-gap rule — virbr-det → wg0
  ansible.builtin.iptables:
    ip_version: ipv6
    chain: FORWARD
    in_interface: "{{ detonation_bridge }}"
    out_interface: wg0
    jump: DROP
    action: insert
    rule_num: 2
    comment: "Cape detonation air-gap (IPv6): no VM access to management VPN"
  when: networking_rule6_wg0_check.rc != 0

- name: Enable IPv4 forwarding (required for libvirt bridge DHCP and resultserver)
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_file: /etc/sysctl.d/90-ipforward.conf
    reload: true

- name: Disable IPv6 forwarding (no IPv6 routing on detonation bridge)
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "0"
    state: present
    sysctl_file: /etc/sysctl.d/90-ipforward.conf
    reload: true

# -------------------------------------------------------------------------
# Guest traffic to the host -- default-deny (ADR-020, amended 2026-10-05)
# -------------------------------------------------------------------------
# The FORWARD rules above decide what a guest can reach THROUGH the host. What a
# guest can reach ON the host is decided in INPUT, by one chain that ends in a
# REJECT. The per-port INPUT ACCEPTs that used to live here (INetSim, the
# resultserver) are inside that chain now, scoped to the gateway address, and
# guest_input.yml removes the old copies from INPUT. import, not include: a
# static import inherits the role's `networking` tag, so `make deploy
# TAGS=networking` runs these tasks rather than skipping them silently.

- name: Guest traffic to the host is default-deny (ADR-020, amended 2026-10-05)
  ansible.builtin.import_tasks: guest_input.yml

# -------------------------------------------------------------------------
# Persist every raw rule above across reboots.
#
# iptables-persistent is THE mechanism on this host. ufw is not installed --
# the hardening role sets manage_ufw: false -- because the two declare
# `Breaks:` against each other and every deploy was picking a winner by role
# order. That coin-flip produced three separate outages on 2026-09-19:
#
#   * the pipeline egress DROP was unreachable behind ufw's chains
#   * CAPE could not reach the guest agent (ufw default-deny OUTPUT)
#   * CAPE's web UI had no inbound rule at all
#
# None of those exist without ufw: these rules sit at the top of INPUT, OUTPUT
# and FORWARD with nothing in front of them, which is what the air-gap needs and
# what ufw could not offer without placing it below LIBVIRT_FWO.
# -------------------------------------------------------------------------
- name: Save iptables rules (persist across reboots)
  ansible.builtin.command: netfilter-persistent save
  changed_when: true
