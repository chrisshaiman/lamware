---
# =============================================================================
# roles/hardening/tasks/main.yml
# Applies the konstruktoid.hardening CIS-aligned baseline with production
# settings. This role re-runs after Packer so production settings differ
# from the build-time settings:
#   - Packer enabled password auth (needed for Packer SSH communicator)
#   - Ansible disables it (production: key-only SSH)
#
# Robot firewall enforces source IP restriction at the network edge, so
# sshd_admin_net stays open here. SSH restriction to wg0 can be done
# manually after the wireguard role confirms the tunnel is working.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Apply konstruktoid.hardening baseline (production settings)
  ansible.builtin.include_role:
    name: konstruktoid.hardening
  vars:
    # Production: key-only SSH (Packer enabled password auth during build)
    sshd_password_authentication: "no"
    # Robot firewall enforces source IP at network edge — no need to restrict here
    sshd_admin_net: ["0.0.0.0/0"]
    # Disable MOTD — this is a headless analysis host
    set_motd: false
    # Do not force a reboot after hardening — operator controls reboots
    system_upgrade: false
    # This host does NOT use ufw. iptables-persistent is the single firewall
    # mechanism, and the two declare `Breaks:` against each other: installing
    # one removes the other, so every deploy picked a winner by role order.
    #
    # That coin-flip caused three outages on 2026-09-19. With ufw installed:
    #
    #   * the pipeline egress DROP sat below ufw's chains and never fired --
    #     uid 997 reached 1.1.1.1:443 with the rule present and 0 packets on it
    #   * nothing accepted NEW outbound to virbr-det, so CAPE could not reach
    #     the guest agent and every detonation timed out with 0 processes
    #   * CAPE's web UI on 10.200.0.1:8000 had no inbound rule at all
    #
    # None of those exist without ufw: the raw rules sit at the top of INPUT,
    # OUTPUT and FORWARD with nothing in front of them. That ordering is what
    # the air-gap depends on, and ufw could only have offered it below
    # LIBVIRT_FWO -- config libvirt rewrites on every network restart.
    #
    # THE TRADE-OFF IS REAL AND IS NOT YET PAID FOR: ufw gave default-deny
    # inbound. /etc/iptables/rules.v4 carries `:INPUT ACCEPT`, so any service
    # that listens is reachable by anything that can route to it. That is how
    # the CAPE UI was exposed without a rule in the first place. Tracked
    # separately; do not read this as "inbound is handled".
    manage_ufw: false
    # Post-quantum key exchange, prepended to the role's default list.
    #
    # konstruktoid v4.4.1 defaults sshd_kex_algorithms to five pre-PQ
    # algorithms, so every SSH session to this host negotiated a classical KEX
    # and OpenSSH 10 clients printed:
    #
    #   ** WARNING: connection is not using a post-quantum key exchange algorithm.
    #   ** This session may be vulnerable to "store now, decrypt later" attacks.
    #   ** The server may need to be upgraded.
    #
    # The upgrade advice is wrong here: sshd is OpenSSH 9.6p1 and its build
    # DOES support sntrup761x25519-sha512@openssh.com (verified with
    # `sshd -T -o KexAlgorithms=...`). The algorithm was excluded by our own
    # hardening baseline, not missing from the server.
    #
    # ADDITIVE on purpose. The role's five entries are kept verbatim and the
    # PQ hybrid is prepended, so it is preferred when both sides offer it and
    # every client that can connect today still can. Changing the KEX list on a
    # host reachable only over SSH is not the place to also narrow it.
    #
    # sntrup761 rather than mlkem768x25519-sha256 because the latter needs
    # OpenSSH 9.9+; revisit when this host moves past Ubuntu 24.04's 9.6.
    sshd_kex_algorithms:
      - "sntrup761x25519-sha512@openssh.com"
      - "curve25519-sha256@libssh.org"
      - "diffie-hellman-group16-sha512"
      - "diffie-hellman-group18-sha512"
      - "ecdh-sha2-nistp521"
      - "ecdh-sha2-nistp384"

# =============================================================================
# USBGuard: allow the out-of-band console keyboard
#
# konstruktoid sets ImplicitPolicyTarget=block and AuthorizedDefault=none but
# never writes rules.conf, so NOTHING is authorised. On a remote server the only
# USB device that ever appears is the BMC's virtual keyboard, presented when an
# operator opens the IPMI/KVM console — and it was blocked:
#
#     usb 1-9: Device is not authorized for usage
#
# That matters because the KVM console is the documented recovery path when SSH
# is unavailable (docs/DEPLOYMENT.md). Blocking it removed the last way in, and
# on 2026-09-01 an operator-laptop key problem escalated to a rescue-mode boot
# partly for this reason (#524).
#
# TRADE-OFF, made deliberately: allowing HID re-opens keystroke-injection
# ("BadUSB") devices. That attack needs physical access to a rack in an OVH
# datacentre. Losing console access needs only a bad afternoon. Mass storage
# (class 08) and everything else stay blocked, so the exfiltration case this
# control mainly exists for is unaffected.
# =============================================================================

- name: Allow the BMC virtual keyboard and mouse through USBGuard
  ansible.builtin.blockinfile:
    path: "{{ hardening_usbguard_rulefile }}"
    create: true
    marker: "# {mark} ANSIBLE MANAGED - out-of-band console HID (#524)"
    # TWO rules, because allowing HID alone was not enough. Measured on the
    # host: the BMC presents 046b:ff01 "Virtual Hub" (class 09) and hangs the
    # keyboard off it, so with the hub blocked the HID never enumerates and the
    # console stays dead:
    #
    #   7: block id 046b:ff01 name "Virtual Hub" via-port "1-9" with-interface 09:00:00
    #
    # Allowing hubs costs little: a hub carries no data of its own, and anything
    # behind it still has to match the HID rule. Confirmed after the change --
    # the hub is allowed while 046b:ff20 "Virtual Cdrom Device" (08:06:50) and
    # 046b:ffb0 "Virtual Ethernet" stay blocked, which is the point.
    #
    # Keyboards and mice only. NOT 03:*:*, which also covers HID devices that
    # are not input peripherals, and emphatically not class 08 (mass storage).
    block: |
      allow with-interface one-of { 09:00:00 09:00:01 09:00:02 }
      allow with-interface one-of { 03:00:01 03:00:02 03:01:01 03:01:02 }
    owner: root
    group: root
    mode: "0600"
  when: hardening_usbguard_allow_console_hid
  notify: Restart usbguard

# =============================================================================
# The ufw inbound re-add task lived here. It is gone with ufw itself: nothing
# deletes those rules any more because nothing manages a second firewall.
#
# It existed because konstruktoid sets `default deny (incoming)` and re-adds
# exactly one inbound rule (sshd), silently removing everything else this host
# serves on every run. On 2026-09-02 that took the public web tier offline and
# left WireGuard alive only on conntrack -- it would have dropped on the next
# idle gap. The same window opened again on 2026-09-19.
#
# Purge rather than leave `rc`: a config-only ufw package is one `apt install`
# from evicting iptables-persistent again.
# =============================================================================

- name: Remove ufw entirely — iptables-persistent is the firewall on this host
  ansible.builtin.apt:
    name: ufw
    state: absent
    purge: true

# =============================================================================
# Console-only recovery account (#552).
#
# There is no console credential on this host. ovh/main.tf provisions key-only
# and nothing sets a password, so SoL and the KVM console both reach a login:
# prompt nobody can satisfy. On 2026-09-01 an operator-laptop key problem -- a
# passphrase-protected key whose ssh-agent had been wiped -- became an OVH
# rescue-mode boot, because neither out-of-band path could be used.
#
# "Cannot SSH" is STRUCTURAL here, not configured. sshd carries `AllowGroups
# sudo`, so an account outside that group is refused before anything else is
# considered:
#
#   User root from 10.200.0.4 not allowed because none of user's groups
#   are listed in AllowGroups
#
# The account still needs root powers, and the obvious way to grant them --
# adding it to `sudo` -- is exactly what would let it SSH in. So sudo is granted
# by USERNAME in sudoers.d, leaving group membership free to do the refusing.
#
# DenyUsers is added as well. It is redundant against the group rule, and that is
# the point: two independent reasons, so neither an AllowGroups edit nor a
# group-membership mistake quietly opens remote access to a password account.
# =============================================================================

- name: Create the console-only recovery account
  ansible.builtin.user:
    name: "{{ hardening_console_user }}"
    shell: /bin/bash
    create_home: true
    # NOT sudo. Group membership is the SSH refusal; see the block comment.
    groups: []
    append: false
    password: "{{ console_recovery_password_hash | mandatory }}"
  when: hardening_console_user_enabled
  no_log: true

- name: Grant sudo by username rather than by group
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ hardening_console_user }}"
    owner: root
    group: root
    mode: "0440"
    content: |
      # Managed by Ansible (roles/hardening). See tasks/main.yml.
      # By username on purpose: adding this account to the `sudo` group would
      # also let it in over SSH, which is the thing it must not do.
      {{ hardening_console_user }} ALL=(ALL) ALL
    validate: visudo -cf %s
  when: hardening_console_user_enabled

- name: Refuse SSH for the console account, and prove sshd still parses
  when: hardening_console_user_enabled
  block:
    - name: Deny the console account over SSH
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/20-lamware-console-user.conf
        owner: root
        group: root
        mode: "0600"
        content: |
          # Managed by Ansible (roles/hardening). See tasks/main.yml.
          # Redundant against `AllowGroups sudo` in 01-hardening.conf, and that
          # is deliberate: two independent reasons this account cannot log in
          # remotely, so neither an AllowGroups edit nor a group-membership
          # mistake quietly turns it into a remotely usable password credential.
          DenyUsers {{ hardening_console_user }}
      notify: Reload sshd

    # `sshd -t` refuses to run at all without the privilege separation
    # directory, exiting 255 with "Missing privilege separation directory:
    # /run/sshd". That is an environment problem, not a config rejection.
    #
    # This host uses socket activation -- ssh.socket enabled, ssh.service
    # disabled -- so /run/sshd is created per sshd instance and can be absent
    # between connections. The check was therefore RACY: it passed whenever an
    # sshd happened to be alive and failed otherwise. On 2026-09-19 it failed,
    # the rescue below concluded the fragment had broken sshd, and deleted a
    # working security control while reporting a cause that was not true.
    # /run/sshd is tmpfs and root-owned; creating it is idempotent and cheap.
    - name: Ensure the sshd privilege separation directory exists
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: "0755"

    # sshd_config.d fragments cannot be validated in isolation -- `sshd -t -f`
    # on a fragment is not a valid config -- so the MERGED config is checked
    # after writing. If it does not parse, the fragment is removed again below.
    # Leaving a host whose sshd cannot start is not an acceptable failure mode
    # for a change whose entire purpose is preserving a way back in.
    - name: Verify the merged sshd config still parses
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      register: hardening_sshd_parse_result
  rescue:
    # GATE, deliberately first in the rescue. A failed task aborts the rescue,
    # so when sshd could not run at all the removal below is never reached and
    # the fragment survives. Deleting a security control requires evidence that
    # the control is bad; "the validator could not start" is not that evidence.
    - name: Refuse to delete the drop-in unless sshd actually rejected the config
      ansible.builtin.assert:
        that:
          - "'Missing privilege separation directory' not in (hardening_sshd_parse_result.stderr | default(''))"
        fail_msg: >-
          `sshd -t` could not run: {{ hardening_sshd_parse_result.stderr | default('(no stderr)') }}.
          That is an environment fault, not a rejection of
          20-lamware-console-user.conf, so the drop-in has been LEFT IN PLACE
          and sshd is unchanged. Create /run/sshd and re-run.
        quiet: true

    - name: Remove the drop-in that broke sshd
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/20-lamware-console-user.conf
        state: absent
    - name: Fail loudly, with sshd left working
      ansible.builtin.fail:
        msg: >-
          sshd rejected 20-lamware-console-user.conf; it has been removed and
          sshd is unchanged. Check `DenyUsers {{ hardening_console_user }}`
          against the other files in /etc/ssh/sshd_config.d/.

- name: Root zone DNSSEC trust anchors (#769)
  ansible.builtin.import_tasks: resolver.yml

# =============================================================================
# auditd: exempt the scheduled filesystem walkers from the /home rule (#797)
#
# konstruktoid's rule set carries
#
#   -a always,exit -S all -F dir=/home/ -F uid=0 -C auid!=obj_uid -F key=admin-user-home
#
# and its auditd configuration turns on the audisp syslog plugin, so every
# audit record is also a syslog line. On this host /home/pipeline holds the
# pipeline user's container store (23 GB, hundreds of thousands of files), and
# two root jobs walk all of it: the nightly AIDE check and plocate's updatedb.
# Measured 2026-10-18: one week of syslog was 48 GB before compression, 79% of
# its audit records from aide, and the kernel had stalled callers for 22
# minutes in total waiting on the audit backlog (auditctl -s
# backlog_wait_time_actual). The rule exists to notice an administrator reading
# someone else's home; a scheduled walker is not that.
#
# The exemptions are `never` rules in a file that sorts before hardening.rules.
# augenrules merges rules.d in name order and hoists the -D to the top, so they
# are evaluated first, and the kernel stops at the first matching rule.
#
# They take effect at the next boot: auditd_enable_flag is 2 (rules locked).
# `augenrules --check` reports the pending difference until then.
# =============================================================================

- name: Exempt the scheduled filesystem walkers from the /home audit rule
  ansible.builtin.copy:
    src: 00-lamware-audit-exclusions.rules
    dest: /etc/audit/rules.d/00-lamware-audit-exclusions.rules
    owner: root
    group: root
    mode: "0600"
  notify: Merge audit rules

# Ubuntu's aide-common ships dailyaidecheck.timer (01:50 + up to 2h), and
# konstruktoid installs its own aidecheck.timer (00:00) because it looks for
# /etc/cron.daily/aide, which 24.04 no longer has. Both were enabled, so the
# check ran twice a night. Keep the role-managed one.
- name: Stop the distribution's duplicate AIDE timer
  ansible.builtin.systemd_service:
    name: dailyaidecheck.timer
    enabled: false
    state: stopped
    masked: true

# ---------------------------------------------------------------------------
# AIDE: a baseline that stays current, and a nightly result that reaches someone.
#
# Until this, the baseline dated from 2026-04-25; the nightly check found about a
# million differences, exited 7 and was read by nobody. Three parts:
#   1. exclusions for data and storage that churn by design (99_lamware_exclusions);
#   2. the nightly aidecheck runs lamware-aide check, which sends an ntfy alert on
#      any difference or error;
#   3. lamware-aide rebaseline after every deploy (site.yml post_tasks) and every
#      dpkg run (apt hook), reporting what it absorbs before replacing the baseline.
# So a difference at night is a change that neither a deploy nor apt made.
# ---------------------------------------------------------------------------
- name: Install the lamware AIDE rules (log rotation, exclusions)
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/aide/aide.conf.d/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - 98_lamware_logs
    - 99_lamware_exclusions

- name: Validate the AIDE configuration with the exclusions
  ansible.builtin.command: aide --config-check --config /etc/aide/aide.conf
  changed_when: false

- name: Install lamware-aide
  ansible.builtin.copy:
    src: lamware-aide.py
    dest: /usr/local/sbin/lamware-aide
    owner: root
    group: root
    mode: "0750"

# Created here, not by the script: the post-deploy rebaseline scans before it
# writes its first report, so a directory the script made would be the next
# night's "added" entry. The reports inside are excluded (99_lamware_exclusions).
- name: Create the lamware-aide report directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - /var/lib/lamware-aide
    - /var/lib/lamware-aide/reports

- name: Create the aidecheck drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/aidecheck.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# aidecheck.service belongs to konstruktoid; a drop-in replaces its command
# without editing the file that role owns.
- name: Run the nightly AIDE check through lamware-aide
  ansible.builtin.copy:
    dest: /etc/systemd/system/aidecheck.service.d/lamware.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/hardening): report the result instead of only exiting 7.
      [Service]
      ExecStart=
      ExecStart=/usr/local/sbin/lamware-aide check
  notify: Reload systemd

- name: Install the AIDE rebaseline unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/lamware-aide-rebaseline.service
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/hardening). Started, never enabled: by the deploy's
      # post_tasks and by the apt hook. Idle priority; a full AIDE pass takes ~10 min.
      [Unit]
      Description=Renew the AIDE baseline after a deploy or a package change
      [Service]
      Type=oneshot
      Nice=10
      IOSchedulingClass=idle
      ExecStart=/usr/local/sbin/lamware-aide rebaseline --reason "a deploy or package change"
  notify: Reload systemd

# Post-Invoke runs after every dpkg run, unattended-upgrades included. `start
# --no-block` on a unit already running is a no-op, so an apt run with several
# dpkg calls queues one rebaseline.
- name: Renew the AIDE baseline after package changes
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99lamware-aide-rebaseline
    owner: root
    group: root
    mode: "0644"
    content: |
      // Managed by Ansible (roles/hardening): a package change is not an intrusion.
      DPkg::Post-Invoke { "if [ -x /usr/local/sbin/lamware-aide ]; then systemctl start --no-block lamware-aide-rebaseline.service || true; fi"; };

- name: Load the AIDE units before the post-deploy rebaseline
  ansible.builtin.meta: flush_handlers
