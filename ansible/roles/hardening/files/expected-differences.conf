# Managed by Ansible (roles/hardening). ADR-035.
#
# The differences the nightly AIDE run may absorb without alerting: what a
# detonation, a reboot or the container runtime changes. Anything else alerts,
# and the old baseline stays until a person rebaselines.
#
# Format: allow|deny SECTIONS LETTERS REGEX, first match wins, no match = unexpected.
#   SECTIONS  a subset of ARC: Added, Removed, Changed entries.
#   LETTERS   for an allowed Changed entry, the attributes that may change, from AIDE's
#             summary string YlZbpugamcinHAXSEC ('-' for none). Never p, u, g, A, X,
#             S, E or C (mode, owner, group, ACLs, xattrs, SELinux, ext2 attributes,
#             capabilities), and never Y (the file type), except where a rule says why.
#   REGEX     must match the whole path (Python re.fullmatch).
#
# Built from the 30 reports kept on the host (2026-11-04 to 11-20) and the three
# nightly checks of 11-17, 11-18 and 11-19. Every rule names what was seen. A new
# kind of difference is an alert first; add it here only once it is explained.

# --- a detonation ------------------------------------------------------------------
# CAPE's logs. The live logs change group because each day's file is created by
# whichever CAPE process rotates it first: cape.service runs Group=lamware, the web
# service Group=cape (seen in 11 reports). ADR-031 phase 1 should remove the need.
allow C   cm       /opt/CAPEv2/log
allow C   HZbcimg  /opt/CAPEv2/log/(cuckoo|process)\.log
allow AR  -        /opt/CAPEv2/log/(cuckoo|process)\.log\.\d{4}-\d{2}-\d{2}
allow ARC HZbcim   /opt/CAPEv2/log/process-\d+\.log
# The sample CAPE received, staged for the guest.
allow ARC Zbcimn   /tmp/cuckoo-tmp
allow ARC HZbcim   /tmp/cuckoo-tmp/upload_\w+(/[^/]+)?
allow C   cim      /tmp/cape-external
allow C   cm       /var/lib/lamware-memdump
# The guest: per-run overlay images, the base image's ctime (libvirt relabels it;
# its contents never changed in any report, so H is not allowed), and the state
# libvirt and swtpm keep for the revert snapshot.
allow C   cm       /var/lib/libvirt/images
allow AR  -        /var/lib/libvirt/images/windows11-guest\.\d+
allow C   c        /var/lib/libvirt/images/windows11-guest\.qcow2
allow C   c        /var/lib/libvirt/qemu/(checkpoint|ram)
allow C   Hcm      /var/lib/libvirt/qemu/nvram/clean_VARS\.fd
allow C   cm       /var/lib/libvirt/qemu/snapshot/clean
allow C   HZbcim   /var/lib/libvirt/qemu/snapshot/clean/clean\.xml
allow C   cm       /var/lib/libvirt/swtpm/[0-9a-f-]{36}/tpm2
allow C   HZbcim   /var/lib/libvirt/swtpm/[0-9a-f-]{36}/tpm2/(\.lock|tpm2-00\.permall)
allow C   HZbcm    /var/log/swtpm/libvirt/qemu/clean-swtpm\.log
allow C   HZbcim   /var/lib/libvirt/dnsmasq(/detonation\.(addnhosts|conf|hostsfile))?
allow C   HZbcim   /var/cache/libvirt/qemu/capabilities(/[0-9a-f]{64}\.xml)?
# Configuration libvirt rewrites on every VM start: the domain XML and the per-VM
# AppArmor profile (virt-aa-helper). Contents only; an owner or mode change alerts.
# Accepted by the owner (ADR-035) as the one weakening in this file.
allow C   cm       /etc/libvirt/qemu
allow C   HZbcim   /etc/libvirt/qemu/clean\.xml
allow C   cm       /etc/apparmor\.d/libvirt
allow ARC HZbcim   /etc/apparmor\.d/libvirt/libvirt-[0-9a-f-]{36}(\.files)?
allow C   cim      /tmp/mongodb-27017\.sock

# --- a reboot, outside /run (the 11-16 check, after three test boots) --------------
# postfix copies /etc files into its chroot at every start: new inodes and times,
# never new contents (no H), so an edited source file still alerts on its own.
allow C   cim      /var/spool/postfix/(etc|lib|usr|dev|private|public)/.*
# udev's disk links point at whatever the kernel enumerated this boot; the two NVMe
# drives swap names between boots, so their nodes are added and removed.
allow C   l        /dev/disk/by-[a-z]+/.*
allow AR  -        /dev/nvme\d+n\d+(p\d+)?
# cloud-init's per-boot state. Its status and cached objects change contents; the
# user data and scripts it ran must not (times only), so a planted one alerts.
allow C   HZbcim   /var/lib/cloud/data/(result|status)\.json
allow C   HZbcim   /var/lib/cloud/instances/[0-9a-f-]{36}/(obj\.pkl|datasource|boot-finished|[a-z0-9-]+\.txt\.i)
allow C   cim      /var/lib/cloud(/.*)?
allow C   cm       /var/lib/cloud/instance
allow AR  -        /var/log/dmesg\.\d+(\.gz)?
# podman's CNI address leases and snapd's state, rewritten at start.
allow ARC HZbcim   /var/lib/cni/networks/podman/.*
allow C   HZbcim   /var/lib/snapd/(state|maintenance)\.json
allow C   cim      /var/cache/snapd/sections
# CAPE recompiles its memory YARA index at start: times only, never contents.
allow C   cm       /opt/CAPEv2/data/yara/index_memory\.yarc

# --- a reboot and the container runtime: /run --------------------------------------
# /run is rebuilt on every boot, and podman adds and removes per-container state.
# A NEW file where systemd reads units at runtime would run until the next reboot,
# so additions there alert, except podman's own per-container scopes.
deny  A   -        /run/systemd/(system|generator[^/]*|transient)/(?!libpod-[0-9a-f]{64}\.scope\Z).*
# Credentials systemd hands to services: new inodes after a restart are expected,
# new contents are not (a deploy that changes a key rebaselines on its own).
allow C   cim      /run/credentials(/.*)?
deny  AR  -        /run/credentials(/.*)?
# Everything else under /run: contents, times, inodes, link counts and symlink
# targets (udev's disk links and systemd's invocation ids change on every boot).
allow ARC HZbacimnl /run(/.*)?
allow C   cm       /tmp/snap-private-tmp
