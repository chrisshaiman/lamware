---
- name: Restart usbguard
  ansible.builtin.systemd_service:
    name: usbguard
    state: restarted
  failed_when: false

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Restart systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
