---
# =============================================================================
# roles/api/tasks/main.yml
# Deploys the lamware FastAPI backend (port 8001).
#
# Runs as a systemd service behind WireGuard alongside the Flask dashboard.
# Reads from the same PostgreSQL database as the dashboard.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Create lamware-api install directory
  ansible.builtin.file:
    path: "{{ api_install_dir }}"
    state: directory
    owner: "{{ api_user }}"
    group: "{{ api_user }}"
    mode: "0750"

- name: Copy api/ source code to server
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../api/"
    dest: "{{ api_install_dir }}/"
    owner: "{{ api_user }}"
    group: "{{ api_user }}"
    mode: "preserve"
  notify: Restart lamware-api

- name: Fix ownership of api source files
  ansible.builtin.file:
    path: "{{ api_install_dir }}"
    state: directory
    owner: "{{ api_user }}"
    group: "{{ api_user }}"
    recurse: true

- name: Remove broken venv if pip is missing
  ansible.builtin.file:
    path: "{{ api_install_dir }}/venv"
    state: absent
  when: not (api_install_dir + '/venv/bin/pip') is file

- name: Create Python venv for lamware-api
  ansible.builtin.command:
    cmd: python3 -m venv "{{ api_install_dir }}/venv"
    creates: "{{ api_install_dir }}/venv/bin/pip"

- name: Install lamware-api dependencies into venv
  ansible.builtin.command:
    cmd: "{{ api_install_dir }}/venv/bin/pip install -e ."
    chdir: "{{ api_install_dir }}"
  become: true
  become_user: "{{ api_user }}"
  changed_when: true
  notify: Restart lamware-api

- name: Deploy lamware-api environment file
  ansible.builtin.template:
    src: lamware-api.env.j2
    dest: "{{ api_install_dir }}/lamware-api.env"
    owner: "{{ api_user }}"
    group: "{{ api_user }}"
    mode: "0600"
  no_log: true
  notify: Restart lamware-api

- name: Deploy lamware-api systemd service
  ansible.builtin.template:
    src: lamware-api.service.j2
    dest: /etc/systemd/system/lamware-api.service
    mode: "0644"
  notify: Restart lamware-api

- name: Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: Enable and start lamware-api
  ansible.builtin.systemd:
    name: lamware-api
    state: started
    enabled: true
