---
# roles/api/defaults/main.yml

api_install_dir: /opt/lamware-api
api_port: 8001
api_host: "127.0.0.1"
api_user: lamware-api

# Where pipeline-spool-run moves a sample whose pipeline run failed (#534),
# next to a <name>.failure sidecar. Holds LIVE MALWARE: pipeline:pipeline 0750,
# outside the spool (DirectoryNotEmpty= would count it and re-trigger forever)
# and outside anything nginx or the API serves.
api_spool_failed_dir: /opt/pipeline/spool-failed
# Where the spool runner claims an entry before checking it (same filesystem as the spool).
api_spool_claim_dir: /opt/pipeline/spool-claim

# Extra CORS origins for local frontend development against this API, e.g.
# ["http://localhost:3000"]. Empty in production (#730): the dev origin used to
# ship in every deploy.
api_cors_dev_origins: []

# The investigation panel's models (ADR-038, as amended): the operator's list, not
# the pipeline's profiles. Each `name` is a LiteLLM model alias that LiteLLM serves
# (tests/test_investigate_models.py renders the model list to check), and the panel
# shows `label`. The first is a new session's model. The API's allow-list and the
# scoped `investigate` LiteLLM key are both this list. Labels: no single quotes
# (the env file single-quotes the list).
api_investigate_models:
  - {name: claude-sonnet-4-6, label: Sonnet}
  - {name: claude-opus-4-6, label: Opus}
  - {name: claude-haiku-4-5, label: Haiku}
