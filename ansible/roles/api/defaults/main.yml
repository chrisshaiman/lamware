---
# roles/api/defaults/main.yml

api_install_dir: /opt/lamware-api
api_port: 8001
api_host: "127.0.0.1"
api_user: lamware-api

# Where pipeline-spool-run moves a sample whose pipeline run failed (#534),
# next to a <name>.failure sidecar. Holds LIVE MALWARE: pipeline:pipeline 0750,
# outside the spool (DirectoryNotEmpty= would count it and re-trigger forever)
# and outside anything nginx or the API serves.
api_spool_failed_dir: /opt/pipeline/spool-failed

# Extra CORS origins for local frontend development against this API, e.g.
# ["http://localhost:3000"]. Empty in production (#730): the dev origin used to
# ship in every deploy.
api_cors_dev_origins: []
