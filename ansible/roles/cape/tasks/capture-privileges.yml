---
# =============================================================================
# roles/cape/tasks/capture-privileges.yml
# CAPE's sniffer captures through a root helper on the detonation bridge only (ADR-029).
#
# cape2.sh installs two sudoers rules for the cape user:
#   /etc/sudoers.d/tcpdump   cape ALL=NOPASSWD: /usr/bin/tcpdump        (any arguments)
#   /etc/sudoers.d/ip_netns  cape ALL=NOPASSWD: /usr/sbin/ip netns exec * /usr/bin/sudo -u cape *
# Both made cape root-equivalent, and were replaced (2026-10-06) by file
# capabilities on tcpdump for a group only cape was in. That still let cape
# capture on ANY interface, loopback included, where nginx's upstream traffic and
# every LLM call travel in clear text.
#
# Now tcpdump has no capabilities and cape is in no capture group. CAPE's sniffer
# uses sudo when `sudo --list <tcpdump>` succeeds, with a fixed argument shape and
# `-Z cape`; its configured tcpdump is the helper, which accepts only that shape,
# only the detonation bridge, and only a task's dump.pcap, opened as cape.
#
# The ip netns rule is used only by modules/auxiliary/Mitmdump.py, which is not
# configured here. Enabling it would need the rule back, so that is asserted.
# =============================================================================

- name: Refuse to drop the netns rule while Mitmdump is configured
  # The [Mitmdump] section ships with `enabled = no`; only an enabled one needs the rule.
  ansible.builtin.command: >-
    awk 'BEGIN{IGNORECASE=1} /^[[:space:]]*\[/{s=tolower($0); gsub(/[[:space:]]/,"",s)}
    s=="[mitmdump]" && /^[[:space:]]*enabled[[:space:]]*=[[:space:]]*(yes|true|on|1)[[:space:]]*$/{f=1}
    END{exit f?0:1}' {{ cape_install_dir }}/conf/auxiliary.conf
  register: cape_mitmdump_configured
  check_mode: false   # read-only; its result is needed in --check too
  changed_when: false
  failed_when: cape_mitmdump_configured.rc == 0

- name: Install the capture helper (root-owned; ADR-029)
  ansible.builtin.template:
    src: lamware-capture.j2
    dest: "{{ cape_capture_helper }}"
    owner: root
    group: root
    mode: "0755"

# The helper takes any arguments from sudo's point of view and validates them
# itself, as lamware-vm does. !use_pty: with a pty, sudo's child is a root monitor
# process, and CAPE stops the sniffer by signalling sudo's child (it cannot signal
# sudo), so it would never stop. Without it, sudo's child is tcpdump, running as
# cape after -Z.
- name: Let cape run the capture helper through sudo
  ansible.builtin.copy:
    dest: /etc/sudoers.d/lamware-capture
    content: |
      # managed by Ansible (cape role) -- ADR-029. The helper accepts only CAPE's
      # sniffer arguments, the detonation bridge, and a task's dump.pcap.
      Defaults!{{ cape_capture_helper }} !use_pty
      {{ cape_user }} ALL=(root) NOPASSWD: {{ cape_capture_helper }}
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

- name: Point CAPE's sniffer at the capture helper
  community.general.ini_file:
    path: "{{ cape_install_dir }}/conf/auxiliary.conf"
    section: sniffer
    option: tcpdump
    value: "{{ cape_capture_helper }}"
    mode: "0640"
  notify: Restart Cape services

# Prove the helper captures, as cape, through sudo, before anything is taken away.
# Task id 0 is never a real CAPE task. timeout's 124 means tcpdump had the interface
# open and was still capturing; a refusal exits 2 at once. A valid pcap starts with
# its magic number, which tcpdump writes as soon as the file is opened.
- name: Check cape can capture on the detonation bridge through the helper
  ansible.builtin.shell:
    cmd: |
      set -u
      d="{{ cape_vm_dump_analyses_dir }}/0"
      sudo -u {{ cape_user }} mkdir -p "$d"
      sudo -u {{ cape_user }} timeout 3 sudo -n {{ cape_capture_helper }} -U -q -s 0 \
        -i {{ cape_capture_interface }} -n -Z {{ cape_user }} -w "$d/dump.pcap" not arp
      rc=$?
      magic=$(od -An -tx1 -N4 "$d/dump.pcap" 2>/dev/null | tr -d ' \n')
      owner=$(stat -c '%U:%G' "$d/dump.pcap" 2>/dev/null)
      rm -rf -- "$d"
      echo "rc=$rc magic=$magic owner=$owner"
    executable: /bin/bash
  register: cape_capture_probe
  changed_when: false
  failed_when: >-
    cape_capture_probe.stdout is not search('rc=124 ')
    or cape_capture_probe.stdout is not search('magic=d4c3b2a1 ')
    or cape_capture_probe.stdout is not search('owner=' ~ cape_user ~ ':' ~ cape_user ~ '$')
  when: not ansible_check_mode

# --- what the helper replaces -------------------------------------------------

- name: Read tcpdump's capabilities
  ansible.builtin.command: getcap /usr/bin/tcpdump
  register: cape_tcpdump_caps
  check_mode: false   # read-only; its result is needed in --check too
  changed_when: false

- name: Remove tcpdump's capture capabilities
  ansible.builtin.command: setcap -r /usr/bin/tcpdump
  when: cape_tcpdump_caps.stdout | trim | length > 0
  changed_when: true

- name: Remove the apt hook and script that re-applied them
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/apt.conf.d/80-lamware-tcpdump-caps
    - /usr/local/sbin/lamware-tcpdump-caps

- name: Read the tcpdump statoverride
  ansible.builtin.command: dpkg-statoverride --list /usr/bin/tcpdump
  register: cape_tcpdump_override
  check_mode: false   # read-only; its result is needed in --check too
  changed_when: false
  failed_when: false

- name: Remove the tcpdump statoverride (root:pcap 0750)
  ansible.builtin.command: dpkg-statoverride --remove /usr/bin/tcpdump
  when: cape_tcpdump_override.stdout | length > 0
  changed_when: true

- name: Give tcpdump the package's owner and mode back
  ansible.builtin.file:
    path: /usr/bin/tcpdump
    owner: root
    group: root
    mode: "0755"

- name: Read the pcap group
  ansible.builtin.getent:
    database: group
    key: pcap
    fail_key: false

- name: Take cape out of the pcap group
  ansible.builtin.command: gpasswd -d {{ cape_user }} pcap
  when:
    - ansible_facts.getent_group.pcap is not none
    - cape_user in (ansible_facts.getent_group.pcap[2] | default('')).split(',')
  changed_when: true
  notify: Restart Cape services

- name: Remove the pcap group
  ansible.builtin.group:
    name: pcap
    state: absent

- name: Remove the sudo rules that made cape root-equivalent
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item }}"
    state: absent
  loop:
    - tcpdump
    - ip_netns

# cape2.sh writes /etc/sudoers.d/cape as 0600. sudo accepts that, but `visudo -c`
# reports it as an error, which would make the validation below fail on a file
# this change does not touch. 0440 is the standard mode; owner and group stay
# root, so who can read it does not change.
- name: Give CAPE's remaining sudoers file the standard mode
  ansible.builtin.file:
    path: /etc/sudoers.d/cape
    mode: "0440"
    owner: root
    group: root

# These read the state AFTER the changes above, so they only mean something on a
# real run; in --check nothing above was applied.
- name: Validate sudoers after the removal
  ansible.builtin.command: visudo -c
  changed_when: false
  when: not ansible_check_mode

- name: Read what cape may still run through sudo
  ansible.builtin.command: sudo -l -U {{ cape_user }}
  register: cape_sudo_list
  changed_when: false
  when: not ansible_check_mode

- name: Refuse if a capture or netns rule other than the helper is granted
  ansible.builtin.assert:
    that:
      - "'tcpdump' not in cape_sudo_list.stdout"
      - "'netns' not in cape_sudo_list.stdout"
      - "cape_capture_helper in cape_sudo_list.stdout"
    fail_msg: "{{ cape_user }}'s sudo rights are not what ADR-029 expects:\n{{ cape_sudo_list.stdout }}"
  when: not ansible_check_mode
