---
# =============================================================================
# roles/cape/tasks/credentials.yml
# Replaces the two credentials CAPE's installer leaves at known values.
#
# 1. The Django superuser is created with its password equal to its username.
#    web_auth is off, nothing logs in with it (last_login was never set), and
#    the pipeline authenticates to the API with a token. The password is made
#    unusable rather than vaulted: there is no login to keep working. It is
#    cleared ONLY while it still equals the username, so a password an operator
#    sets on purpose (`manage.py changepassword`) is left alone.
#
# 2. The `cape` Postgres role's password is `cape_db_password` from the vault
#    (M19). cape2.sh leaves its published default in cuckoo.conf's [database]
#    connection; #738 replaced that with a random value kept only in cuckoo.conf.
#    Now the vault is the source: whenever the role's password in cuckoo.conf
#    is not the vault value, the role password and the conf line are set to it
#    together, CAPE is restarted, and the new login is proven. When they match,
#    nothing happens. Neither value is ever logged.
#
# Rollback: the pre-change cuckoo.conf is copied to {{ cape_rollback_dir }}
# (root, 0600, one file per change) before anything changes. Restore it, then
# `ALTER ROLE cape PASSWORD '<the password in that file>'` as postgres, then
# restart cape, cape-processor and cape-web.
# =============================================================================

- name: Make the Django superuser's password unusable while it equals its username
  ansible.builtin.shell: |
    cd {{ cape_install_dir }}/web
    /etc/poetry/venv/bin/poetry run python3 manage.py shell -c "
    from django.contrib.auth.models import User
    u = User.objects.filter(username='{{ cape_user }}').first()
    if u is not None and u.has_usable_password() and u.check_password(u.username):
        u.set_unusable_password()
        u.save()
        print('cleared')
    else:
        print('ok')
    "
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ cape_user }}"
  register: cape_superuser_password
  changed_when: "'cleared' in cape_superuser_password.stdout"
  failed_when: >-
    cape_superuser_password.rc != 0
    or ('cleared' not in cape_superuser_password.stdout
        and 'ok' not in cape_superuser_password.stdout)

- name: Read CAPE's database connection
  ansible.builtin.slurp:
    src: "{{ cape_install_dir }}/conf/cuckoo.conf"
  register: cape_cuckoo_conf
  no_log: true

- name: Decide whether the database password matches the vault
  ansible.builtin.set_fact:
    cape_db_password_matches: >-
      {{ ((cape_cuckoo_conf.content | b64decode)
          | regex_findall('(?m)^connection\s*=\s*postgresql://' ~ cape_db_user ~ ':([^@]*)@')
          | first | default(''))
         == (cape_db_password | mandatory) }}
  no_log: true

- name: Set the database password from the vault
  when: not (cape_db_password_matches | bool)
  block:
    - name: Create the rollback directory
      ansible.builtin.file:
        path: "{{ cape_rollback_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Keep the pre-change cuckoo.conf for rollback
      ansible.builtin.copy:
        src: "{{ cape_install_dir }}/conf/cuckoo.conf"
        dest: "{{ cape_rollback_dir }}/cuckoo.conf.{{ ansible_date_time.iso8601_basic_short }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"

    - name: Set the vault password on the cape Postgres role
      become: true
      become_user: postgres
      community.postgresql.postgresql_user:
        name: "{{ cape_db_user }}"
        password: "{{ cape_db_password }}"
      no_log: true

    - name: Point CAPE's connection at the vault password
      ansible.builtin.replace:
        path: "{{ cape_install_dir }}/conf/cuckoo.conf"
        regexp: '^(connection\s*=\s*postgresql://{{ cape_db_user }}:)[^@]*@'
        replace: '\g<1>{{ cape_db_password }}@'
      no_log: true

    # Explicit, not the role handler: that handler ignores failures, and a
    # wrong password here leaves CAPE down while the deploy reports success.
    - name: Restart CAPE on the vault database password
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      loop: [cape, cape-processor, cape-web]

    - name: Prove the vault password logs in
      become: true
      become_user: "{{ cape_user }}"
      ansible.builtin.command:
        cmd: psql -h 127.0.0.1 -U {{ cape_db_user }} -d cape -Atc "select 1"
      environment:
        PGPASSWORD: "{{ cape_db_password }}"
      register: cape_db_login
      changed_when: false
      failed_when: cape_db_login.rc != 0 or cape_db_login.stdout != "1"
      no_log: true

    - name: Wait for CAPE to stay up after the credential change
      ansible.builtin.command:
        cmd: systemctl is-active cape cape-processor cape-web
      register: cape_after_credentials
      changed_when: false
      retries: 6
      delay: 5
      until: cape_after_credentials.rc == 0

- name: Fail if the installer default database password is still anywhere in CAPE's config
  ansible.builtin.command:
    cmd: grep -rlF -- "{{ cape_db_default_password }}" {{ cape_install_dir }}/conf
  register: cape_db_default_left
  changed_when: false
  failed_when: cape_db_default_left.rc != 1
  no_log: true
