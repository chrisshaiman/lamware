---
# =============================================================================
# roles/cape/tasks/credentials.yml
# Replaces the two credentials CAPE's installer leaves at known values.
#
# 1. The Django superuser is created with its password equal to its username.
#    web_auth is off, nothing logs in with it (last_login was never set), and
#    the pipeline authenticates to the API with a token. The password is made
#    unusable rather than vaulted: there is no login to keep working. It is
#    cleared ONLY while it still equals the username, so a password an operator
#    sets on purpose (`manage.py changepassword`) is left alone.
#
# 2. The `cape` Postgres role keeps cape2.sh's default password, written into
#    cuckoo.conf's [database] connection. It is replaced by a random one that
#    lives only where CAPE already reads it (cuckoo.conf, cape:cape 0640). It is
#    generated in memory, never written to the repo, the vault or a log. These
#    tasks run only while the default is still present, so they act once.
#
# Rollback: the pre-change cuckoo.conf is copied to {{ cape_rollback_dir }}
# (root, 0600) before anything changes. Restore that file, then
# `ALTER ROLE cape PASSWORD '<the old one>'` as postgres, then restart cape,
# cape-processor and cape-web. The old password is the upstream default.
# =============================================================================

- name: Make the Django superuser's password unusable while it equals its username
  ansible.builtin.shell: |
    cd {{ cape_install_dir }}/web
    /etc/poetry/venv/bin/poetry run python3 manage.py shell -c "
    from django.contrib.auth.models import User
    u = User.objects.filter(username='{{ cape_user }}').first()
    if u is not None and u.has_usable_password() and u.check_password(u.username):
        u.set_unusable_password()
        u.save()
        print('cleared')
    else:
        print('ok')
    "
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ cape_user }}"
  register: cape_superuser_password
  changed_when: "'cleared' in cape_superuser_password.stdout"
  failed_when: >-
    cape_superuser_password.rc != 0
    or ('cleared' not in cape_superuser_password.stdout
        and 'ok' not in cape_superuser_password.stdout)

- name: Read CAPE's database connection
  ansible.builtin.slurp:
    src: "{{ cape_install_dir }}/conf/cuckoo.conf"
  register: cape_cuckoo_conf
  no_log: true

- name: Decide whether the database password is still the installer default
  ansible.builtin.set_fact:
    cape_db_password_is_default: >-
      {{ (cape_cuckoo_conf.content | b64decode)
         is search('(?m)^connection\s*=\s*postgresql://' ~ cape_db_user ~ ':' ~ (cape_db_default_password | regex_escape) ~ '@') }}

- name: Replace the default database password
  when: cape_db_password_is_default | bool
  block:
    - name: Create the rollback directory
      ansible.builtin.file:
        path: "{{ cape_rollback_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Keep the pre-change cuckoo.conf for rollback
      ansible.builtin.copy:
        src: "{{ cape_install_dir }}/conf/cuckoo.conf"
        dest: "{{ cape_rollback_dir }}/cuckoo.conf.before-db-password"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
        force: false

    - name: Generate the new database password (in memory only)
      ansible.builtin.set_fact:
        cape_db_new_password: "{{ lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits'], length=40) }}"
      no_log: true

    - name: Set the new password on the cape Postgres role
      become: true
      become_user: postgres
      community.postgresql.postgresql_user:
        name: "{{ cape_db_user }}"
        password: "{{ cape_db_new_password }}"
      no_log: true

    - name: Point CAPE's connection at the new password
      ansible.builtin.replace:
        path: "{{ cape_install_dir }}/conf/cuckoo.conf"
        regexp: '^(connection\s*=\s*postgresql://{{ cape_db_user }}:){{ cape_db_default_password | regex_escape }}@'
        replace: '\g<1>{{ cape_db_new_password }}@'
      no_log: true

    # Explicit, not the role handler: that handler ignores failures, and a
    # wrong password here leaves CAPE down while the deploy reports success.
    - name: Restart CAPE on the new database password
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: restarted
      loop: [cape, cape-processor, cape-web]

    - name: Prove the new password logs in
      become: true
      become_user: "{{ cape_user }}"
      ansible.builtin.command:
        cmd: psql -h 127.0.0.1 -U {{ cape_db_user }} -d cape -Atc "select 1"
      environment:
        PGPASSWORD: "{{ cape_db_new_password }}"
      register: cape_db_login
      changed_when: false
      failed_when: cape_db_login.rc != 0 or cape_db_login.stdout != "1"
      no_log: true

- name: Fail if the default database password is still anywhere in CAPE's config
  ansible.builtin.command:
    cmd: grep -rlF -- "{{ cape_db_default_password }}" {{ cape_install_dir }}/conf
  register: cape_db_default_left
  changed_when: false
  failed_when: cape_db_default_left.rc != 1
  no_log: true

- name: Wait for CAPE to stay up after the credential change
  ansible.builtin.command:
    cmd: systemctl is-active cape cape-processor cape-web
  register: cape_after_credentials
  changed_when: false
  retries: 6
  delay: 5
  until: cape_after_credentials.rc == 0
  when: cape_db_password_is_default | bool
