---
# =============================================================================
# roles/cape/tasks/main.yml
# Runs the CAPEv2 installer (cape2.sh), configures all Cape services,
# and performs ordered service startup.
#
# Depends on: qemu-patched (patched QEMU binary), mongodb (running mongod)
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

# -------------------------------------------------------------------------
# cape2.sh — installs Cape services (runs once)
# -------------------------------------------------------------------------

- name: Check if cape2.sh has already run
  ansible.builtin.stat:
    path: /lib/systemd/system/cape.service
  register: cape_service_file

- name: Run cape2.sh (installs Cape systemd services)
  ansible.builtin.shell: |
    export DEBIAN_FRONTEND=noninteractive
    export NEEDRESTART_MODE=a
    cd {{ cape_install_dir }}/installer
    bash cape2.sh base {{ cape_user }}
  args:
    executable: /bin/bash
  when: not cape_service_file.stat.exists
  changed_when: true

- name: Check if patched QEMU build exists
  ansible.builtin.stat:
    path: /tmp/qemu-9.2.2_builded/usr/bin/qemu-system-x86_64
  register: cape_qemu_build

- name: Restore patched QEMU binary (cape2.sh apt-get may overwrite it)
  ansible.builtin.copy:
    src: /tmp/qemu-9.2.2_builded/usr/bin/qemu-system-x86_64
    dest: /usr/bin/qemu-system-x86_64
    mode: "0755"
    remote_src: true
  when: cape_qemu_build.stat.exists

- name: Restart libvirtd after QEMU binary restore
  ansible.builtin.systemd:
    name: libvirtd
    state: restarted
  when: cape_qemu_build.stat.exists

- name: Remove broken apt repos re-added by cape2.sh
  ansible.builtin.shell: |
    rm -f /etc/apt/sources.list.d/mongodb*.list
    rm -f /etc/apt/sources.list.d/tor*.list
    rm -f /etc/apt/sources.list.d/pgdg*.list
    rm -f /etc/apt/keyrings/mongo.gpg
  args:
    executable: /bin/bash
  changed_when: false

- name: Fix CAPEv2 directory ownership after cape2.sh
  ansible.builtin.file:
    path: "{{ cape_install_dir }}"
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    recurse: true

- name: Fix Cape poetry directory permissions (cape2.sh sets 700)
  ansible.builtin.file:
    path: /etc/poetry
    mode: "0755"
    recurse: true

- name: Install Cape Python dependencies as cape user
  ansible.builtin.shell: |
    cd {{ cape_install_dir }}
    /etc/poetry/bin/poetry install --no-root
    /etc/poetry/bin/poetry run pip install libvirt-python
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ cape_user }}"
  changed_when: true

# -------------------------------------------------------------------------
# Cape configuration — always applied (idempotent ini_file edits)
# Stop services before editing config so they don't run with stale settings.
# cape2.sh may auto-start services; explicit stop ensures config is applied
# before the services come back up.
# -------------------------------------------------------------------------

- name: Stop Cape services before configuration
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - cape
    - cape-web
    - cape-processor
  failed_when: false  # services may not exist yet on first run
  when: cape_service_file.stat.exists

# Resultserver must listen on the detonation bridge gateway so VMs can
# reach it. VMs have no route to eth0 or wg0.
# Cape reads resultserver config from cuckoo.conf (not cape.conf).
- name: Set resultserver IP in cuckoo.conf
  community.general.ini_file:
    path: "{{ cape_install_dir }}/conf/cuckoo.conf"
    section: resultserver
    option: ip
    value: "{{ cape_result_ip }}"
    mode: "0640"

- name: Set resultserver IP in cape.conf
  community.general.ini_file:
    path: "{{ cape_install_dir }}/conf/cape.conf"
    section: resultserver
    option: ip
    value: "{{ cape_result_ip }}"
    mode: "0640"

# Cache procdumps so the pipeline can scan them for .NET payloads
# extracted from dropper scenarios (process hollowing, injection).
- name: Enable procdump caching in processing.conf
  community.general.ini_file:
    path: "{{ cape_install_dir }}/conf/processing.conf"
    section: CAPE
    option: cache_procdump
    value: "yes"
    mode: "0640"

# Go binaries are routinely 10-50MB due to static linking.
# Default 30MB is too low — match cuckoo.conf upload_max_size.
- name: Increase web upload size limit for large binaries
  community.general.ini_file:
    path: "{{ cape_install_dir }}/conf/web.conf"
    section: general
    option: max_sample_size
    value: "100000000"
    mode: "0640"

# Enable QEMU-based screenshots (host-side VNC capture, invisible to guest).
# Disable in-guest PIL screenshots since they fail without desktop session.
- name: Enable QEMU screenshots
  community.general.ini_file:
    path: "{{ cape_install_dir }}/conf/auxiliary.conf"
    section: QemuScreenshots
    option: enabled
    value: "yes"
    mode: "0640"

- name: Disable in-guest PIL screenshots
  community.general.ini_file:
    path: "{{ cape_install_dir }}/conf/auxiliary.conf"
    section: screenshots
    option: screenshots_windows
    value: "no"
    mode: "0640"

# api.conf [api] url is the display URL shown in the web UI — not the bind address.
# Set it to the WireGuard address so Cape links and callbacks use the correct host.
- name: Set Cape API display URL to WireGuard interface
  community.general.ini_file:
    path: "{{ cape_install_dir }}/conf/api.conf"
    section: api
    option: url
    value: "http://{{ wireguard_address | ansible.utils.ipaddr('address') }}:{{ cape_api_port }}"
    mode: "0640"

# The actual bind address for the Cape web/API server is controlled by the
# ExecStart line in cape-web.service, which defaults to 0.0.0.0:8000 (all
# interfaces). Replace it with the WireGuard IP so the API is never reachable
# on eth0 — security constraint from SECURITY_CONSTRAINTS.md.
- name: Restrict cape-web to WireGuard interface
  ansible.builtin.lineinfile:
    path: /lib/systemd/system/cape-web.service
    regexp: '(ExecStart=.*runserver_plus\s+)\S+(:\d+.*)'
    line: "\\g<1>{{ wireguard_address | ansible.utils.ipaddr('address') }}\\g<2>"
    backrefs: true
  # backrefs: true — only modifies when the regex matches. If Cape changes the
  # unit file format and the regex no longer matches, the task is skipped (no
  # change) rather than appending a second ExecStart line which systemd rejects.
  # If this task is skipped unexpectedly, the next Ansible run will surface it
  # as a changed=0 on a task that should always change on first provision.

# API key authentication — prevents unauthenticated sample submission
- name: Set Cape API key
  community.general.ini_file:
    path: "{{ cape_install_dir }}/conf/api.conf"
    section: api
    option: api_token
    value: "{{ cape_api_key }}"
    mode: "0640"
  no_log: true

- name: Enable Cape API token authentication
  community.general.ini_file:
    path: "{{ cape_install_dir }}/conf/api.conf"
    section: api
    option: token_auth_enabled
    value: "yes"
    mode: "0640"

# Enable the cuckoostatus API endpoint — used by auto-feeder health check
# to verify CAPE is running and machines are available before submitting samples.
- name: Enable cuckoostatus API endpoint
  community.general.ini_file:
    path: "{{ cape_install_dir }}/conf/api.conf"
    section: cuckoostatus
    option: enabled
    value: "yes"
    mode: "0640"

# KVM is the only supported machinery for bare metal analysis
- name: Set Cape machinery to kvm
  community.general.ini_file:
    path: "{{ cape_install_dir }}/conf/cape.conf"
    section: cuckoo
    option: machinery
    value: kvm
    mode: "0640"

# KVM machinery config — use the detonation bridge
- name: Set KVM interface to detonation bridge
  community.general.ini_file:
    path: "{{ cape_install_dir }}/conf/kvm.conf"
    section: kvm
    option: interface
    value: "{{ cape_interface }}"
    mode: "0640"

# -------------------------------------------------------------------------
# Analyzer package overrides — LibreOffice fallback for Office documents
# The default doc/xls/ppt packages only look for MS Office executables.
# These patched versions try MS Office first, then fall back to
# LibreOffice (soffice.exe) which is installed in the guest VM.
# -------------------------------------------------------------------------

- name: Deploy Office package overrides (LibreOffice fallback)
  ansible.builtin.copy:
    src: "packages/{{ item }}"
    dest: "{{ cape_install_dir }}/analyzer/windows/modules/packages/{{ item }}"
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0644"
  loop:
    - doc.py
    - xls.py
    - ppt.py

# -------------------------------------------------------------------------
# Database + service startup — ordered to avoid race conditions
# -------------------------------------------------------------------------

- name: Reload systemd after cape2.sh installs unit files
  ansible.builtin.systemd:
    daemon_reload: true

- name: Ensure Cape PostgreSQL database exists
  ansible.builtin.shell: |
    set -o pipefail
    sudo -u postgres psql -lqt | grep -qw cape || sudo -u postgres createdb -O cape cape
  args:
    executable: /bin/bash
  changed_when: false

- name: Enable Cape services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop:
    - cape
    - cape-web
    - cape-processor

- name: Stop Cape services before ordered restart
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - cape-processor
    - cape-web
    - cape
  failed_when: false

- name: Start Cape core service (initializes DB schema)
  ansible.builtin.systemd:
    name: cape
    state: started

- name: Wait for Cape to initialize
  ansible.builtin.pause:
    seconds: 10

- name: Start Cape web and processor
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
  loop:
    - cape-web
    - cape-processor

# -------------------------------------------------------------------------
# Django setup — migrations, superuser, API token
# Cape's web UI uses Django. The auth tables must exist before token auth
# can work. These tasks are idempotent — migrate is safe to re-run, and
# the user/token creation checks for existence before creating.
# -------------------------------------------------------------------------

- name: Run Django database migrations
  ansible.builtin.shell: |
    cd {{ cape_install_dir }}/web
    /etc/poetry/venv/bin/poetry run python3 manage.py migrate --noinput
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ cape_user }}"
  changed_when: false

- name: Create Django superuser for Cape API
  ansible.builtin.shell: |
    cd {{ cape_install_dir }}/web
    /etc/poetry/venv/bin/poetry run python3 manage.py shell -c "
    from django.contrib.auth.models import User
    if not User.objects.filter(username='{{ cape_user }}').exists():
        User.objects.create_superuser('{{ cape_user }}', '{{ cape_user }}@localhost', '{{ cape_user }}')
        print('created')
    else:
        print('exists')
    "
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ cape_user }}"
  register: cape_django_user
  changed_when: "'created' in cape_django_user.stdout"

- name: Generate Cape API token
  ansible.builtin.shell: |
    set -o pipefail
    cd {{ cape_install_dir }}/web
    /etc/poetry/venv/bin/poetry run python3 manage.py drf_create_token {{ cape_user }} 2>/dev/null \
      | grep -oP 'Generated token \K\S+'
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ cape_user }}"
  register: cape_api_token
  changed_when: cape_api_token.stdout | length > 0
  failed_when: false

- name: Notify if new Cape API token was generated
  ansible.builtin.debug:
    msg: "New Cape API token generated — update secrets.yml with: ansible-vault edit ansible/vars/secrets.yml"
  when: cape_api_token.stdout | length > 0

# -------------------------------------------------------------------------
# routing.conf — network simulation via INetSim (ADR-011)
# Tells Cape to route all guest traffic to INetSim on the detonation
# bridge gateway rather than passing through to the internet.
# -------------------------------------------------------------------------

- name: Deploy routing.conf
  ansible.builtin.template:
    src: routing.conf.j2
    dest: "{{ cape_install_dir }}/conf/routing.conf"
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0640"
  notify: Restart Cape services

# -------------------------------------------------------------------------
# kvm.conf — machine list and per-machine stanzas (ADR-013)
# Two machines: clean (base Win10 snapshot) and office (LibreOffice snapshot).
# Tag "office" routes Office document samples to the office machine.
# -------------------------------------------------------------------------

- name: Set Cape machine list in kvm.conf
  community.general.ini_file:
    path: "{{ cape_install_dir }}/conf/kvm.conf"
    section: kvm
    option: machines
    value: "{{ cape_guests | map(attribute='name') | join(',') }}"
    mode: "0640"
  notify: Restart Cape services

- name: Configure kvm.conf machine stanzas
  community.general.ini_file:
    path: "{{ cape_install_dir }}/conf/kvm.conf"
    section: "{{ item.0.name }}"
    option: "{{ item.1.key }}"
    value: "{{ item.1.value }}"
    mode: "0640"
  loop: "{{ cape_guests | subelements('conf_options') }}"
  loop_control:
    label: "[{{ item.0.name }}] {{ item.1.key }}"
  notify: Restart Cape services

# -------------------------------------------------------------------------
# CAPE service drop-in — set group to lamware and umask so new analysis
# directories are group-readable by the pipeline user. Without this, CAPE
# creates files as cape:cape 0750 which the pipeline can't read.
# -------------------------------------------------------------------------

- name: Create CAPE service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/cape.service.d
    state: directory
    mode: "0755"

- name: Deploy CAPE service drop-in (lamware group + umask)
  ansible.builtin.copy:
    dest: /etc/systemd/system/cape.service.d/lamware-group.conf
    mode: "0644"
    content: |
      [Service]
      Group=lamware
      UMask=0027
  notify: Restart Cape services

- name: Create CAPE processor drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/cape-processor.service.d
    state: directory
    mode: "0755"

- name: Deploy CAPE processor drop-in (lamware group + umask)
  ansible.builtin.copy:
    dest: /etc/systemd/system/cape-processor.service.d/lamware-group.conf
    mode: "0644"
    content: |
      [Service]
      Group=lamware
      UMask=0027
  notify: Restart Cape services

- name: Create CAPE rooter drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/cape-rooter.service.d
    state: directory
    mode: "0755"

- name: Deploy CAPE rooter drop-in (UMask for group-readable pcap)
  ansible.builtin.copy:
    dest: /etc/systemd/system/cape-rooter.service.d/lamware-umask.conf
    mode: "0644"
    content: |
      [Service]
      UMask=0027
  notify: Restart Cape services

# -------------------------------------------------------------------------
# tcpdump wrapper — tcpdump ignores parent umask and creates dump.pcap
# as 0600. This wrapper sets umask 0027 before calling the real tcpdump
# so files are created group-readable for the pipeline user.
# -------------------------------------------------------------------------

- name: Create tcpdump wrapper (umask fix for group-readable pcaps)
  ansible.builtin.copy:
    dest: /usr/local/bin/tcpdump
    mode: "0755"
    content: |
      #!/bin/bash
      umask 0027
      exec /usr/bin/tcpdump "$@"

# -------------------------------------------------------------------------
# Memory dump cleanup — delete full + per-process memory dumps older than
# 1h. These are 2-4GB each and CAPE never auto-deletes them. The pipeline
# user cannot delete these (security boundary) so cape owns this cleanup.
# Also fix group ownership on any analyses that slipped through before the
# drop-in was applied.
# -------------------------------------------------------------------------

- name: Allow cape user to use crontab
  ansible.builtin.lineinfile:
    path: /etc/cron.allow
    line: "{{ cape_user }}"
    create: true
    mode: "0600"

- name: Set CAPE storage directories to lamware group
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ cape_user }}"
    group: lamware
    mode: "2750"
  loop:
    - "{{ cape_install_dir }}/storage"
    - "{{ cape_install_dir }}/storage/analyses"
    - "{{ cape_install_dir }}/storage/binaries"

- name: Schedule CAPE storage maintenance (hourly)
  ansible.builtin.cron:
    name: "cape-storage-maintenance"
    user: "{{ cape_user }}"
    minute: "15"
    job: >-
      find {{ cape_install_dir }}/storage/analyses -name 'memory.dmp' -mmin +60 -delete;
      find {{ cape_install_dir }}/storage/analyses -maxdepth 2 -name 'memory' -type d -mmin +60 -exec rm -rf {} +;
      chgrp -R lamware {{ cape_install_dir }}/storage/analyses 2>/dev/null;
      chmod -R g+rX {{ cape_install_dir }}/storage/analyses 2>/dev/null
