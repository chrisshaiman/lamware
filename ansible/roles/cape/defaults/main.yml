---
# roles/cape/defaults/main.yml

# The PRESERVED patched emulator, not the distro path (#327). /usr/bin is owned by
# qemu-system-x86; on 2026-08-06 an apt transaction pulling libguestfs-tools replaced
# the DSDT-patched build there with stock 8.2.2 and every guest stopped starting (#308).
#
# INCOMPLETE ON ITS OWN. libvirt snapshots store the domain config as it was at
# snapshot time, and CAPE reverts to snapshot for every detonation -- so a domain
# redefined against this path still boots the snapshot's emulator until the snapshots
# are recreated. The qemu-patched role reports that mismatch on every run rather than
# letting the repoint look complete.
cape_qemu_binary: /usr/local/bin/qemu-system-x86_64
cape_guest_image_dir: /var/lib/libvirt/images
cape_resultserver_port: 2042

# Seconds a sample is allowed to run before CAPE ends the analysis.
#
# 200 (CAPE's default) is marginal for this corpus: every sample measured begins
# its payload stage at 179-206s, so the window closed on top of the behaviour we
# are trying to observe and capture became a coin flip (#518). Raised so the
# prologue — JIT, unpacking, sleep — finishes well inside the window.
#
# Raising this costs wall-clock on every analysis. Lowering it silently costs
# measurements instead, which is worse and much harder to notice.
cape_analysis_timeout: 400
