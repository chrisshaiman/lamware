---
# roles/cape/defaults/main.yml

# The PRESERVED patched emulator, not the distro path (#327). /usr/bin is owned by
# qemu-system-x86; on 2026-08-06 an apt transaction pulling libguestfs-tools replaced
# the DSDT-patched build there with stock 8.2.2 and every guest stopped starting (#308).
#
# INCOMPLETE ON ITS OWN. libvirt snapshots store the domain config as it was at
# snapshot time, and CAPE reverts to snapshot for every detonation -- so a domain
# redefined against this path still boots the snapshot's emulator until the snapshots
# are recreated. The qemu-patched role reports that mismatch on every run rather than
# letting the repoint look complete.
cape_qemu_binary: /usr/local/bin/qemu-system-x86_64
# The distro path the `office` guest still boots (domain and snapshot, observed
# 2026-10-04). restore-qemu.yml puts cape_qemu_binary back here if apt replaced it.
cape_qemu_distro_path: /usr/bin/qemu-system-x86_64
# Who must own the preserved copy, and owns the restored one. Tests run the tasks
# unprivileged and set it to the test user; on a host it is always root.
cape_qemu_owner: root
cape_qemu_restart_libvirtd: true
cape_guest_image_dir: /var/lib/libvirt/images
cape_resultserver_port: 2042

# Export the guest's Windows event logs with each analysis.
#
# On for diagnosis: detonations that end with no NtTerminateProcess leave no
# evidence of why, and an Application-log crash record answers it (#518 failed
# detonations). Costs a zip of event logs per analysis.
#
# Deliberately NOT accompanied by sysmon_windows or procmon. Those run an agent
# inside the guest that evasive malware looks for; evtx exports logs Windows
# already keeps.
cape_capture_evtx: true

# CAPE's database credentials (tasks/credentials.yml). The default is cape2.sh's
# published one, named here only so the role can recognise it and replace it once.
cape_db_user: cape
cape_db_default_password: SuperPuperSecret
# Root-only copies of anything the credential change overwrites (CLAUDE.md §5).
cape_rollback_dir: /root/lamware-rollback/cape

# How long CAPE keeps a task's analysis directory, its Postgres row and its
# Mongo report (#795). CAPE's own cleaner removes all three together, nightly;
# the pipeline copied what the report needs into /opt/pipeline/reports at run
# time, and the lamware analysis row keeps cape_task_id. Investigate tools that
# read Cape's directory report the expiry rather than "no payloads".
cape_analysis_retention_days: 60

# cape-rooter runs as root. cape2.sh starts it as `poetry run python rooter.py`
# with its working directory, interpreter, venv and imports all under
# /opt/CAPEv2, which cape owns: any write as cape ran as root on the next
# rooter start, and cape may restart it through sudo. The role runs a
# root-owned copy of the rooter's whole import closure (stdlib plus these six
# files) under the system python in isolated mode instead.
cape_rooter_dir: /opt/cape-rooter
# sha256 of each file at the pinned CAPE commit (ebf1b1df), checked against
# GitHub's copy at that commit, not only the host's (2026-10-25). A mismatch
# fails the deploy: either cape changed the file, or CAPE was upgraded and these
# need re-pinning after reading the rooter's diff. None of files/patches touches them.
cape_rooter_files:
  utils/rooter.py: e28b8c26d70b77ba26fcd8a241843f58c80dedc0b1c45bb4df06ff464a1f12d6
  lib/__init__.py: 0bdff8b3756588dcade7d93175a1c851bf18fe5298e16860089b61b9d0519e94
  lib/cuckoo/__init__.py: 0bdff8b3756588dcade7d93175a1c851bf18fe5298e16860089b61b9d0519e94
  lib/cuckoo/common/__init__.py: 0bdff8b3756588dcade7d93175a1c851bf18fe5298e16860089b61b9d0519e94
  lib/cuckoo/common/path_utils.py: 71382988ff808160c0bcc8126a04da10b52048898bfd912657d946c96a7673a7
  lib/cuckoo/common/constants.py: 486cb5324f2aa3d78cbb5968100a50a50bcf16c54b36d1adeed04137200c5ad3
