---
# =============================================================================
# roles/volatility/tasks/main.yml
# Builds the Volatility 3 container image and downloads ISF symbol tables.
#
# Volatility runs inside a rootless Podman container with no network access
# and all capabilities dropped. Memory dumps are mounted read-only.
#
# Depends on: podman role (container runtime must be installed)
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

# -------------------------------------------------------------------------
# Host directories
# -------------------------------------------------------------------------

- name: Create volatility directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"
  loop:
    - "{{ volatility_install_dir }}"
    - "{{ volatility_output_dir }}"
    - "{{ volatility_symbols_dir }}"

# -------------------------------------------------------------------------
# ISF symbol tables — required for Windows memory analysis
# -------------------------------------------------------------------------

- name: Check if Windows symbols are already downloaded
  ansible.builtin.stat:
    path: "{{ volatility_symbols_dir }}/windows"
  register: volatility_symbols_check

- name: Download Windows ISF symbol tables
  ansible.builtin.get_url:
    url: "{{ volatility_isf_url }}"
    dest: "{{ volatility_install_dir }}/windows-symbols.zip"
    owner: pipeline
    group: pipeline
    mode: "0644"
  when: not volatility_symbols_check.stat.exists

- name: Extract Windows ISF symbol tables
  ansible.builtin.unarchive:
    src: "{{ volatility_install_dir }}/windows-symbols.zip"
    dest: "{{ volatility_symbols_dir }}/"
    remote_src: true
    owner: pipeline
    group: pipeline
  when: not volatility_symbols_check.stat.exists

- name: Remove symbol zip after extraction
  ansible.builtin.file:
    path: "{{ volatility_install_dir }}/windows-symbols.zip"
    state: absent

# -------------------------------------------------------------------------
# Container image build
# -------------------------------------------------------------------------

- name: Create container build directory
  ansible.builtin.file:
    path: "{{ volatility_install_dir }}/build"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"

- name: Deploy Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ volatility_install_dir }}/build/Containerfile"
    owner: pipeline
    group: pipeline
    mode: "0644"

- name: Build the volatility image hermetically (ADR-023)
  ansible.builtin.include_role:
    name: build-fetch
    tasks_from: image
  vars:
    hb_name: volatility
    hb_build_dir: "{{ volatility_install_dir }}/build"
    hb_tag: localhost/volatility3:latest
    hb_base_images: ["{{ build_fetch_python_slim }}"]
    hb_deb_sets:
      - name: main
        image: "{{ build_fetch_python_slim }}"
        sources: "{{ build_fetch_trixie_sources }}"
        packages: "{{ volatility_debs }}"
    hb_lock: requirements.lock

- name: Deploy volatility wrapper script
  ansible.builtin.template:
    src: run-volatility-wrapper.sh.j2
    dest: "{{ volatility_install_dir }}/run-volatility"
    owner: pipeline
    group: pipeline
    mode: "0750"

- name: Create convenience symlink
  ansible.builtin.file:
    src: "{{ volatility_install_dir }}/run-volatility"
    dest: /usr/local/bin/run-volatility
    state: link

# -------------------------------------------------------------------------
# Plugin cache — pre-built so containers don't rebuild on every run.
# Mounted read-write into containers at the Volatility plugins path.
# -------------------------------------------------------------------------

- name: Create Volatility cache directory
  ansible.builtin.file:
    path: "{{ volatility_install_dir }}/cache"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0755"

- name: Check if Volatility ISF cache is already built
  ansible.builtin.find:
    paths: "{{ volatility_install_dir }}/cache"
    patterns: "*.cache"
    recurse: true
  register: volatility_cache_check

- name: Pre-build Volatility ISF cache
  ansible.builtin.command:
    cmd: >
      podman run --rm
      --network=none
      --read-only
      --cap-drop=ALL
      --security-opt=no-new-privileges
      --memory=4g
      --cpus=2
      --timeout=300
      --tmpfs /tmp:size=1g
      --tmpfs /root:size=100m
      --tmpfs /home:size=100m
      --tmpfs /var/cache:size=100m
      -v "{{ volatility_install_dir }}/cache:/vol-cache:rw"
      -v "{{ volatility_symbols_dir }}:/symbols:ro"
      localhost/volatility3:latest
      -s /symbols
      --cache-path /vol-cache
      frameworkinfo
  become: true
  become_user: pipeline
  when: volatility_cache_check.matched == 0
  changed_when: true
