---
# roles/frontend/defaults/main.yml

# The site is built by a user that owns nothing else, in its own directory, and
# root copies the output to a root-owned serving tree. No service account owns
# the build or any directory above what nginx serves.
frontend_build_user: lamware-web-build
frontend_build_dir: /var/lib/lamware-web-build
frontend_dist_dir: /var/www/lamware
# The previous layout, removed once nginx serves from frontend_dist_dir.
frontend_retired_dir: /opt/frontend
frontend_nginx_port: 443
frontend_nginx_http_port: 80
frontend_api_upstream: "127.0.0.1:{{ api_port | default(8001) }}"
frontend_server_name: "{{ lamware_domain | default('lamware.example.com') }}"
frontend_ssl_cert: "/etc/letsencrypt/live/{{ lamware_domain | default('lamware.example.com') }}/fullchain.pem"
frontend_ssl_key: "/etc/letsencrypt/live/{{ lamware_domain | default('lamware.example.com') }}/privkey.pem"
