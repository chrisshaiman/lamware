---
# roles/frontend/defaults/main.yml

frontend_install_dir: /opt/frontend
frontend_dist_dir: "{{ frontend_install_dir }}/dist"
frontend_user: "{{ cape_user | default('cape') }}"
frontend_nginx_port: 443
frontend_nginx_http_port: 80
frontend_api_upstream: "127.0.0.1:{{ api_port | default(8001) }}"
frontend_server_name: "{{ lamware_domain | default('lamware.example.com') }}"
frontend_ssl_cert: "/etc/letsencrypt/live/{{ lamware_domain | default('lamware.example.com') }}/fullchain.pem"
frontend_ssl_key: "/etc/letsencrypt/live/{{ lamware_domain | default('lamware.example.com') }}/privkey.pem"
