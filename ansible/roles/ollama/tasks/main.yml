---
# =============================================================================
# roles/ollama/tasks/main.yml
# Deploys Ollama as a root Podman container managed by systemd, serving a local
# LLM for the pipeline's summary stages. The serve container runs on an
# --internal Podman network (no egress) but is published to host loopback so the
# host-networked LiteLLM proxy can reach it. The model is pulled once at
# provision time (with egress) into a persistent volume.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Create ollama dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ ollama_install_dir }}"
    - "{{ ollama_models_dir }}"

- name: Create internal (no-egress) podman network for ollama
  ansible.builtin.command: podman network create --internal {{ ollama_network }}
  register: _ollama_net
  changed_when: "'already exists' not in (_ollama_net.stderr | default(''))"
  failed_when: >
    _ollama_net.rc != 0 and 'already exists' not in (_ollama_net.stderr | default(''))

# One-shot pull WITH egress (default network) into the persistent models volume.
# The image entrypoint is `ollama`, so override it with `sh` to run a small
# script: start the server, wait until it answers, then pull. --rm reaps the
# transient server when the pull returns.
- name: Pull the model into the volume (needs egress; one-shot)
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --entrypoint
      - sh
      - -v
      - "{{ ollama_models_dir }}:/root/.ollama:Z"
      - "{{ ollama_image }}"
      - -lc
      - "ollama serve & for i in $(seq 1 30); do ollama list >/dev/null 2>&1 && break; sleep 1; done; ollama pull {{ ollama_model }}"
    creates: "{{ ollama_models_dir }}/models/manifests"

- name: Install ollama serve unit
  ansible.builtin.template:
    src: ollama.service.j2
    dest: /etc/systemd/system/ollama.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart ollama

- name: Enable + start ollama
  ansible.builtin.systemd:
    name: ollama
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for ollama API
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ollama_port }}/api/version"
    status_code: 200
  register: _ollama_up
  retries: 30
  delay: 2
  until: _ollama_up.status == 200

# Egress-confinement assertion. The ollama image ships no curl/wget/python, so we
# verify the guarantee from the host side instead of probing from inside: (1) the
# network is podman --internal (no gateway/NAT -> containers on it cannot reach
# outside), and (2) the running container is attached to exactly that network.
# Together these mean no egress at serve time; port publishing to loopback is
# inbound-only and does not grant egress.
- name: Assert the ollama network is egress-confined (internal)
  ansible.builtin.command: >-
    podman network inspect {{ ollama_network }}
    --format '{% raw %}{{ .Internal }}{% endraw %}'
  register: _ollama_net_internal
  changed_when: false
  failed_when: (_ollama_net_internal.stdout | trim) != "true"

- name: Assert the ollama container is attached to the internal network only
  ansible.builtin.command: >-
    podman inspect ollama
    --format '{% raw %}{{ range $k, $v := .NetworkSettings.Networks }}{{ $k }} {{ end }}{% endraw %}'
  register: _ollama_container_net
  changed_when: false
  failed_when: (_ollama_container_net.stdout | trim) != ollama_network
