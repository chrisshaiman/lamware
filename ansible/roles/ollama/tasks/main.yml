---
# =============================================================================
# roles/ollama/tasks/main.yml
# TEARDOWN. Ollama is no longer part of lamware; this role removes it.
#
# Ollama served the summary stages until 2026-08-19 (9847731 moved them to the
# llama.cpp server). Its LiteLLM routes went on 2026-09-27 (#643, a live OOM
# route, #407). The container was kept only for #431, which asked why Ollama's
# summaries were 2-4x shorter. Answered 2026-10-25: Ollama ran with its default
# 4,096-token context, so every summary stopped when the window filled (all six
# surviving runs sum input + output to exactly 4096), and today's ~7.5k-token
# prompts were silently cut to 2,050. Nothing on the Ollama side was worth
# keeping, and an idle server holding a 23 GB model is cost and surface with no
# caller.
#
# Idempotent: every task is a no-op once Ollama is gone.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Stop and disable the ollama unit
  ansible.builtin.systemd:
    name: ollama
    state: stopped
    enabled: false
  register: _ollama_stop
  # Absent on a host that never ran it, or after the unit file is removed below.
  failed_when: >-
    _ollama_stop.failed
    and 'Could not find the requested service' not in (_ollama_stop.msg | default(''))

- name: Remove the ollama unit file
  ansible.builtin.file:
    path: /etc/systemd/system/ollama.service
    state: absent

# Unconditional: a reload is cheap, and it keeps the role free of handlers.
- name: Reload systemd after removing the unit
  ansible.builtin.systemd:
    daemon_reload: true
  changed_when: false

- name: Check whether the ollama container image is present
  ansible.builtin.command: podman image exists {{ ollama_retired_image }}
  register: _ollama_image
  changed_when: false
  failed_when: _ollama_image.rc not in [0, 1]

- name: Remove the ollama container image
  ansible.builtin.command: podman rmi {{ ollama_retired_image }}
  when: _ollama_image.rc == 0
  changed_when: true

# The model store: ~23 GB (qwen3.6:35b-a3b-q4_K_M, Ollama's own GGUF conversion).
- name: Remove the ollama install and model directories
  ansible.builtin.file:
    path: "{{ ollama_install_dir }}"
    state: absent

- name: Read listeners after the teardown
  ansible.builtin.command: ss -tlnH
  register: _ollama_listeners
  changed_when: false

- name: Assert nothing listens on ollama's port any more
  ansible.builtin.assert:
    that:
      - (':' ~ (ollama_port | string) ~ ' ') not in _ollama_listeners.stdout
    fail_msg: >-
      something still listens on {{ ollama_port }} after the ollama teardown:
      check `ss -tlnp | grep {{ ollama_port }}` and `podman ps -a`.
    success_msg: "ollama removed; nothing listens on {{ ollama_port }}"
