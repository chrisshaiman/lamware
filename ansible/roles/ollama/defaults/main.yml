# Pinned by DIGEST, not `:latest` (same reason as litellm_image). The amd64
# manifest of the image running since 2026-06-30 (index f1a705f2…), kept for the
# #431 comparison, which needs this exact build anyway.
ollama_image: >-
  docker.io/ollama/ollama@sha256:f12b1421172ed0e74159ddc87094f360a20836d5cac7fd395d302bf09cff109c
ollama_model: "qwen3.6:35b-a3b-q4_K_M"   # official Ollama library tag (verified 2026-07-04)
ollama_port: 11434
ollama_install_dir: /opt/ollama
ollama_models_dir: /opt/ollama/models
ollama_keep_alive: "5m"                   # idle-unload so the ~23GB model isn't resident 24/7
