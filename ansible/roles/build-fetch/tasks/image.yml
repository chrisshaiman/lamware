---
# =============================================================================
# roles/build-fetch/tasks/image.yml — ADR-023, the one hermetic image build
#
# Included by every image role (include_role: build-fetch, tasks_from: image).
# lamware-fetch downloads the inputs; root hands them to pipeline; pipeline
# builds with --network=none; the deploy fails unless the image it will run is
# the one it just built. The Containerfile reads:
#   debs/<set>/*.deb   one directory per entry in hb_deb_sets
#   wheels/*.whl       when hb_lock is set, with requirements.lock beside it
#
# Inputs:
#   hb_name         short name; also the fetch dir under the fetch user's home
#   hb_build_dir    the build context (already holding the Containerfile)
#   hb_tag          image tag the wrappers run
#   hb_base_images  every FROM: [{ref, id}] — ref is the registry manifest digest the
#                   fetch user pulls; id is the image ID (config digest) the build uses
#                   FROM and the hand-off asserts (ADR-023, 2026-10-12 amendment)
#   hb_deb_sets     [{name, image, sources: [one-line apt sources], packages,
#                     signing_keys (optional): [host paths of checksummed repo keys]}]
#   hb_lock         path (on the controller) of a hash-locked requirements file, or ""
#                   (copied in as requirements.lock, with sdists.lock beside it)
#   hb_build_lock   optional hash lock of build tools, installed BEFORE requirements
#                   so source-only packages build with --no-build-isolation
#   hb_sdists       [{name, version, sha256}] packages with no usable wheel
#   hb_python       target Python for wheels (default 3.12)
# =============================================================================

- name: "{{ hb_name }}: lock files use the names the Containerfiles COPY"
  ansible.builtin.assert:
    that:
      - hb_lock | default('') | length == 0 or hb_lock | basename == 'requirements.lock'
      - hb_build_lock | default('') | length == 0 or hb_build_lock | basename == 'build-requirements.lock'
    fail_msg: "hb_lock must be requirements.lock and hb_build_lock build-requirements.lock"
    quiet: true

- name: "{{ hb_name }}: create the fetch dirs"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ build_fetch_user }}"
    group: "{{ build_fetch_user }}"
    mode: "0700"
  loop:
    - "{{ build_fetch_home }}/run"
    - "{{ build_fetch_home }}/{{ hb_name }}"
    - "{{ build_fetch_home }}/{{ hb_name }}/debs"
    - "{{ build_fetch_home }}/{{ hb_name }}/keys"
    - "{{ build_fetch_home }}/{{ hb_name }}/wheels"

- name: "{{ hb_name }}: fetch each base image by digest (lamware-fetch)"
  ansible.builtin.shell:
    cmd: >
      podman --cgroup-manager=cgroupfs --events-backend=file image exists {{ item.ref }}
      || podman --cgroup-manager=cgroupfs --events-backend=file pull {{ item.ref }}
    chdir: "{{ build_fetch_home }}"
  environment:
    XDG_RUNTIME_DIR: "{{ build_fetch_home }}/run"
  become: true
  become_user: "{{ build_fetch_user }}"
  loop: "{{ hb_base_images }}"
  loop_control:
    label: "{{ item.ref }}"
  register: hb_pull
  changed_when: "'Writing manifest' in hb_pull.stderr"

- name: "{{ hb_name }}: read the image ID each pinned digest resolved to (lamware-fetch)"
  ansible.builtin.command:
    cmd: >
      podman --cgroup-manager=cgroupfs --events-backend=file
      image inspect {{ item.ref }} --format {% raw %}'{{ .Id }}'{% endraw %}
    chdir: "{{ build_fetch_home }}"
  environment:
    XDG_RUNTIME_DIR: "{{ build_fetch_home }}/run"
  become: true
  become_user: "{{ build_fetch_user }}"
  loop: "{{ hb_base_images }}"
  loop_control:
    label: "{{ item.ref }}"
  register: hb_fetched_ids
  changed_when: false

- name: "{{ hb_name }}: the registry digest and the image ID must name the same image"
  # The ref is the trust anchor (the registry verified it); the id is derived
  # from it. If they disagree the pins were edited apart, and the build would
  # use a base the registry did not vouch for.
  ansible.builtin.assert:
    that: item.stdout | trim == item.item.id
    fail_msg: "{{ item.item.ref }} is image {{ item.stdout | trim }}, but the pin says {{ item.item.id }}"
    quiet: true
  loop: "{{ hb_fetched_ids.results }}"
  loop_control:
    label: "{{ item.item.ref }}"

- name: "{{ hb_name }}: fetch each Debian package set (lamware-fetch, rootless)"
  ansible.builtin.include_tasks: image_debs.yml
  loop: "{{ hb_deb_sets | default([]) }}"
  loop_control:
    loop_var: hb_set

- name: "{{ hb_name }}: fetch wheels against the lock(s)"
  when: hb_lock | default('') | length > 0
  block:
    - name: "{{ hb_name }}: deploy the hash-locked requirements"
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ build_fetch_home }}/{{ hb_name }}/{{ item | basename }}"
        owner: "{{ build_fetch_user }}"
        group: "{{ build_fetch_user }}"
        mode: "0600"
      loop: "{{ [hb_lock] + ([hb_build_lock] if hb_build_lock | default('') | length > 0 else []) }}"
      register: hb_lock_files
    - name: "{{ hb_name }}: pip download --require-hashes --only-binary (lamware-fetch)"
      # --only-binary: no sdist, so no build backend runs here. --require-hashes:
      # every file is checked against the lock. A package that publishes no
      # usable wheel goes in hb_sdists instead (fetched below, built offline).
      # --no-deps: the lock IS the whole graph; resolving it here demanded a
      # wheel for an sdist-only dependency (flare-floss -> halo) and failed. The
      # offline install still resolves the full set, so a gap fails the build.
      vars:
        hb_locks_key: "{{ hb_lock_files.results | map(attribute='checksum') | join('-') | hash('sha256') }}"
      ansible.builtin.shell:
        cmd: |
          set -eu
          W="{{ build_fetch_home }}/{{ hb_name }}/wheels"
          find "$W" -mindepth 1 -delete
          python3 -m pip download --no-cache-dir --disable-pip-version-check \
            --require-hashes --only-binary=:all: --no-deps \
            --platform manylinux_2_28_x86_64 --platform manylinux_2_17_x86_64 \
            --platform manylinux2014_x86_64 --platform any \
            --python-version {{ hb_python | default('3.12') }} --implementation cp \
            {% for f in hb_lock_files.results %}-r "{{ f.dest }}" {% endfor %}-d "$W"
          touch "{{ build_fetch_home }}/{{ hb_name }}/wheels-{{ hb_locks_key }}.done"
        creates: "{{ build_fetch_home }}/{{ hb_name }}/wheels-{{ hb_locks_key }}.done"
        chdir: "{{ build_fetch_home }}"
      environment:
        HOME: "{{ build_fetch_home }}"
      become: true
      become_user: "{{ build_fetch_user }}"
    - name: "{{ hb_name }}: fetch each source-only package by checksum (lamware-fetch)"
      # A source archive, fetched like any other (get_url + sha256), never
      # prepared here: it is built inside the network-free build.
      ansible.builtin.get_url:
        url: "https://files.pythonhosted.org/packages/source/{{ item.name[0] }}/{{ item.name }}/{{ item.name }}-{{ item.version }}.tar.gz"
        dest: "{{ build_fetch_home }}/{{ hb_name }}/wheels/{{ item.name }}-{{ item.version }}.tar.gz"
        checksum: "sha256:{{ item.sha256 }}"
        mode: "0600"
      loop: "{{ hb_sdists | default([]) }}"
      become: true
      become_user: "{{ build_fetch_user }}"
    - name: "{{ hb_name }}: write the source-only packages as a hash-locked requirements file"
      ansible.builtin.copy:
        # The header keeps the file non-empty: copy treats empty content as absent.
        content: |
          # Source-only packages (hb_sdists), built offline. May list none.
          {% for s in hb_sdists | default([]) %}
          {{ s.name }}=={{ s.version }} --hash=sha256:{{ s.sha256 }}
          {% endfor %}
        dest: "{{ build_fetch_home }}/{{ hb_name }}/sdists.lock"
        owner: "{{ build_fetch_user }}"
        group: "{{ build_fetch_user }}"
        mode: "0600"

# --- Hand the verified inputs to pipeline ------------------------------------
- name: "{{ hb_name }}: clear the previous build inputs"
  ansible.builtin.file:
    path: "{{ hb_build_dir }}/{{ item }}"
    state: absent
  loop: [debs, wheels, requirements.lock, build-requirements.lock, sdists.lock]

- name: "{{ hb_name }}: copy the fetched inputs into the build context"
  ansible.builtin.copy:
    src: "{{ build_fetch_home }}/{{ hb_name }}/{{ item }}"
    dest: "{{ hb_build_dir }}/"
    remote_src: true
    owner: pipeline
    group: pipeline
    mode: u=rwX,g=rX,o=
  loop: "{{ ['debs', 'wheels'] + hb_lock_names }}"
  vars:
    hb_lock_names: >-
      {{ (['requirements.lock', 'sdists.lock'] if hb_lock | default('') | length > 0 else [])
         + ([hb_build_lock | basename] if hb_build_lock | default('') | length > 0 else []) }}

- name: "{{ hb_name }}: remove apt's bookkeeping from the copied packages"
  ansible.builtin.shell:
    cmd: find "{{ hb_build_dir }}/debs" -mindepth 2 \( -name partial -o -name lock \) -prune -exec rm -rf {} +
  changed_when: false

- name: "{{ hb_name }}: hand over each base image pipeline does not have"
  ansible.builtin.include_tasks: image_base.yml
  loop: "{{ hb_base_images }}"
  loop_control:
    loop_var: hb_base

# --- Build with no network, then prove the image is this build ----------------
- name: "{{ hb_name }}: hash the build context"
  ansible.builtin.shell:
    cmd: >
      set -o pipefail;
      find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
      | sha256sum | cut -c1-64
    chdir: "{{ hb_build_dir }}"
    executable: /bin/bash
  register: hb_context_hash
  changed_when: false

- name: "{{ hb_name }}: build with no network"
  ansible.builtin.command:
    cmd: >
      podman build --network=none --pull=never
      --label lamware.build-context={{ hb_context_hash.stdout }}
      -t {{ hb_tag }} -f {{ hb_build_dir }}/Containerfile {{ hb_build_dir }}
    chdir: "{{ hb_build_dir }}"
  become: true
  become_user: pipeline
  changed_when: true

- name: "{{ hb_name }}: read the build-context label of the image the wrapper runs"
  ansible.builtin.command:
    cmd: >
      podman image inspect {{ hb_tag }}
      --format {% raw %}'{{ index .Labels "lamware.build-context" }}'{% endraw %}
    chdir: "{{ hb_build_dir }}"
  become: true
  become_user: pipeline
  register: hb_image_label
  changed_when: false

- name: "{{ hb_name }}: fail when the image is not the one this deploy built"
  # ADR-023 decision 3: a build that "succeeded" while keeping an old image is
  # how pdf-generation stayed at 2026-05-17 for five months.
  ansible.builtin.assert:
    that: hb_image_label.stdout | trim == hb_context_hash.stdout | trim
    fail_msg: >-
      {{ hb_tag }} carries build context '{{ hb_image_label.stdout | trim }}',
      not this deploy's '{{ hb_context_hash.stdout | trim }}'
    quiet: true
