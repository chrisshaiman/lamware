---
# Build one image into the pipeline's protected image store (ADR-025 phase 3).
# The store is reachable by the pipeline user only between `open` and `close`;
# `close` runs whatever happens, re-seals the store, restarts the user's podman
# namespace and proves the user cannot write it (it fails the deploy if it can).
- name: "{{ hb_name }}: open the image store for this build"
  ansible.builtin.command: "{{ image_store_lib_dir | default('/usr/local/lib/lamware') }}/lamware-image-store open"
  changed_when: false

- name: "{{ hb_name }}: build into the image store"
  block:
    - name: "{{ hb_name }}: build"
      ansible.builtin.include_tasks: image_build.yml
  always:
    - name: "{{ hb_name }}: seal the image store and verify it"
      ansible.builtin.command: "{{ image_store_lib_dir | default('/usr/local/lib/lamware') }}/lamware-image-store close"
      changed_when: false
