---
# roles/build-fetch/defaults/main.yml — ADR-023
#
# The only account that downloads image build inputs. It has network and nothing
# else: no root, no lamware group, no access to samples or reports.

build_fetch_user: lamware-fetch
build_fetch_home: /var/lib/lamware-fetch
# Its own subordinate id range for the rootless container that resolves Debian
# packages. Must not overlap any other user's range: overlapping ranges map two
# users' container ids onto the same host ids.
build_fetch_subid_start: 331072
build_fetch_subid_count: 65536

# --- Base images and snapshots shared by several image roles (ADR-023) ---------
# python:3.12-slim, the base of most analysis images since 2026-05-08. Moving it
# is a deliberate change to this line, and rebuilds every image that uses it.
build_fetch_python_slim: "docker.io/library/python@sha256:401f6e1a67dad31a1bd78e9ad22d0ee0a3b52154e6bd30e90be696bb6a3d7461"
# The Debian archive state packages for images built FROM it are resolved
# against. NOT the base image's own snapshot (20260505T000000Z): the images these
# builds replace installed from the live mirror months later, and resolving
# against May would rebuild them with older security fixes than they run. Move
# it forward deliberately; every image that uses it refetches and rebuilds.
build_fetch_trixie_snapshot: "20261010T000000Z"
build_fetch_debian_snapshot_url: "http://snapshot.debian.org/archive"
build_fetch_debian_keyring: "signed-by=/usr/share/keyrings/debian-archive-keyring.pgp"
build_fetch_trixie_sources:
  - "deb [{{ build_fetch_debian_keyring }}] {{ build_fetch_debian_snapshot_url }}/debian/{{ build_fetch_trixie_snapshot }} trixie main"
  - "deb [{{ build_fetch_debian_keyring }}] {{ build_fetch_debian_snapshot_url }}/debian/{{ build_fetch_trixie_snapshot }} trixie-updates main"
  - "deb [{{ build_fetch_debian_keyring }}] {{ build_fetch_debian_snapshot_url }}/debian-security/{{ build_fetch_trixie_snapshot }} trixie-security main"
