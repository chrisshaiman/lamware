---
# =============================================================================
# roles/java-analysis/tasks/main.yml
# Builds the CFR Java decompilation container.
#
# CFR (MIT licensed) decompiles Java bytecode from JAR/class files
# to readable Java source code.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Create java-analysis directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: lamware
    mode: "0750"
  loop:
    - "{{ java_analysis_install_dir }}"
    - "{{ java_analysis_install_dir }}/build"

- name: Create the data directories (pipeline's; ADR-025)
  # Runtime output only. Everything else under the install directory is
  # root-owned code the pipeline reads and runs but cannot change.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"
  loop:
    - "{{ java_analysis_install_dir }}/output"

- name: Root-own what is already in the build context (ADR-025)
  # Earlier deploys left these pipeline-owned, and a file this role no longer
  # ships would keep its old owner. follow: false: never chown a link's target.
  ansible.builtin.file:
    path: "{{ java_analysis_install_dir }}/build"
    state: directory
    owner: root
    group: lamware
    # g+rX: the pipeline (group lamware) must read the context it builds;
    # go-w: and must not write it. Symbolic, so existing 0644/0755 files keep
    # their modes and a deploy does not change the context for nothing.
    mode: "u+rwX,g+rX,go-w"
    recurse: true
    follow: false

# `checksum` verifies WHAT ARRIVED. A pinned version pins what we ASK for; only
# the hash catches a replaced asset, and a release tag's assets can be re-uploaded.
# CFR was version-pinned but unverified until 2026-08-08.
- name: Download CFR decompiler
  ansible.builtin.get_url:
    url: "{{ cfr_url }}"
    dest: "{{ java_analysis_install_dir }}/build/cfr.jar"
    checksum: "sha256:{{ cfr_sha256 }}"
    owner: root
    group: lamware
    mode: "0644"

- name: Download java-deobfuscator
  ansible.builtin.get_url:
    url: "{{ java_deobfuscator_url }}"
    dest: "{{ java_analysis_install_dir }}/build/java-deobfuscator.jar"
    checksum: "sha256:{{ java_deobfuscator_sha256 }}"
    owner: root
    group: lamware
    mode: "0644"

- name: Deploy Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ java_analysis_install_dir }}/build/Containerfile"
    owner: root
    group: lamware
    mode: "0644"

- name: Deploy analyze-java.py
  ansible.builtin.template:
    src: analyze-java.py.j2
    dest: "{{ java_analysis_install_dir }}/build/analyze-java.py"
    owner: root
    group: lamware
    mode: "0755"

- name: Build the java-analysis image hermetically (ADR-023)
  ansible.builtin.include_role:
    name: build-fetch
    tasks_from: image
  vars:
    hb_name: java-analysis
    hb_build_dir: "{{ java_analysis_install_dir }}/build"
    hb_tag: localhost/java-analysis:latest
    hb_base_images:
      - ref: "{{ java_analysis_base_image }}"
        id: "{{ java_analysis_base_image_id }}"
    hb_deb_sets:
      - name: main
        image: "{{ java_analysis_base_image }}"
        sources: "{{ java_analysis_apt_sources }}"
        packages: "{{ java_analysis_debs }}"

- name: Deploy java-analysis wrapper script
  ansible.builtin.template:
    src: run-java-analysis-wrapper.sh.j2
    dest: "{{ java_analysis_install_dir }}/run-java-analysis"
    owner: root
    group: lamware
    mode: "0750"

- name: Create convenience symlink
  ansible.builtin.file:
    src: "{{ java_analysis_install_dir }}/run-java-analysis"
    dest: /usr/local/bin/run-java-analysis
    state: link
