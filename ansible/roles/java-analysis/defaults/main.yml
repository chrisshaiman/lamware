---
# roles/java-analysis/defaults/main.yml

java_analysis_install_dir: /opt/java-analysis
java_analysis_container_memory: "1g"
java_analysis_container_cpus: "1"
java_analysis_container_timeout: "360"   # deobfuscation (120s) + decompilation (180s) + buffer

# CFR decompiler release — MIT licensed
cfr_version: "0.152"
cfr_url: "https://github.com/leibnitz27/cfr/releases/download/{{ cfr_version }}/cfr-{{ cfr_version }}.jar"

# sha256 of cfr-0.152.jar, recorded 2026-08-08. Pinning the version says which file
# to ask for; this says which bytes are acceptable.
cfr_sha256: "f686e8f3ded377d7bc87d216a90e9e9512df4156e75b06c655a16648ae8765b2"

# java-deobfuscator. NB `latest` here is a LITERAL git tag (published 2023-04-26),
# not GitHub's /releases/latest redirect — the newest semver release is 1.5.2 from
# 2020. So the URL is stable, but a maintainer can still replace the asset on a tag,
# which is what the checksum is for. Changing this URL changes which deobfuscator
# runs, so it is a deliberate edit, not a silent upgrade.
java_deobfuscator_url: "https://github.com/java-deobfuscator/deobfuscator/releases/download/latest/deobfuscator.jar"
java_deobfuscator_sha256: "c1835bd9c9aad4cc453f8675110fc057f11cd3ca5e8f29b68c67baf086277eea"

# --- ADR-023: hermetic build inputs ------------------------------------------
# The base image, by digest: eclipse-temurin:21-jre-jammy as it sat in pipeline's
# store on 2026-10-11 (built 2026-05-15T21:16:12Z), the image this role has run
# on. Moving it is a deliberate change to this line, not a tag moving upstream.
java_analysis_base_image: "docker.io/library/eclipse-temurin@sha256:199aebeb3adcde4910695cdebfe782ada38dadb6cc8013159b58d3724451befd"
# Its image ID (config digest): what the build uses FROM and what the hand-off
# asserts. The registry digest above cannot survive save/load (ADR-023,
# 2026-10-12 amendment); this can. Read from the image pulled by that digest.
java_analysis_base_image_id: "f19d00d34e5586b1d9ee6c70928504d2771d0c6a53ad3c3917ceb8528d4dc75e"
# The Ubuntu archive at 2026-10-10. Not the base image's build date: the running
# image installed from the live mirror later, and an older snapshot would rebuild it
# with older security fixes. apt still verifies the signed Release files.
# https: snapshot.ubuntu.com redirects http.
java_analysis_ubuntu_snapshot: "20261010T000000Z"
java_analysis_snapshot_url: "https://snapshot.ubuntu.com/ubuntu/{{ java_analysis_ubuntu_snapshot }}"
java_analysis_keyring: "signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg"
java_analysis_apt_components: "main restricted universe multiverse"
java_analysis_apt_sources:
  - "deb [{{ java_analysis_keyring }}] {{ java_analysis_snapshot_url }} jammy {{ java_analysis_apt_components }}"
  - "deb [{{ java_analysis_keyring }}] {{ java_analysis_snapshot_url }} jammy-updates {{ java_analysis_apt_components }}"
  - "deb [{{ java_analysis_keyring }}] {{ java_analysis_snapshot_url }} jammy-backports {{ java_analysis_apt_components }}"
  - "deb [{{ java_analysis_keyring }}] {{ java_analysis_snapshot_url }} jammy-security {{ java_analysis_apt_components }}"
# What the image adds to the base: python3 runs analyze-java.py, the entrypoint.
java_analysis_debs:
  - python3
