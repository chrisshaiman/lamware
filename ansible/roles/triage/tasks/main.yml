---
# =============================================================================
# roles/triage/tasks/main.yml
# Builds the triage container image and deploys YARA community rules.
#
# The triage tool runs inside a rootless Podman container with no network
# access and all capabilities dropped — malware parser exploits cannot
# compromise the host.
#
# Depends on: podman role (container runtime must be installed)
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

# -------------------------------------------------------------------------
# Host directories
# -------------------------------------------------------------------------

- name: Create triage directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"
  loop:
    - "{{ triage_install_dir }}"
    - "{{ triage_output_dir }}"
    - "{{ triage_rules_dir }}"
    - "{{ triage_rules_dir }}/custom"

# -------------------------------------------------------------------------
# YARA community rules
# -------------------------------------------------------------------------

- name: Create a directory for the YARA rule archives
  # Root-owned and outside anything pipeline can write, so the archive root
  # downloads cannot be swapped between the checksum and the unpack.
  ansible.builtin.tempfile:
    state: directory
    prefix: lamware-yara-
  register: triage_yara_tmp

- name: Make the archive directory traversable by pipeline
  ansible.builtin.file:
    path: "{{ triage_yara_tmp.path }}"
    mode: "0755"

- name: Download pinned YARA rule archives
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ triage_yara_tmp.path }}/{{ item.name }}.tar.gz"
    checksum: "sha256:{{ item.sha256 }}"
    mode: "0644"
  loop: "{{ triage_yara_repos }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create YARA rule directories
  ansible.builtin.file:
    path: "{{ triage_rules_dir }}/{{ item.dest }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"
  loop: "{{ triage_yara_repos }}"
  loop_control:
    label: "{{ item.name }}"

- name: Unpack YARA rules
  # As pipeline, not root: the rules dir is pipeline's, and root writing into a
  # tree another user owns follows whatever symlinks that user left there.
  # The marker names the archive's checksum, so a moved pin unpacks again and an
  # unchanged one is a no-op.
  ansible.builtin.unarchive:
    src: "{{ triage_yara_tmp.path }}/{{ item.name }}.tar.gz"
    dest: "{{ triage_rules_dir }}/{{ item.dest }}"
    remote_src: true
    extra_opts: [--strip-components=1]
    creates: "{{ triage_rules_dir }}/{{ item.dest }}/.lamware-archive-{{ item.sha256[:16] }}"
  become: true
  become_user: pipeline
  loop: "{{ triage_yara_repos }}"
  loop_control:
    label: "{{ item.name }}"

- name: Record which archive each rules directory holds
  # Unconditional and idempotent: reached only if every unpack succeeded, and a
  # touch that preserves times reports no change on an existing marker.
  ansible.builtin.file:
    path: "{{ triage_rules_dir }}/{{ item.dest }}/.lamware-archive-{{ item.sha256[:16] }}"
    state: touch
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  become: true
  become_user: pipeline
  loop: "{{ triage_yara_repos }}"
  loop_control:
    label: "{{ item.name }}"

- name: Remove the YARA rule archives
  ansible.builtin.file:
    path: "{{ triage_yara_tmp.path }}"
    state: absent

# -------------------------------------------------------------------------
# Container image build
# -------------------------------------------------------------------------

- name: Create container build directory
  ansible.builtin.file:
    path: "{{ triage_install_dir }}/build"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"

- name: Deploy Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ triage_install_dir }}/build/Containerfile"
    owner: pipeline
    group: pipeline
    mode: "0644"

- name: Deploy pip requirements
  ansible.builtin.copy:
    src: requirements.txt
    dest: "{{ triage_install_dir }}/build/requirements.txt"
    owner: pipeline
    group: pipeline
    mode: "0644"

- name: Deploy run-triage.py into build context
  ansible.builtin.template:
    src: run-triage.py.j2
    dest: "{{ triage_install_dir }}/build/run-triage.py"
    owner: pipeline
    group: pipeline
    mode: "0755"

- name: Build triage container image
  ansible.builtin.command:
    cmd: >
      podman build
      --network=host
      -t localhost/triage:latest
      -f {{ triage_install_dir }}/build/Containerfile
      {{ triage_install_dir }}/build
  become: true
  become_user: pipeline
  changed_when: true

# -------------------------------------------------------------------------
# Host-side wrapper script
# -------------------------------------------------------------------------

- name: Deploy triage wrapper script
  ansible.builtin.template:
    src: run-triage-wrapper.sh.j2
    dest: "{{ triage_install_dir }}/run-triage"
    owner: pipeline
    group: pipeline
    mode: "0750"

- name: Create convenience symlink
  ansible.builtin.file:
    src: "{{ triage_install_dir }}/run-triage"
    dest: /usr/local/bin/run-triage
    state: link

# -------------------------------------------------------------------------
# Verify the container works
# -------------------------------------------------------------------------

- name: Smoke test triage container
  ansible.builtin.shell: |
    echo 'test' > /tmp/triage-test-sample.txt
    {{ triage_install_dir }}/run-triage /tmp/triage-test-sample.txt /tmp/triage-test-output 2>&1
    rm -f /tmp/triage-test-sample.txt
    rm -rf /tmp/triage-test-output
  args:
    executable: /bin/bash
  become: true
  become_user: pipeline
  changed_when: false
  register: triage_smoke_test
  failed_when: "'triage' not in triage_smoke_test.stdout"
