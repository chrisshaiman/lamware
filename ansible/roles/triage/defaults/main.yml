---
# roles/triage/defaults/main.yml

# Triage install directory on the host
triage_install_dir: /opt/triage
triage_output_dir: /opt/triage/output
triage_rules_dir: /opt/triage/rules

# Container resource limits
triage_container_memory: "4g"
triage_container_cpus: "2"
triage_container_timeout: "300"

# YARA community rules, as source archives pinned to a commit and checksummed.
# Fetched by the role as root and unpacked by `pipeline`, because `pipeline` has
# no DNS or egress and the host has no git: the `git` clone this replaces had
# failed on every triage deploy since the egress allowlist (rules last fetched
# 2026-05-17). These are the commits the host was running then, so the rule set
# is unchanged; moving a pin is a deliberate change with its own checksum.
# yara-forensics is a git submodule of yara-rules, which GitHub archives omit;
# run-triage rglobs every *.yar under /rules, so its rules were live and stay so.
# `dest` is relative to triage_rules_dir; a submodule follows its parent.
triage_yara_repos:
  - name: yara-rules
    url: https://github.com/Yara-Rules/rules/archive/0f93570194a80d2f2032869055808b0ddcdfb360.tar.gz
    sha256: dd9836eb3df65a2fcdb281f74b59e76f2402e99bf3ab6cb81dbaad2eccad484b
    dest: yara-rules
  - name: yara-forensics
    url: https://github.com/Xumeiquer/yara-forensics/archive/a3d03742e054b71298f800793a1faada30bf2601.tar.gz
    sha256: d08f48feeb801dd97e51d304c7e9c6cd1155903d68c01ce1d2f75382b0270db6
    dest: yara-rules/utils/yara-forensics
  - name: reversinglabs
    url: https://github.com/reversinglabs/reversinglabs-yara-rules/archive/e0a0be54aa1e11ccfd6854e4f19e9476f328fd84.tar.gz
    sha256: 0fd2319ed56875772fe843e542520ca4c84e91c72857ed1ac3274a8685ebb4a3
    dest: reversinglabs

# The deploy's smoke test fails below this many compiled rule files. Measured
# 2026-10-08 with the pinned rule sets: 904 files, 846 compile; the 58 that do
# not use modules this YARA build lacks (androguard, cuckoo).
triage_yara_min_compiled: 800

# ADR-023: installed from fetched, snapshot-pinned packages (build-fetch).
triage_debs_runtime:
  - libmagic1
  - file
# Only to compile binary2strings; purged from the image after.
triage_debs_build:
  - build-essential
# Packages that publish no usable cp312 wheel: fetched as source by checksum and
# built inside the network-free build. sha256 from PyPI, verified on download.
triage_sdists:
  - name: binary2strings
    version: "0.1.13"
    sha256: c6395fc97c4d908b36e08f5a558a79d371a843a8b308e21a0e2b489591877620
  - name: halo
    version: "0.0.31"
    sha256: 7b67a3521ee91d53b7152d4ee3452811e1d2a6321975137762eb3d70063cc9d6
