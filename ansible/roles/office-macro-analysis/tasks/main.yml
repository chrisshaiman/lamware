---
# roles/office-macro-analysis/tasks/main.yml

- name: Create office-macro-analysis directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"
  loop:
    - "{{ office_macro_analysis_install_dir }}"
    - "{{ office_macro_analysis_install_dir }}/build"

- name: Deploy Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ office_macro_analysis_install_dir }}/build/Containerfile"
    owner: pipeline
    group: pipeline
    mode: "0644"

- name: Deploy analysis script
  ansible.builtin.template:
    src: analyze-office.py.j2
    dest: "{{ office_macro_analysis_install_dir }}/build/analyze-office.py"
    owner: pipeline
    group: pipeline
    mode: "0644"

- name: Build the office-macro-analysis image hermetically (ADR-023)
  ansible.builtin.include_role:
    name: build-fetch
    tasks_from: image
  vars:
    hb_name: office-macro-analysis
    hb_build_dir: "{{ office_macro_analysis_install_dir }}/build"
    hb_tag: localhost/office-macro-analysis:latest
    hb_base_images: ["{{ build_fetch_python_slim }}"]
    hb_lock: requirements.lock

- name: Deploy wrapper script
  ansible.builtin.template:
    src: run-office-analysis-wrapper.sh.j2
    dest: "{{ office_macro_analysis_install_dir }}/run-office-analysis"
    owner: pipeline
    group: pipeline
    mode: "0750"

- name: Symlink wrapper to PATH
  ansible.builtin.file:
    src: "{{ office_macro_analysis_install_dir }}/run-office-analysis"
    dest: /usr/local/bin/run-office-analysis
    state: link
