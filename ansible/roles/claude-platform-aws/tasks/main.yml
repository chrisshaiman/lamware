---
# =============================================================================
# roles/claude-platform-aws/tasks/main.yml
# TEARDOWN. The old loopback forwarder is no longer part of lamware; this role
# removes it (ADR-034).
#
# Its eval arms moved to the anthropic-wif eval route (#865), which authenticates
# with Workload Identity Federation from a key generated on this host (ADR-033).
# Nothing points at port 4010 any more, and a second credential path to the same
# workspace is surface with no caller.
#
# Removes the units, the code, the config with its host key and certificate, and
# the service user. The CA that issued the certificate lives on the controller,
# not here, and is the owner's to delete.
#
# Idempotent: every task is a no-op once the forwarder is gone.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Stop and disable the forwarder and its daily check
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - claude-platform-aws.service
    - claude-platform-aws-check.timer
  register: _cpa_stop
  # Absent on a host that never ran it, or after the unit files are removed below.
  failed_when: >-
    _cpa_stop.failed
    and 'Could not find the requested service' not in (_cpa_stop.msg | default(''))

# The last daily check failed (certificate near expiry): clear that state so the
# unit does not linger in `systemctl --failed` after its file is gone.
- name: Clear the failed state of the old units
  ansible.builtin.command: systemctl reset-failed {{ claude_platform_aws_retired_units | join(' ') }}
  register: _cpa_reset
  changed_when: false
  failed_when: false

- name: Remove the unit files
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop: "{{ claude_platform_aws_retired_units }}"

# Unconditional: a reload is cheap, and it keeps the role free of handlers.
- name: Reload systemd after removing the units
  ansible.builtin.systemd:
    daemon_reload: true
  changed_when: false

- name: Remove the code and the config (host key and certificate included)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ claude_platform_aws_retired_dirs }}"

- name: Remove the service user
  ansible.builtin.user:
    name: "{{ claude_platform_aws_retired_user }}"
    state: absent

- name: Remove the service group
  ansible.builtin.group:
    name: "{{ claude_platform_aws_retired_user }}"
    state: absent

- name: Read listeners after the teardown
  ansible.builtin.command: ss -tlnH
  register: _cpa_listeners
  changed_when: false

- name: Assert nothing listens on the old forwarder's port
  ansible.builtin.assert:
    that:
      - (':' ~ (claude_platform_aws_retired_port | string) ~ ' ') not in _cpa_listeners.stdout
    fail_msg: >-
      something still listens on {{ claude_platform_aws_retired_port }} after the
      teardown: check `ss -tlnp | grep {{ claude_platform_aws_retired_port }}`.
    success_msg: >-
      old forwarder removed; nothing listens on {{ claude_platform_aws_retired_port }}
