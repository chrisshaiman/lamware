---
# =============================================================================
# roles/litellm/tasks/main.yml
# Deploys LiteLLM proxy as a root Podman container managed by systemd.
# Routes all Claude API calls through a local proxy for key isolation,
# cost tracking, and future network lockdown.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Create LiteLLM config directory
  ansible.builtin.file:
    path: "{{ litellm_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deploy LiteLLM config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ litellm_install_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0600"
  notify: Restart LiteLLM

- name: Deploy LiteLLM environment file (contains API key)
  ansible.builtin.template:
    src: litellm.env.j2
    dest: "{{ litellm_install_dir }}/litellm.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart LiteLLM

- name: Pull LiteLLM container image
  ansible.builtin.command:
    cmd: "podman pull {{ litellm_image }}"
  register: litellm_pull
  changed_when: "'Pulling' in litellm_pull.stdout or 'Writing' in litellm_pull.stderr"

- name: Deploy LiteLLM systemd service
  ansible.builtin.template:
    src: litellm.service.j2
    dest: /etc/systemd/system/litellm.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart LiteLLM

- name: Enable and start LiteLLM
  ansible.builtin.systemd:
    name: litellm
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for LiteLLM to be ready
  ansible.builtin.uri:
    url: "http://{{ litellm_listen_address }}:{{ litellm_port }}/health"
    method: GET
    headers:
      Authorization: "Bearer {{ litellm_master_key }}"
    status_code: 200
  register: litellm_health
  retries: 10
  delay: 5
  until: litellm_health.status == 200

- name: Install socat (for the LiteLLM Unix-socket bridge)
  ansible.builtin.apt:
    name: socat
    state: present

- name: Ensure the pipeline group exists (the socket dir is group-owned by it)
  # litellm runs BEFORE the pipeline role in site.yml, but the socket RuntimeDirectory must
  # be pipeline-group-owned so the rootless interpret launcher (pipeline) can bind-mount the
  # socket. The pipeline role remains the source of truth for the pipeline user + group
  # membership; this only guarantees the group node exists when the bridge starts.
  ansible.builtin.group:
    name: pipeline
    system: true

- name: Deploy LiteLLM socket-bridge systemd service
  ansible.builtin.template:
    src: litellm-socket.service.j2
    dest: /etc/systemd/system/litellm-socket.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart LiteLLM socket bridge

- name: Enable and start the LiteLLM socket bridge
  ansible.builtin.systemd:
    name: litellm-socket
    state: started
    enabled: true
    daemon_reload: true

- name: Flush handlers (apply litellm + socket-bridge restarts now)
  # A later role (interpret) probes the socket; flush here so the probe validates the
  # CURRENT socket config rather than a restart still queued until end-of-play.
  ansible.builtin.meta: flush_handlers

- name: Stat the LiteLLM socket directory
  ansible.builtin.stat:
    path: /run/litellm
  register: litellm_sock_dir

- name: Assert the socket directory is locked down (0750 root:pipeline)
  # Directory mode is the one socket-bridge control whose enforcement is NOT visible in
  # behavior — a future Ansible refactor could silently widen it and nothing else would
  # surface the drift. Fail the deploy if it does.
  ansible.builtin.assert:
    that:
      - litellm_sock_dir.stat.exists
      - litellm_sock_dir.stat.pw_name == 'root'
      - litellm_sock_dir.stat.gr_name == 'pipeline'
      - litellm_sock_dir.stat.mode == '0750'
    fail_msg: >-
      /run/litellm must be 0750 root:pipeline (got
      {{ litellm_sock_dir.stat.mode | default('absent') }}
      {{ litellm_sock_dir.stat.pw_name | default('') }}:{{ litellm_sock_dir.stat.gr_name | default('') }})
    success_msg: "/run/litellm is 0750 root:pipeline"
