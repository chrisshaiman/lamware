---
# =============================================================================
# LiteLLM proxy defaults
# =============================================================================

litellm_enabled: true
litellm_install_dir: /opt/litellm
litellm_port: 4000
litellm_listen_address: "127.0.0.1"
# Pinned by DIGEST, not by tag. `main-latest` moved on every upstream build and
# the role re-pulls on every deploy, so a deploy installed whatever was newest
# that day into the one container that holds the Anthropic API keys and has
# outbound access. On 2026-10-21 a malicious LiteLLM 1.107.0 was published to
# PyPI and Docker (credential stealer, dormant C2); by then `main-latest` already
# pointed at a newer image than this host ran. This is the amd64 manifest of the
# image the host has run since 2026-10-11 (multi-arch index de5b050c…). Bump it
# deliberately: new digest, release notes read, deployed from a PR.
litellm_image: >-
  ghcr.io/berriai/litellm@sha256:94668d7de26c93a29a8ab01a464228badcd314b98a3f262ad6f8a2a14bd7a0a5
litellm_db_user: "litellm"
litellm_db_name: "litellm"

# NOTE: litellm_master_key is deliberately NOT defaulted here. It authenticates
# every component to the LLM router, and a role default satisfies `| mandatory`,
# so defining it made the three `| mandatory` guards at the call sites unfirable
# and shipped a shared credential published in a public repo (#238). It comes
# from vars/secrets.yml (vault) only — see vars/secrets.yml.example.

# A failing local summary model fails, loudly; it does not quietly become a cloud one
# (ADR-038: no provider the operator did not choose). This switch is the explicit way
# to choose otherwise: when true, a local-qwen-llamacpp failure retries on
# litellm_fallback_backend (production credentials), and the deploy announces it.
# The agentic RE alias (-re) never falls back, switch or not. To use a cloud model for
# summaries on purpose, name it in a profile's summary_model / plain_english_model
# (docs/LLM_PROFILES.md); that is chosen and recorded per run.
litellm_local_cloud_fallback: false
litellm_fallback_backend: "claude-haiku-4-5"

# llama.cpp (agentic RE) routing.
#
# TWO bases, because the RE aliases moved to the anthropic provider in #285 while
# the OpenAI-shaped base is still referenced elsewhere:
#   _api_base          OpenAI shape   — needs the /v1 suffix
#   _anthropic_base    Anthropic      — must NOT have it; LiteLLM appends
#                                       /v1/messages itself for anthropic providers
# Pointing the anthropic entry at a .../v1 base yields /v1/v1/messages and a 404.
litellm_llamacpp_api_base: "http://127.0.0.1:11435/v1"
litellm_llamacpp_anthropic_base: "http://127.0.0.1:11435"
# The llm-stub (ADR-036): Anthropic Messages wire, no /v1 suffix. Port must equal
# llm_stub_port (tests/test_llm_profile_routing.py).
litellm_stub_base: "http://127.0.0.1:11436"

# Aliases to expose per seed. NB the aliases are NOT actually seeded — see the
# block in templates/config.yaml.j2 and #292. The list is retained so that arms
# naming a seed keep resolving; the values themselves no longer reach the sampler.
litellm_llamacpp_seeds: [42, 1337, 8675309]

# Workload Identity Federation (ADR-033). Routes listed here ("production": the
# analyst models and haiku-fallback; "eval": the eval-* arms) go through the
# anthropic-wif forwarder's route for their workspace, and their key is left out of
# the env file. Empty (the rollback): the workspace keys from the vault, as before.
# Each route listed must be active in the anthropic-wif role. Ports must equal its
# routes (tests/test_anthropic_wif_role.py).
litellm_anthropic_wif_routes: []
litellm_anthropic_wif_production_base: "http://127.0.0.1:4011"
litellm_anthropic_wif_eval_base: "http://127.0.0.1:4012"

# Model id behind the eval-mythos alias. Listed by the eval workspace's
# GET /v1/models (2026-11-19, through the anthropic-wif eval route). It must also be
# in that route's allowed_models (anthropic-wif defaults), or the forwarder refuses it.
litellm_eval_mythos_model: "claude-mythos-5-1"
# The 5.2 pair (released 2026-11-09), both through the forwarder on the CVP route.
# eval-mythos stays on 5.1 so the two versions can be compared.
litellm_eval_mythos52_model: "claude-mythos-5-2"
litellm_eval_fable52_model: "claude-fable-5-2"

# Scoped keys (V1): one per caller, so the master key stays in LiteLLM's own files.
# The master key administers LiteLLM: it creates keys, reads all spend, and could
# re-route models. These keys can call only their models (none for api-spend) and no
# admin endpoint, except that api-spend may read spend as a read-only admin viewer.
# An empty models list means every model (interpret runs production and eval arms).
# The role creates or updates them through LiteLLM's API (lamware-litellm-keys) and
# keeps them in litellm_keys_file, root 0600. Other roles read them with
# `import_role: name=litellm tasks_from=read-keys` (import, so the tasks carry the importing role's tags).
litellm_keys_file: /etc/lamware-litellm/keys.json
# Only used when the api role's api_investigate_models is not in the play; the same
# three it ships.
litellm_investigate_models_fallback:
  - {name: claude-sonnet-4-6}
  - {name: claude-opus-4-6}
  - {name: claude-haiku-4-5}

litellm_scoped_keys:
  - name: interpret
    models: []
  - name: digest
    models: ["{{ interpret_summary_model | default('local-qwen-llamacpp') }}"]
  # The API's investigation agent: exactly the operator's api_investigate_models (the api
  # role), which is also the API's allow-list (ADR-038). The default is the same three.
  - name: investigate
    models: "{{ api_investigate_models | default(litellm_investigate_models_fallback) | map(attribute='name') | list }}"
  - name: api-spend
    role: proxy_admin_viewer
    models: ["no-models"]
  # The orchestrator reads LiteLLM's spend log for a run's cost (ADR-037). Read-only
  # viewer, no models, its own key per ADR-030.
  - name: pipeline-spend
    role: proxy_admin_viewer
    models: ["no-models"]

# Your own LiteLLM model entries (ADR-038 decision 2): any provider LiteLLM supports
# (Bedrock, Foundry, Vertex, Ollama, vLLM, ...). Each is a LiteLLM model_list entry
# plus `local`, which declares where it runs. docs/LLM_PROFILES.md has examples.
#
#   - model_name: eval-bedrock-sonnet      # cloud aliases a profile may use: eval-*
#     local: false
#     litellm_params:
#       model: bedrock/anthropic.claude-sonnet-...
#       aws_region_name: us-east-1
#       aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID          # never a literal
#       aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
#
# The deploy refuses (tasks/operator-models.yml):
#   - a model_name another entry already uses (no shadowing a built-in alias);
#   - `local: true` whose api_base is not on this host (127.0.0.1, localhost, ::1);
#   - `local: false` named like a built-in local alias, or `local: true` named eval-*;
#   - a credential-looking parameter that is not an os.environ/ reference.
# Local entries are what the pipeline may use in a profile with cloud: false.
litellm_operator_models: []

# Environment variables for those entries' os.environ/ references, written to
# LiteLLM's env file (0600). Put the values in the vault, not here:
#   litellm_operator_env:
#     AWS_ACCESS_KEY_ID: "{{ vault_aws_access_key_id }}"
litellm_operator_env: {}
