---
# =============================================================================
# LiteLLM proxy defaults
# =============================================================================

litellm_enabled: true
litellm_install_dir: /opt/litellm
litellm_port: 4000
litellm_listen_address: "127.0.0.1"
litellm_image: "ghcr.io/berriai/litellm:main-latest"
litellm_db_user: "litellm"
litellm_db_name: "litellm"

# NOTE: litellm_master_key is deliberately NOT defaulted here. It authenticates
# every component to the LLM router, and a role default satisfies `| mandatory`,
# so defining it made the three `| mandatory` guards at the call sites unfirable
# and shipped a shared credential published in a public repo (#238). It comes
# from vars/secrets.yml (vault) only — see vars/secrets.yml.example.

# Local LLM (Ollama) routing for the summary stages.
litellm_fallback_backend: "claude-haiku-4-5"

# llama.cpp (agentic RE) routing.
#
# TWO bases, because the RE aliases moved to the anthropic provider in #285 while
# the OpenAI-shaped base is still referenced elsewhere:
#   _api_base          OpenAI shape   — needs the /v1 suffix
#   _anthropic_base    Anthropic      — must NOT have it; LiteLLM appends
#                                       /v1/messages itself for anthropic providers
# Pointing the anthropic entry at a .../v1 base yields /v1/v1/messages and a 404.
litellm_llamacpp_api_base: "http://127.0.0.1:11435/v1"
litellm_llamacpp_anthropic_base: "http://127.0.0.1:11435"

# Aliases to expose per seed. NB the aliases are NOT actually seeded — see the
# block in templates/config.yaml.j2 and #292. The list is retained so that arms
# naming a seed keep resolving; the values themselves no longer reach the sampler.
litellm_llamacpp_seeds: [42, 1337, 8675309]

# The anthropic-wif forwarder (ADR-022). Under the CVP grant, any model_list
# entry for a grant model (claude-mythos-5-1, the eval-mythos alias) sets
#   api_base: "{{ litellm_anthropic_wif_base }}"
#   api_key: "sk-anthropic-wif-placeholder"
# and never an os.environ/ key: the forwarder drops the placeholder and sends a
# short-lived federated token instead. Port must equal anthropic_wif_listen_port
# (tests/test_anthropic_wif_role.py).
litellm_anthropic_wif_base: "http://127.0.0.1:4010"

# Model id behind the eval-mythos alias (Mythos 5.1, CVP Defense Access).
# Confirm against the account's GET /v1/models before the first run. It must
# also be in anthropic_wif_allowed_models, or the forwarder refuses it.
litellm_eval_mythos_model: "claude-mythos-5-1"
