  <!-- Whiskers -->
  <line x1="3" y1="18" x2="9" y2="19" stroke="#1a3a4a" stroke-width="0.6"/>
  <line x1="3" y1="21" x2="9" y2="21" stroke="#1a3a4a" stroke-width="0.6"/>
  <line x1="23" y1="19" x2="29" y2="18" stroke="#1a3a4a" stroke-width="0.6"/>
  <line x1="23" y1="21" x2="29" y2="21" stroke="#1a3a4a" stroke-width="0.6"/>
</svg>
