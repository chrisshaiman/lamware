  <ellipse cx="11.5" cy="16" rx="2" ry="2.5" fill="#0d1117"/>
  <ellipse cx="20.5" cy="16" rx="2" ry="2.5" fill="#0d1117"/>
  <!-- Eye shine -->
  <circle cx="12.5" cy="15" r="0.8" fill="#fff"/>
