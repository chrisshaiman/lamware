<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Ears -->
  <path d="M6 14 L4 4 L12 10 Z" fill="#58a6ff"/>
  <path d="M26 14 L28 4 L20 10 Z" fill="#58a6ff"/>
