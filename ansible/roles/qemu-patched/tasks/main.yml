---
# =============================================================================
# roles/qemu-patched/tasks/main.yml
# Builds a DSDT-patched QEMU binary from CAPEv2's kvm-qemu.sh installer
# and repairs the libvirt packages it damages.
#
# This role is slow on first run (30-60 min QEMU compilation) but
# stamp-guarded — subsequent runs skip the build.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

# -------------------------------------------------------------------------
# Cape user
# -------------------------------------------------------------------------

- name: Ensure libvirt and kvm groups exist
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop:
    - libvirt
    - kvm

- name: Create cape system user
  ansible.builtin.user:
    name: "{{ cape_user }}"
    system: true
    shell: /bin/bash
    home: "/home/{{ cape_user }}"
    create_home: true
    groups: libvirt,kvm
    append: true

- name: Install git
  ansible.builtin.apt:
    name: git
    state: present

- name: Create CAPEv2 install directory
  ansible.builtin.file:
    path: "{{ cape_install_dir }}"
    state: directory
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0755"

- name: Clone CAPEv2 repository
  ansible.builtin.git:
    repo: https://github.com/kevoreilly/CAPEv2.git
    dest: "{{ cape_install_dir }}"
    # Pinned 2026-04-19. force: true needed because cape2.sh modifies repo files.
    version: aa66fbd329052408a9599cf954a5cf72d8b1d61d
    depth: 1
    force: true
  become: true
  become_user: "{{ cape_user }}"

- name: Ensure cape owns its install directory
  ansible.builtin.file:
    path: "{{ cape_install_dir }}"
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    recurse: true

# -------------------------------------------------------------------------
# kvm-qemu.sh — builds DSDT-patched QEMU binary (slow; runs once)
# The script has a <WOOT> placeholder for the DSDT hex string.
# A stamp file prevents re-running after a successful build.
# -------------------------------------------------------------------------

# The stamp records that the build ONCE succeeded. It cannot record that the binary
# is still there (#308): on 2026-08-06 an apt transaction pulling libguestfs-tools
# installed qemu-system-x86 8.2.2 over the CAPE-built emulator. The stamp survived,
# so this guard said "already run" and the role would never have rebuilt it. The
# damage was durable and silent and surfaced only when a guest failed to start.
- name: Check if kvm-qemu.sh has already run
  ansible.builtin.stat:
    path: /opt/.cape-kvm-qemu-installed
  register: cape_kvm_qemu_stamp

- name: Check whether the preserved patched emulator still exists
  ansible.builtin.stat:
    path: "{{ qemu_patched_preserved_path }}"
  register: cape_qemu_preserved

# Is the binary at the distro path OURS, or the one the package shipped?
#
# This is the question the first attempt at this fix got wrong. It guarded the
# preserve step on `cape_kvm_qemu_stamp.stat.exists` -- "has the build ever run" --
# which is true precisely when the binary has been clobbered, so it would have
# copied stock 8.2.2 to the preserve path and, once the domains were repointed,
# re-caused #308 with the fix installed.
#
# dpkg answers it directly. kvm-qemu.sh installs over the packaged file, so:
#   not owned by any package  -> ours
#   owned but checksum-differs -> ours (dpkg -V flags it)
#   owned and unmodified       -> the stock file; refuse to preserve it
- name: Ask dpkg whether the distro-path emulator is the packaged file
  ansible.builtin.shell: |
    set -o pipefail
    owner=$(dpkg -S /usr/bin/qemu-system-x86_64 2>/dev/null | cut -d: -f1) || true
    if [ -z "$owner" ]; then echo NOT_PACKAGED; exit 0; fi
    if dpkg -V "$owner" 2>/dev/null | grep -q 'qemu-system-x86_64$'; then
      echo MODIFIED
    else
      echo PRISTINE_PACKAGE
    fi
  args:
    executable: /bin/bash
  register: qemu_usrbin_origin
  changed_when: false
  failed_when: false

- name: Write kvm-config.sh with hardware-specific brand names
  ansible.builtin.copy:
    content: |
      # kvm-config.sh — sourced by kvm-qemu.sh to replace QEMU identifiers
      # with real hardware brand names from this host.
      # Values from: dmidecode -s system-manufacturer / bios-vendor
      PEN_REPLACER='{{ cape_hw_brand | default("GIGABYTE") }}'
      SCSI_REPLACER='{{ cape_hw_brand | default("GIGABYTE") }}'
      ATAPI_REPLACER='{{ cape_hw_brand | default("GIGABYTE") }}'
      MICRODRIVE_REPLACER='{{ cape_hw_brand | default("GIGABYTE") }}'
      BOCHS_BLOCK_REPLACER='{{ cape_hw_brand | default("GIGABYTE") }}'
      BOCHS_BLOCK_REPLACER2='{{ cape_hw_brand | default("GIGABYTE") }}'
      BOCHS_BLOCK_REPLACER3='{{ cape_hw_brand | default("GIGABYTE") }}'
      BXPC_REPLACER='{{ cape_hw_bios_vendor | default("GIGABYTE") }}'
      BOCHS_SEABIOS_BLOCK_REPLACER='{{ cape_hw_bios_vendor | default("GIGABYTE") }}'
    dest: "{{ cape_install_dir }}/installer/kvm-config.sh"
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0755"
  when: not (cape_kvm_qemu_stamp.stat.exists and cape_qemu_preserved.stat.exists)

- name: Build patched QEMU with /tmp exec (restored on failure)
  when: not (cape_kvm_qemu_stamp.stat.exists and cape_qemu_preserved.stat.exists)
  block:
    - name: Temporarily allow exec on /tmp (needed for QEMU/libvirt build)
      ansible.builtin.command: mount -o remount,exec /tmp
      changed_when: true

    - name: Run kvm-qemu.sh (builds patched QEMU — may take 30-60 min)
      ansible.builtin.shell: |
        set -e
        export DEBIAN_FRONTEND=noninteractive
        export NEEDRESTART_MODE=a
        cd {{ cape_install_dir }}/installer
        bash kvm-qemu.sh all {{ cape_user }}
        touch /opt/.cape-kvm-qemu-installed
      args:
        executable: /bin/bash
      changed_when: true
  always:
    - name: Restore noexec on /tmp
      ansible.builtin.command: mount -o remount,noexec /tmp
      changed_when: true

# ---------------------------------------------------------------------------
# Preserve the patched emulator where apt cannot reach it (#308)
# ---------------------------------------------------------------------------
#
# /usr/bin/qemu-system-x86_64 belongs to qemu-system-x86. ANY apt operation that
# pulls that package in -- including one where qemu is an incidental dependency,
# which is how this broke -- replaces the DSDT-patched build. /usr/local/bin is
# outside dpkg's namespace, so a copy there survives package operations.
#
# This runs BEFORE the package restore below, because that restore can itself pull
# qemu-system-x86 in as a dependency of libvirt-daemon-system. Preserving afterwards
# would copy the already-clobbered stock binary.
#
# Nothing is repointed at the preserved copy in this change. cape_qemu_binary still
# points at /usr/bin, so the guests keep using exactly what they use today. That
# split is deliberate: preservation has to be observed working on a real host before
# the domains depend on it, because if the copy is wrong, repointing turns a
# recoverable state into a broken one. #327 does the repoint.
- name: Refuse to preserve the stock emulator over a good copy
  ansible.builtin.assert:
    that:
      - qemu_usrbin_origin.stdout | default('') != 'PRISTINE_PACKAGE'
        or cape_qemu_preserved.stat.exists
    fail_msg: |
      /usr/bin/qemu-system-x86_64 is the unmodified packaged binary, and no
      preserved copy exists at {{ qemu_patched_preserved_path }}.

      That means the DSDT-patched build is GONE, not merely unpreserved (#308).
      Preserving it now would enshrine stock QEMU as "the patched emulator".

      Delete /opt/.cape-kvm-qemu-installed and re-run this role to rebuild.
    success_msg: "Distro-path emulator is {{ qemu_usrbin_origin.stdout | default('?') }}."

- name: Preserve the DSDT-patched emulator outside dpkg's control
  ansible.builtin.copy:
    src: /usr/bin/qemu-system-x86_64
    dest: "{{ qemu_patched_preserved_path }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  # Only when the source is demonstrably OURS. The first version of this task
  # guarded on `cape_kvm_qemu_stamp.stat.exists` -- true precisely when the binary
  # had been clobbered -- so it would have copied stock 8.2.2 here.
  when: qemu_usrbin_origin.stdout | default('') in ['NOT_PACKAGED', 'MODIFIED']

# -------------------------------------------------------------------------
# Restore libvirt packages — kvm-qemu.sh and cape2.sh remove/replace system
# QEMU and libvirt packages. Reinstall what we need for virsh and libvirtd.
# -------------------------------------------------------------------------

- name: Remove broken apt repos and keys added by Cape installer
  ansible.builtin.shell: |
    rm -f /etc/apt/sources.list.d/mongodb*.list
    rm -f /etc/apt/sources.list.d/tor*.list
    rm -f /etc/apt/sources.list.d/pgdg*.list
    rm -f /etc/apt/keyrings/mongo.gpg
    rm -f /usr/share/keyrings/mongodb-server-8.0.gpg
  args:
    executable: /bin/bash
  changed_when: false

- name: Remove stale Cape libvirt libraries from /usr/local
  ansible.builtin.shell: |
    rm -f /usr/local/lib/x86_64-linux-gnu/libvirt*
    ldconfig
  args:
    executable: /bin/bash
  changed_when: false

- name: Reinstall libvirt and QEMU ROM packages after Cape installer
  ansible.builtin.apt:
    name:
      - libvirt-daemon-system
      - libvirt-clients
      - libvirt-dev
      - qemu-utils
      - qemu-system-data
      - seabios
      - ipxe-qemu
    state: present
    update_cache: true

- name: Fix QEMU data directory permissions (Cape installer sets 700)
  ansible.builtin.file:
    path: /usr/share/qemu
    mode: "0755"

- name: Symlink seabios VGA ROM to QEMU data directory
  ansible.builtin.file:
    src: /usr/share/seabios/vgabios-stdvga.bin
    dest: /usr/share/qemu/vgabios-stdvga.bin
    state: link

- name: Symlink iPXE e1000 EFI ROM to QEMU data directory
  ansible.builtin.file:
    src: /usr/lib/ipxe/qemu/efi-e1000.rom
    dest: /usr/share/qemu/efi-e1000.rom
    state: link

- name: Install patched QEMU binary (after apt reinstall to avoid overwrite)
  ansible.builtin.copy:
    src: /tmp/qemu-9.2.2_builded/usr/bin/qemu-system-x86_64
    dest: /usr/bin/qemu-system-x86_64
    mode: "0755"
    remote_src: true

- name: Restart libvirtd to pick up patched QEMU machine types
  ansible.builtin.systemd:
    name: libvirtd
    state: restarted
    daemon_reload: true

- name: Fix swtpm state directory ownership
  ansible.builtin.file:
    path: /var/lib/swtpm-localca
    owner: tss
    group: tss
    mode: "0755"

- name: Fix libvirt directory permissions (cape installer sets 700)
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0755"
  loop:
    - /var/lib/libvirt
    - /var/lib/libvirt/images

- name: Ensure libvirtd is running after reinstall
  ansible.builtin.systemd:
    name: libvirtd
    state: started
    enabled: true
    daemon_reload: true

# ---------------------------------------------------------------------------
# Post-deploy assertion: the emulator must run what the domains actually ask for
# ---------------------------------------------------------------------------
#
# #308 was silent for an unknown period and found by accident when a guest was
# started for an unrelated reason. Nothing could notice the emulator had been
# swapped.
#
# The machine type is NOT in this repo. guest-domain.xml.j2 says machine='q35',
# the generic alias; libvirt resolves it at define time and freezes the result
# ("pc-q35-9.2") into the persistent domain XML. So the requirement is a property
# of the defined domains on this host, and asking them is the only way to check it
# without inventing a version number.
#
# An earlier draft asserted `'q35' in stdout`. Stock QEMU 8.2.2 lists q35 too, so
# that assertion would have PASSED throughout the outage it was written to catch --
# the same shape as #238's unfirable `| mandatory` and #297's inert `/no_think`.
- name: Collect the machine types the defined domains require
  ansible.builtin.shell: |
    set -o pipefail
    virsh list --all --name 2>/dev/null | while read -r d; do
      [ -n "$d" ] || continue
      virsh dumpxml "$d" 2>/dev/null | sed -n "s/.*machine='\([^']*\)'.*/\1/p"
    done | sort -u
  args:
    executable: /bin/bash
  register: qemu_required_machines
  changed_when: false
  failed_when: false

- name: Read the machine types each candidate emulator supports
  ansible.builtin.command: "{{ item }} -machine help"
  register: qemu_supported_machines
  changed_when: false
  failed_when: false
  loop:
    - "{{ cape_qemu_binary }}"
    - "{{ qemu_patched_preserved_path }}"

- name: Fail if an emulator cannot run a machine type the domains are defined against
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - qemu_required_machines.stdout_lines
        | difference(item.stdout | default('') | regex_findall('^([\w.-]+)\s', multiline=True))
        | length == 0
    fail_msg: |
      {{ item.item }} cannot run every machine type the defined domains use.

        required by domains : {{ qemu_required_machines.stdout_lines | join(', ') }}
        missing from this binary : {{ qemu_required_machines.stdout_lines
          | difference(item.stdout | default('') | regex_findall('^([\w.-]+)\s', multiline=True))
          | join(', ') }}

      This is #308: an apt transaction replaced the DSDT-patched QEMU with the
      stock package, the domains' frozen machine type no longer existed, and
      nothing noticed until a detonation was attempted.

      Delete /opt/.cape-kvm-qemu-installed and re-run this role to rebuild.
    success_msg: "{{ item.item }} supports every machine type the domains require."
  loop: "{{ qemu_supported_machines.results }}"
  loop_control:
    label: "{{ item.item }}"
  # No domains defined yet (first build, or libvirt not up) means there is nothing
  # to verify against. Say so rather than passing quietly — a check that cannot run
  # must not look like a check that passed.
  when: qemu_required_machines.stdout_lines | length > 0

- name: Report when the emulator check could not run
  ansible.builtin.debug:
    msg: >-
      SKIPPED emulator/machine-type verification: no defined domains found
      (virsh returned nothing). This check needs at least one defined domain to
      know what to require. It is NOT a pass.
  when: qemu_required_machines.stdout_lines | length == 0

# ---------------------------------------------------------------------------
# Snapshot metadata pins the emulator too (#327)
# ---------------------------------------------------------------------------
#
# `virsh define` updates the persistent domain XML; it does NOT touch existing
# snapshots. libvirt stores the full domain config inside each snapshot, and
# `snapshot-revert` restores it -- so a domain repointed at the preserved emulator
# still boots the OLD path on every revert. CAPE reverts before each detonation,
# which means the repoint has no effect on real analyses until the snapshots are
# recreated.
#
# Verified 2026-08-08: both `clean` and `office` snapshots pinned
# /usr/bin/qemu-system-x86_64 while the domains were about to be redefined.
#
# Reported, not fatal. Recreating a snapshot means rebooting the guest and taking a
# fresh pristine baseline, which is an operator decision with fidelity consequences,
# not something a routine deploy should do. But it must not look done when it isn't.
- name: Read the emulator each snapshot would restore
  ansible.builtin.shell: |
    set -o pipefail
    virsh list --all --name 2>/dev/null | while read -r d; do
      [ -n "$d" ] || continue
      virsh snapshot-list "$d" --name 2>/dev/null | while read -r s; do
        [ -n "$s" ] || continue
        emu=$(virsh snapshot-dumpxml "$d" "$s" 2>/dev/null \
              | sed -n 's|.*<emulator>\(.*\)</emulator>.*|\1|p' | head -1)
        [ -n "$emu" ] && echo "$d/$s $emu"
      done
    done
  args:
    executable: /bin/bash
  register: qemu_snapshot_emulators
  changed_when: false
  failed_when: false

- name: Report snapshots that would restore a different emulator
  ansible.builtin.debug:
    msg: >-
      SNAPSHOT EMULATOR MISMATCH — these snapshots restore an emulator other than
      {{ cape_qemu_binary }}, and CAPE reverts to snapshot before every detonation,
      so those analyses will NOT use the configured emulator:
      {{ qemu_snapshot_emulators.stdout_lines
         | reject('search', cape_qemu_binary | regex_escape) | list | join('; ') }}
      — recreate the snapshots to make the repoint effective. This is NOT a failure:
      it is the repoint being incomplete, reported so it cannot look finished.
  when: qemu_snapshot_emulators.stdout_lines
        | default([]) | reject('search', cape_qemu_binary | regex_escape) | list | length > 0
