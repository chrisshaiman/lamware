---
# =============================================================================
# roles/python-sandbox/tasks/main.yml
# Builds the Python sandbox container image for LLM-generated analysis scripts.
#
# Scripts submitted by the investigation agent run inside a rootless Podman
# container with no network access, read-only root filesystem, and all
# capabilities dropped. Payload files are optionally mounted read-only.
#
# Depends on: podman role (container runtime must be installed)
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

# -------------------------------------------------------------------------
# Host directories
# -------------------------------------------------------------------------

- name: Create python-sandbox directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: lamware
    mode: "0750"
  loop:
    - "{{ python_sandbox_install_dir }}"

- name: Root-own what is already in the build context (ADR-025)
  # Earlier deploys left these pipeline-owned, and a file this role no longer
  # ships would keep its old owner. follow: false: never chown a link's target.
  ansible.builtin.file:
    path: "{{ python_sandbox_install_dir }}/build"
    state: directory
    owner: root
    group: lamware
    # g+rX: the pipeline (group lamware) must read the context it builds;
    # go-w: and must not write it. Symbolic, so existing 0644/0755 files keep
    # their modes and a deploy does not change the context for nothing.
    mode: "u+rwX,g+rX,go-w"
    recurse: true
    follow: false

# -------------------------------------------------------------------------
# Container image build
# -------------------------------------------------------------------------

- name: Create container build directory
  ansible.builtin.file:
    path: "{{ python_sandbox_install_dir }}/build"
    state: directory
    owner: root
    group: lamware
    mode: "0750"

- name: Deploy Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ python_sandbox_install_dir }}/build/Containerfile"
    owner: root
    group: lamware
    mode: "0644"

- name: Copy helpers library into build context
  ansible.builtin.copy:
    src: helpers/
    dest: "{{ python_sandbox_install_dir }}/build/helpers/"
    owner: root
    group: lamware
    mode: "0644"

- name: Build the python-sandbox image hermetically (ADR-023)
  ansible.builtin.include_role:
    name: build-fetch
    tasks_from: image
  vars:
    hb_name: python-sandbox
    hb_build_dir: "{{ python_sandbox_install_dir }}/build"
    hb_tag: localhost/python-sandbox:latest
    hb_base_images:
      - ref: "{{ build_fetch_python_slim }}"
        id: "{{ build_fetch_python_slim_id }}"

- name: Deploy run-sandbox wrapper script
  ansible.builtin.template:
    src: run-sandbox.sh.j2
    dest: "{{ python_sandbox_install_dir }}/run-sandbox"
    owner: root
    group: lamware
    mode: "0750"

- name: Create convenience symlink
  ansible.builtin.file:
    src: "{{ python_sandbox_install_dir }}/run-sandbox"
    dest: /usr/local/bin/run-sandbox
    state: link
