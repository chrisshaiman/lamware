---
# =============================================================================
# roles/cape-guests/tasks/main.yml
# Deploys guest VM images, defines libvirt domains, and takes snapshots
# for Cape analysis.
#
# Depends on: cape (Cape services must be installed and configured)
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

# -------------------------------------------------------------------------
# Guest VM libvirt domain definitions
# -------------------------------------------------------------------------

- name: Ensure guest image directory exists
  ansible.builtin.file:
    path: "{{ cape_guest_image_dir }}"
    state: directory
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0755"

- name: Move guest images from upload staging to images directory
  ansible.builtin.shell: |
    moved=0
    for img in /home/ubuntu/windows11-*.qcow2; do
      [ -f "$img" ] && mv "$img" {{ cape_guest_image_dir }}/ && echo "moved $img" && moved=1
    done
    exit 0
  args:
    executable: /bin/bash
  register: cape_image_move
  changed_when: "'moved' in cape_image_move.stdout"

- name: Wait for guest images to be present
  ansible.builtin.wait_for:
    path: "{{ item.disk_path }}"
    timeout: 600
  loop: "{{ cape_guests }}"
  loop_control:
    label: "{{ item.name }}"

- name: Set guest image ownership for libvirt access
  ansible.builtin.shell: chown libvirt-qemu:kvm {{ cape_guest_image_dir }}/windows11-*.qcow2
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false

- name: Ensure OVMF nvram directory exists
  ansible.builtin.file:
    path: /var/lib/libvirt/qemu/nvram
    state: directory
    owner: libvirt-qemu
    group: kvm
    mode: "0755"

# `virsh define` updates an existing domain ONLY when the XML carries that
# domain's UUID. The template omitted it, so libvirt minted a new one and rejected
# the define on a name collision -- meaning the domain XML could never be updated
# after first deploy. Found when #327's emulator repoint failed to apply.
# The CPU model has to exist in BOTH layers, which disagree. qemu accepts
# Skylake-Client-v4; libvirt validates <model> against its own cpu_map, which
# carries only the unversioned aliases, and rejects it at domain START -- long
# after the image was built against it. Checked here, before anything is
# defined, because the failure otherwise lands 40 minutes into a rebuild.
- name: Read the CPU models libvirt will accept
  ansible.builtin.command: virsh cpu-models x86_64
  register: cape_libvirt_cpu_models
  changed_when: false

- name: Fail early if libvirt does not know the guest CPU model
  ansible.builtin.assert:
    that:
      - cape_guest_cpu_model in (cape_libvirt_cpu_models.stdout_lines | map('trim') | list)
    fail_msg: >-
      cape_guest_cpu_model is '{{ cape_guest_cpu_model }}', which libvirt's
      cpu_map does not contain, so `virsh start` will fail with "Unknown CPU
      model". Versioned qemu names (-v1..-v4) are never in the cpu_map; use the
      alias instead, e.g. Skylake-Client-noTSX-IBRS for Skylake-Client-v3.
    success_msg: "libvirt accepts CPU model {{ cape_guest_cpu_model }}"

- name: Resolve how QEMU interprets the guest CPU model
  ansible.builtin.shell: |
    set -o pipefail
    {{ cape_qemu_binary }} -cpu help | awk -v m="{{ cape_guest_cpu_model }}" '$1 == m { $1=""; print }'
  args:
    executable: /bin/bash
  register: cape_qemu_cpu_model_line
  changed_when: false

- name: Fail if the CPU model is one QEMU resolves by machine type
  ansible.builtin.assert:
    that:
      - cape_qemu_cpu_model_line.stdout | trim | length > 0
      - "'alias configured by machine type' not in cape_qemu_cpu_model_line.stdout"
    fail_msg: >-
      cape_guest_cpu_model is '{{ cape_guest_cpu_model }}', which this QEMU
      either does not know or resolves by machine type. A machine-type alias can
      mean different silicon on different QEMU versions, which silently breaks
      the licence hardware hash the moment the build host and this host differ.
      Pin a versioned alias, e.g. Skylake-Client-noTSX-IBRS.
    success_msg: "QEMU resolves {{ cape_guest_cpu_model }} to:{{ cape_qemu_cpu_model_line.stdout | trim }}"

- name: Read existing domain UUIDs (a redefine must reuse them)
  ansible.builtin.command: "virsh domuuid {{ item.name }}"
  loop: "{{ cape_guests }}"
  loop_control:
    label: "{{ item.name }}"
  register: cape_guest_uuids
  changed_when: false
  failed_when: false

- name: Map guest name to its existing UUID
  # Absent domain => non-zero rc and empty stdout => empty string => the template
  # omits <uuid> and libvirt assigns one, which is correct for a first define.
  ansible.builtin.set_fact:
    cape_guest_uuid_map: >-
      {{ dict(cape_guest_uuids.results | map(attribute='item.name') | list
              | zip(cape_guest_uuids.results | map(attribute='stdout')
                    | map('trim') | list)) }}

- name: Deploy guest libvirt domain XML
  ansible.builtin.template:
    src: guest-domain.xml.j2
    dest: "/tmp/cape-guest-{{ item.name }}.xml"
    mode: "0600"
  loop: "{{ cape_guests }}"
  loop_control:
    label: "{{ item.name }}"

- name: Define guest libvirt domains (virsh define)
  ansible.builtin.command:
    cmd: virsh define /tmp/cape-guest-{{ item.name }}.xml
  loop: "{{ cape_guests }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Remove temporary domain XML files
  ansible.builtin.file:
    path: "/tmp/cape-guest-{{ item.name }}.xml"
    state: absent
  loop: "{{ cape_guests }}"
  loop_control:
    label: "{{ item.name }}"

# -------------------------------------------------------------------------
# Guest VM snapshots — required before Cape can start analysis
# -------------------------------------------------------------------------

- name: Check if snapshots already exist
  ansible.builtin.command: virsh snapshot-list {{ item.name }} --name
  loop: "{{ cape_guests }}"
  loop_control:
    label: "{{ item.name }}"
  register: cape_snapshot_check
  changed_when: false
  failed_when: false

- name: Take guest VM snapshots (if not already snapshotted)
  when: cape_snapshot_check.results | selectattr('stdout', 'equalto', '') | list | length > 0
  block:
    - name: Start guest VMs for snapshotting
      ansible.builtin.command: virsh start {{ item.item.name }}
      loop: "{{ cape_snapshot_check.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.stdout == ""
      changed_when: true

    - name: Wait for cape-agent to respond on each guest
      ansible.builtin.uri:
        url: "http://{{ item.item.ip }}:8000/"
        timeout: 5
      loop: "{{ cape_snapshot_check.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.stdout == ""
      retries: 36
      delay: 5
      register: cape_agent_check
      until: cape_agent_check is success

    - name: Take external snapshot with memory state
      ansible.builtin.command: >
        virsh snapshot-create-as {{ item.item.name }} {{ item.item.snapshot }}
        --memspec file={{ cape_guest_image_dir }}/{{ item.item.name }}.memsnap,snapshot=external
        --diskspec sda,file={{ cape_guest_image_dir }}/{{ item.item.name }}.overlay.qcow2,snapshot=external
      loop: "{{ cape_snapshot_check.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.stdout == ""
      changed_when: true

    - name: Shut down guest VMs after snapshotting
      ansible.builtin.command: virsh shutdown {{ item.item.name }}
      loop: "{{ cape_snapshot_check.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.stdout == ""
      changed_when: true

    - name: Wait for VMs to shut down
      ansible.builtin.pause:
        seconds: 15

# -------------------------------------------------------------------------
# Restart Cape services after snapshots exist
# -------------------------------------------------------------------------

- name: Start Cape core service (initializes DB schema)
  ansible.builtin.systemd:
    name: cape
    state: restarted

- name: Wait for Cape to initialize
  ansible.builtin.pause:
    seconds: 10

- name: Start Cape web and processor
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop:
    - cape-web
    - cape-processor
