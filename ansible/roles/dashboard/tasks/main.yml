---
# =============================================================================
# roles/dashboard/tasks/main.yml
# Deploys the Flask-based malware analysis dashboard.
#
# Runs as a systemd service behind WireGuard on port 5000.
# Reads from the malware_analysis PostgreSQL database.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Install Flask and dependencies
  ansible.builtin.pip:
    name:
      - flask
      - markdown
    state: present
    break_system_packages: true
    extra_args: "--ignore-installed blinker"

- name: Fix pip package permissions for cape user
  ansible.builtin.shell: chmod -R a+rX /usr/local/lib/python3.12/dist-packages/
  args:
    executable: /bin/bash
  changed_when: false

- name: Create dashboard directory
  ansible.builtin.file:
    path: "{{ dashboard_install_dir }}"
    state: directory
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0750"

- name: Deploy dashboard app
  ansible.builtin.template:
    src: app.py.j2
    dest: "{{ dashboard_install_dir }}/app.py"
    owner: "{{ cape_user }}"
    group: "{{ cape_user }}"
    mode: "0750"
  notify: Restart dashboard

- name: Deploy systemd service
  ansible.builtin.template:
    src: dashboard.service.j2
    dest: /etc/systemd/system/dashboard.service
    mode: "0644"
  notify: Restart dashboard

- name: Enable and start dashboard
  ansible.builtin.systemd:
    name: dashboard
    state: started
    enabled: true
    daemon_reload: true
