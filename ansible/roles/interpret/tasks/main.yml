---
# =============================================================================
# roles/interpret/tasks/main.yml
# Builds the LLM interpretation container image.
#
# Runs a Claude API conversation agent inside a rootless Podman container
# with network access (required for API calls) but all capabilities dropped.
# Communicates with the orchestrator via stdin/stdout JSON lines.
#
# Depends on: podman role (container runtime must be installed)
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

# -------------------------------------------------------------------------
# Host directories
# -------------------------------------------------------------------------

- name: Create interpret directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: lamware
    mode: "0750"
  loop:
    - "{{ interpret_install_dir }}"
    - "{{ interpret_install_dir }}/build"

- name: Create the prompt A/B results directory (pipeline's data; ADR-025)
  ansible.builtin.file:
    path: "{{ interpret_install_dir }}/ab-results"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"

- name: Root-own what is already in the build context (ADR-025)
  # Earlier deploys left these pipeline-owned, and a file this role no longer
  # ships would keep its old owner. follow: false: never chown a link's target.
  ansible.builtin.file:
    path: "{{ interpret_install_dir }}/build"
    state: directory
    owner: root
    group: lamware
    # g+rX: the pipeline (group lamware) must read the context it builds;
    # go-w: and must not write it. Symbolic, so existing 0644/0755 files keep
    # their modes and a deploy does not change the context for nothing.
    mode: "u+rwX,g+rX,go-w"
    recurse: true
    follow: false

# -------------------------------------------------------------------------
# Container image build
# -------------------------------------------------------------------------

- name: Deploy Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ interpret_install_dir }}/build/Containerfile"
    owner: root
    group: lamware
    mode: "0644"

- name: Deploy interpret-ghidra.py into build context
  ansible.builtin.copy:
    src: interpret-ghidra.py
    dest: "{{ interpret_install_dir }}/build/interpret-ghidra.py"
    owner: root
    group: lamware
    mode: "0755"

- name: Deploy interpret-config.json into build context
  ansible.builtin.template:
    src: interpret-config.json.j2
    dest: "{{ interpret_install_dir }}/build/interpret-config.json"
    owner: root
    group: lamware
    mode: "0644"

- name: Build the interpret image hermetically (ADR-023)
  ansible.builtin.include_role:
    name: build-fetch
    tasks_from: image
  vars:
    hb_name: interpret
    hb_build_dir: "{{ interpret_install_dir }}/build"
    hb_tag: localhost/interpret:latest
    hb_base_images:
      - ref: "{{ build_fetch_python_slim }}"
        id: "{{ build_fetch_python_slim_id }}"
    hb_lock: requirements.lock

- name: Deploy interpret wrapper script
  ansible.builtin.template:
    src: run-interpret-wrapper.sh.j2
    dest: "{{ interpret_install_dir }}/run-interpret"
    owner: root
    group: lamware
    mode: "0750"
  # Suppresses the rendered body under --diff, which would otherwise print
  # litellm_master_key. NOT no_log: that also censors failure messages, so a
  # firing `| mandatory` would report "censored" instead of naming the missing
  # variable — the opaque-guard problem #238 exists to fix.
  diff: false

- name: Create convenience symlink
  ansible.builtin.file:
    src: "{{ interpret_install_dir }}/run-interpret"
    dest: /usr/local/bin/run-interpret
    state: link

- name: Deploy interpret network-isolation probe
  ansible.builtin.copy:
    src: netcheck.py
    dest: "{{ interpret_install_dir }}/netcheck.py"
    owner: root
    group: lamware
    mode: "0644"

- name: Deploy prompt A/B probe
  # Measurement tooling, not part of any run. Bind-mounted into the interpret image on
  # demand by run-prompt-ab, the same way netcheck.py is — so it always executes against
  # the deployed container rather than a second copy of its dependencies.
  ansible.builtin.copy:
    src: prompt_ab.py
    dest: "{{ interpret_install_dir }}/prompt_ab.py"
    owner: root
    group: lamware
    mode: "0644"

- name: Deploy prompt A/B wrapper
  ansible.builtin.template:
    src: run-prompt-ab.sh.j2
    dest: "{{ interpret_install_dir }}/run-prompt-ab"
    owner: root
    group: lamware
    mode: "0750"
  # Suppresses the rendered body under --diff, which would otherwise print
  # litellm_master_key. NOT no_log: that also censors failure messages, so a
  # firing `| mandatory` would report "censored" instead of naming the missing
  # variable — the opaque-guard problem #238 exists to fix.
  diff: false

- name: Symlink run-prompt-ab onto PATH
  ansible.builtin.file:
    src: "{{ interpret_install_dir }}/run-prompt-ab"
    dest: /usr/local/bin/run-prompt-ab
    state: link

- name: Verify interpret network isolation (--network=none probe container)
  # Proves the container CAN reach LiteLLM via the socket and CANNOT reach host
  # services. Runs as the pipeline user (same rootless context that runs interpret).
  # Requires litellm-socket.service up — deploy with --tags litellm,interpret.
  become: true
  become_user: pipeline
  # Pass the key via the env (not the argv) so it isn't visible in ps/process listings;
  # podman -e LITELLM_API_KEY (no value) forwards it from this environment. Output stays
  # visible (no no_log) so a probe failure is debuggable.
  environment:
    LITELLM_API_KEY: "{{ litellm_master_key | mandatory }}"
  ansible.builtin.command:
    cmd: >
      podman run --rm --network=none
      --user 65534:65534
      -v /run/litellm/litellm.sock:/run/litellm.sock:ro
      -v {{ interpret_install_dir }}/netcheck.py:/opt/netcheck.py:ro
      -e LITELLM_API_KEY
      --entrypoint python3
      localhost/interpret:latest
      /opt/netcheck.py
  changed_when: false
