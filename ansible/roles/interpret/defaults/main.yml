---
# roles/interpret/defaults/main.yml

# Feature toggle
interpret_enabled: true

# Provider (future: "local" for ollama/vllm)
interpret_provider: "anthropic"

# Model selection — interpret (agentic code analysis)
interpret_model: "claude-sonnet-4-6"

# Model selection — executive summary (structured reformatting, no tools)
interpret_summary_model: "claude-haiku-4-5"

# Escalation (interpret stage only)
interpret_escalation_threshold: 5
interpret_escalation_model: "claude-opus-4-6"

# Token budgets
interpret_max_output_tokens: 4096
interpret_context_compression_tokens: 30000

# Agentic loop limits
interpret_max_tool_calls: 10
interpret_timeout: 300

# Input caps
interpret_max_imports: 200
interpret_max_strings: 100
interpret_max_string_length: 500

# Container resources
interpret_container_memory: "512m"
interpret_container_cpus: "1"
# Podman --timeout for the interpret container. 360s was sized for cloud Claude
# RE (~150s/sample) and is far too short for reasoning-on LOCAL models, which it
# silently SIGKILLs mid-run:
#   - qwen3.6 agentic RE, 10 tool calls: 333s measured (2026-07-23) - already
#     within seconds of 360
#   - PR #180's two-phase synthesis adds a reasoning turn: ~9-10min/sample
#   - a 25-cycle arm at ~33s/turn is ~825s
# It also killed the qwen3:32b and gpt-oss spikes ("exited without final result").
#
# 2400s was still too tight for a 25-cycle local arm: in benchmark pass 1
# (2026-07-25) qwen@25 timed out on 3 of 4 samples, and the ONE that completed
# used 2355s of the 2400s budget - i.e. it finished with 45s to spare, so the
# three failures were cut off at an unknown true requirement. Measured rate was
# ~90s per tool call, so 25 cycles plus PR #180's two-phase synthesis needs
# roughly 2500-3400s before any variance.
#
# 5400s (90min) was still not enough for a 30-cycle local run, and the reason is
# that this budget covers the tool loop AND synthesis together. On 2026-07-27 the
# SAME arm on the SAME sample varied enormously with the strategy the model chose:
#   - qwen@30 run A: 30 tool calls in 25min (10 decompiles, many cheap reads)
#   - qwen@30 run B: 30 tool calls in 86min (15 decompiles)
# Run B then entered synthesis with ~4min of budget left and was SIGKILLed at
# exactly 5400.5s. Decompiled bodies are ~9KB each and stay in the transcript, so
# every extra decompile inflates the cost of every later turn - the spread is a
# property of the workload, not noise to average away.
#
# 10800s (3h) sizes for the slow tail plus a real 15-30min synthesis window.
# TRADE-OFF, unchanged in kind but larger: a genuinely hung container now holds a
# pipeline slot for 3h. Production RE is cloud Claude at ~150-220s so this only
# bites the local path, and #219's stderr capture means a hang is now diagnosable
# rather than silent. Lower it if the sequential auto-feeder ever stalls on it.
interpret_container_timeout: "10800"

# Install directory
interpret_install_dir: /opt/interpret
