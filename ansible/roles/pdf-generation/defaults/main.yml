---
# roles/pdf-generation/defaults/main.yml

pdf_generation_install_dir: /opt/pdf-generation
pdf_generation_container_memory: "512m"
pdf_generation_container_cpus: "1"
pdf_generation_container_timeout: "120"

# --- ADR-023: hermetic build inputs -------------------------------------------
# The base image and the Debian snapshot are build-fetch's shared python:3.12-slim
# (build_fetch_python_slim, build_fetch_trixie_sources).
pdf_generation_debs:
  - libpango-1.0-0
  - libpangocairo-1.0-0
  - libgdk-pixbuf-2.0-0
  - libffi-dev
  - libcairo2
