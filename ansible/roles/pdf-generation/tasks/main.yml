---
# =============================================================================
# roles/pdf-generation/tasks/main.yml
# Builds the PDF generation container (WeasyPrint + Markdown).
#
# Containerizes report rendering to isolate HTML/CSS processing
# from untrusted malware-derived strings (IOC values, LLM output,
# sample names that could contain XSS-like payloads).
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Create pdf-generation directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"
  loop:
    - "{{ pdf_generation_install_dir }}"
    - "{{ pdf_generation_install_dir }}/build"
    - "{{ pdf_generation_install_dir }}/output"

- name: Deploy Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ pdf_generation_install_dir }}/build/Containerfile"
    owner: pipeline
    group: pipeline
    mode: "0644"

- name: Deploy generate-report.py
  # Single-sourced from the pipeline role's files/ (plain Python now, static shebang,
  # no Jinja/secret) — copy: instead of template:, into the pdf-generation build context.
  ansible.builtin.copy:
    src: "../../pipeline/files/generate-report.py"
    dest: "{{ pdf_generation_install_dir }}/build/generate-report.py"
    owner: pipeline
    group: pipeline
    mode: "0755"

- name: Build pdf-generation container image
  ansible.builtin.command:
    cmd: >
      podman build
      --no-cache
      --network=host
      -t localhost/pdf-generation:latest
      -f {{ pdf_generation_install_dir }}/build/Containerfile
      {{ pdf_generation_install_dir }}/build
  become: true
  become_user: pipeline
  changed_when: true

- name: Deploy pdf-generation wrapper script
  ansible.builtin.template:
    src: run-pdf-generation-wrapper.sh.j2
    dest: "{{ pdf_generation_install_dir }}/run-pdf-generation"
    owner: pipeline
    group: pipeline
    mode: "0750"

- name: Create convenience symlink
  ansible.builtin.file:
    src: "{{ pdf_generation_install_dir }}/run-pdf-generation"
    dest: /usr/local/bin/run-pdf-generation
    state: link
