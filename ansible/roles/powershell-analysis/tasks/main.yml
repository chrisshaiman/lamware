---
# roles/powershell-analysis/tasks/main.yml

- name: Create powershell-analysis directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"
  loop:
    - "{{ powershell_analysis_install_dir }}"
    - "{{ powershell_analysis_install_dir }}/build"

- name: Deploy Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ powershell_analysis_install_dir }}/build/Containerfile"
    owner: pipeline
    group: pipeline
    mode: "0644"

- name: Deploy analysis script
  ansible.builtin.template:
    src: analyze-powershell.py.j2
    dest: "{{ powershell_analysis_install_dir }}/build/analyze-powershell.py"
    owner: pipeline
    group: pipeline
    mode: "0644"

- name: Deploy minusone's licence into the build context (MIT notice ships with it)
  ansible.builtin.copy:
    src: minusone-LICENSE
    dest: "{{ powershell_analysis_install_dir }}/build/minusone-LICENSE"
    owner: pipeline
    group: pipeline
    mode: "0644"

- name: Build the powershell-analysis image hermetically (ADR-023)
  ansible.builtin.include_role:
    name: build-fetch
    tasks_from: image
  vars:
    hb_name: powershell-analysis
    hb_build_dir: "{{ powershell_analysis_install_dir }}/build"
    hb_tag: localhost/powershell-analysis:latest
    hb_base_images:
      - ref: "{{ powershell_analysis_base_image }}"
        id: "{{ powershell_analysis_base_image_id }}"
    hb_deb_sets:
      - name: main
        image: "{{ powershell_analysis_base_image }}"
        sources: "{{ powershell_analysis_apt_sources }}"
        packages: "{{ powershell_analysis_debs }}"
    # The static deobfuscator (#766): pyminusone, a cp38-abi3 wheel built for
    # glibc 2.34+ (bookworm has 2.36), for the image's Debian python3 (3.11).
    hb_lock: requirements.lock
    hb_python: "3.11"
    hb_platforms: [manylinux_2_34_x86_64, any]

- name: Deploy wrapper script
  ansible.builtin.template:
    src: run-powershell-analysis-wrapper.sh.j2
    dest: "{{ powershell_analysis_install_dir }}/run-powershell-analysis"
    owner: pipeline
    group: pipeline
    mode: "0750"

- name: Symlink wrapper to PATH
  ansible.builtin.file:
    src: "{{ powershell_analysis_install_dir }}/run-powershell-analysis"
    dest: /usr/local/bin/run-powershell-analysis
    state: link
