---
# =============================================================================
# roles/screenshot-analysis/tasks/main.yml
# Builds the screenshot analysis container (dedup + QR detection).
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Create screenshot-analysis directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: lamware
    mode: "0750"
  loop:
    - "{{ screenshot_analysis_install_dir }}"
    - "{{ screenshot_analysis_install_dir }}/build"

- name: Create the data directories (pipeline's; ADR-025)
  # Runtime output only. Everything else under the install directory is
  # root-owned code the pipeline reads and runs but cannot change.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"
  loop:
    - "{{ screenshot_analysis_install_dir }}/output"

- name: Root-own what is already in the build context (ADR-025)
  # Earlier deploys left these pipeline-owned, and a file this role no longer
  # ships would keep its old owner. follow: false: never chown a link's target.
  ansible.builtin.file:
    path: "{{ screenshot_analysis_install_dir }}/build"
    state: directory
    owner: root
    group: lamware
    # g+rX: the pipeline (group lamware) must read the context it builds;
    # go-w: and must not write it. Symbolic, so existing 0644/0755 files keep
    # their modes and a deploy does not change the context for nothing.
    mode: "u+rwX,g+rX,go-w"
    recurse: true
    follow: false

- name: Deploy Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ screenshot_analysis_install_dir }}/build/Containerfile"
    owner: root
    group: lamware
    mode: "0644"

- name: Deploy analyze-screenshots.py
  ansible.builtin.template:
    src: analyze-screenshots.py.j2
    dest: "{{ screenshot_analysis_install_dir }}/build/analyze-screenshots.py"
    owner: root
    group: lamware
    mode: "0755"

- name: Build the screenshot-analysis image hermetically (ADR-023)
  ansible.builtin.include_role:
    name: build-fetch
    tasks_from: image
  vars:
    hb_name: screenshot-analysis
    hb_build_dir: "{{ screenshot_analysis_install_dir }}/build"
    hb_tag: localhost/screenshot-analysis:latest
    hb_base_images:
      - ref: "{{ build_fetch_python_slim }}"
        id: "{{ build_fetch_python_slim_id }}"
    hb_deb_sets:
      - name: main
        image: "{{ build_fetch_python_slim }}"
        sources: "{{ build_fetch_trixie_sources }}"
        packages: "{{ screenshot_analysis_debs }}"
    hb_lock: requirements.lock

- name: Deploy screenshot-analysis wrapper script
  ansible.builtin.template:
    src: run-screenshot-analysis-wrapper.sh.j2
    dest: "{{ screenshot_analysis_install_dir }}/run-screenshot-analysis"
    owner: root
    group: lamware
    mode: "0750"

- name: Create convenience symlink
  ansible.builtin.file:
    src: "{{ screenshot_analysis_install_dir }}/run-screenshot-analysis"
    dest: /usr/local/bin/run-screenshot-analysis
    state: link
