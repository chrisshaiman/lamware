---
# roles/dotnet-analysis/defaults/main.yml

dotnet_analysis_install_dir: /opt/dotnet-analysis
dotnet_analysis_container_memory: "1g"
dotnet_analysis_container_cpus: "1"
dotnet_analysis_container_timeout: "120"

# Upstream commit for the tool built into the image. Resolved from HEAD on
# 2026-08-08; bump deliberately, not implicitly.
# https://github.com/GDATAAdvancedAnalytics/de4dotEx/commit/660088d663239de6bc0df7da15accabbd15495d7
de4dotex_commit: 660088d663239de6bc0df7da15accabbd15495d7

# sha256 of the codeload tarball for de4dotex_commit
de4dotex_sha256: 7d989c185190cad59f696b3798597f8e098470d9f393077009f9f35670a4dabd

# --- ADR-023: hermetic build inputs -------------------------------------------
# Base image, by digest: mcr.microsoft.com/dotnet/sdk:10.0 as the registry served it
# on 2026-10-12. NOT the older copy in pipeline's store (SDK 10.0.300, runtime
# 10.0.8): the running image was built from a newer one (runtime 10.0.11), and an
# older base would roll back .NET fixes in a container that parses hostile
# assemblies. By release date this is SDK 10.0.401 / runtime 10.0.12 (2026-09-08).
# Moving it is a deliberate change to this line AND to the 8.0.x pack versions
# below: the SDK's Microsoft.NETCoreSdk.BundledVersions.props decides which net8.0
# packs a self-contained publish restores. 8.0.31 shipped the same day as
# 10.0.401, so that is the expected pin; the first build confirms it (a wrong
# version fails the offline restore by name, before the image is replaced).
# The linux/amd64 MANIFEST digest inside that tag's index (sha256:e70cdb7f…), not
# the index digest: a saved image carries only the platform manifest, so `podman
# load` refuses to file it under the index digest ("Digest of source image's
# manifest would not match destination reference"), and the hand-off to pipeline
# failed exactly that way on the first deploy.
dotnet_analysis_base_image: "mcr.microsoft.com/dotnet/sdk@sha256:0eeb52c76e35a5431ca707ad2bc75e38006a05393045d8532ae44c15d9474523"

# The Ubuntu archive at 2026-10-10: not older than what the running image installed
# from the live mirror. apt still verifies the signed Release files.
dotnet_analysis_ubuntu_snapshot: "20261010T000000Z"
dotnet_analysis_snapshot: "https://snapshot.ubuntu.com/ubuntu"
dotnet_analysis_keyring: "signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg"
# The image's own ubuntu.sources: these four suites, all four components.
dotnet_analysis_archive: "{{ dotnet_analysis_snapshot }}/{{ dotnet_analysis_ubuntu_snapshot }}"
dotnet_analysis_components: "main universe restricted multiverse"
dotnet_analysis_apt_sources:
  - "deb [{{ dotnet_analysis_keyring }}] {{ dotnet_analysis_archive }} noble {{ dotnet_analysis_components }}"
  - "deb [{{ dotnet_analysis_keyring }}] {{ dotnet_analysis_archive }} noble-updates {{ dotnet_analysis_components }}"
  - "deb [{{ dotnet_analysis_keyring }}] {{ dotnet_analysis_archive }} noble-backports {{ dotnet_analysis_components }}"
  - "deb [{{ dotnet_analysis_keyring }}] {{ dotnet_analysis_archive }} noble-security {{ dotnet_analysis_components }}"
dotnet_analysis_debs:
  - python3

# Every NuGet package the build restores: the whole graph, nothing resolved at
# build time. sha512 is of the .nupkg file (hex); each equals the packageHash
# nuget.org's catalog records for that version (checked 2026-10-11).
#   ilspycmd: the version in the image built 2026-09-01 (`dotnet tool list -g`);
#     a tool package, so it has no dependencies of its own.
#   dnlib, System.Drawing.Common, Microsoft.Win32.SystemEvents: de4dotEx's
#     PackageReferences (De4DotCommon.props DnlibVersion, de4dot.code.csproj) and
#     the one transitive dependency; the same versions, and the same bytes, as that
#     image's restore recorded.
#   Microsoft.NETCore.App.* / Microsoft.AspNetCore.App.*: what a self-contained
#     net8.0 publish (De4DotCommon.props sets SelfContained for Release) restores
#     on linux-x64. The running image restored the same five ids at 8.0.30; this
#     base's SDK is expected to ask for 8.0.31 (see the base image note above).
dotnet_analysis_nuget:
  - id: ilspycmd
    version: 11.0.0.9375
    sha512: 51a0c85e0f171a5f635984a0ef99adeb86e761b582ff5c61d6c5f5887e408c89190b1f02ee21c0aba2929791fe654d57fb2b4ef314175808cd55fbfe2ed97a0c
  - id: dnlib
