    sha512: 14e1d31fbe0d07f66bd3c16887c0623c841810ff908dbc464531309206e44db4943c9a492a994aaf05e3a44405c0fac3c08c0f0266a8a3861334b57db2feb952
  - id: System.Drawing.Common
