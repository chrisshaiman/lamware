---
# =============================================================================
# roles/dotnet-analysis/tasks/main.yml
# Builds the ILSpy .NET decompilation container.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Create dotnet-analysis directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: lamware
    mode: "0750"
  loop:
    - "{{ dotnet_analysis_install_dir }}"
    - "{{ dotnet_analysis_install_dir }}/build"

- name: Create the data directories (pipeline's; ADR-025)
  # Runtime output only. Everything else under the install directory is
  # root-owned code the pipeline reads and runs but cannot change.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"
  loop:
    - "{{ dotnet_analysis_install_dir }}/output"

- name: Root-own what is already in the build context (ADR-025)
  # Earlier deploys left these pipeline-owned, and a file this role no longer
  # ships would keep its old owner. follow: false: never chown a link's target.
  ansible.builtin.file:
    path: "{{ dotnet_analysis_install_dir }}/build"
    state: directory
    owner: root
    group: lamware
    # g+rX: the pipeline (group lamware) must read the context it builds;
    # go-w: and must not write it. Symbolic, so existing 0644/0755 files keep
    # their modes and a deploy does not change the context for nothing.
    mode: "u+rwX,g+rX,go-w"
    recurse: true
    follow: false

- name: Deploy Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ dotnet_analysis_install_dir }}/build/Containerfile"
    owner: root
    group: lamware
    mode: "0644"

- name: Deploy analyze-dotnet.py
  ansible.builtin.template:
    src: analyze-dotnet.py.j2
    dest: "{{ dotnet_analysis_install_dir }}/build/analyze-dotnet.py"
    owner: root
    group: lamware
    mode: "0755"

# Fetched HERE, as root, not inside the container build.
#
# The build runs as `pipeline`, whose outbound is restricted to loopback:5432 and
# loopback:8000 — it cannot resolve DNS at all (#343). Two deploys failed on
# `Could not resolve host: github.com` before that was understood. Ansible already
# runs as root, which has network, so fetching here puts the download where the
# network exists and leaves the build hermetic.
#
# `checksum` is the point, not a formality: it verifies the exact bytes BEFORE the
# build starts. A commit sha alone still trusts whatever the network hands back
# mid-build, and a build is a bad place to discover you got something else.
- name: Fetch pinned de4dotEx source into the build context
  ansible.builtin.get_url:
    url: >-
      https://codeload.github.com/GDATAAdvancedAnalytics/de4dotEx/tar.gz/{{ de4dotex_commit }}
    dest: "{{ dotnet_analysis_install_dir }}/build/de4dotEx.tar.gz"
    checksum: "sha256:{{ de4dotex_sha256 }}"
    owner: root
    group: lamware
    mode: "0644"

# ADR-023: the ilspycmd tool and de4dotEx's restore graph are pinned .nupkg files
# fetched by lamware-fetch; python3 is a Debian package set from the snapshot the
# base image was built from. The build then runs with --network=none.
- name: Build the dotnet-analysis image hermetically (ADR-023)
  ansible.builtin.include_role:
    name: build-fetch
    tasks_from: image
  vars:
    hb_name: dotnet-analysis
    hb_build_dir: "{{ dotnet_analysis_install_dir }}/build"
    hb_tag: localhost/dotnet-analysis:latest
    hb_base_images:
      - ref: "{{ dotnet_analysis_base_image }}"
        id: "{{ dotnet_analysis_base_image_id }}"
    hb_deb_sets:
      - name: main
        image: "{{ dotnet_analysis_base_image }}"
        sources: "{{ dotnet_analysis_apt_sources }}"
        packages: "{{ dotnet_analysis_debs }}"
    hb_nuget: "{{ dotnet_analysis_nuget }}"

- name: Deploy dotnet-analysis wrapper script
  ansible.builtin.template:
    src: run-dotnet-analysis-wrapper.sh.j2
    dest: "{{ dotnet_analysis_install_dir }}/run-dotnet-analysis"
    owner: root
    group: lamware
    mode: "0750"

- name: Create convenience symlink
  ansible.builtin.file:
    src: "{{ dotnet_analysis_install_dir }}/run-dotnet-analysis"
    dest: /usr/local/bin/run-dotnet-analysis
    state: link
