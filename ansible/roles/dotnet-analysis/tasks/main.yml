---
# =============================================================================
# roles/dotnet-analysis/tasks/main.yml
# Builds the ILSpy .NET decompilation container.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Create dotnet-analysis directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"
  loop:
    - "{{ dotnet_analysis_install_dir }}"
    - "{{ dotnet_analysis_install_dir }}/build"
    - "{{ dotnet_analysis_install_dir }}/output"

- name: Deploy Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ dotnet_analysis_install_dir }}/build/Containerfile"
    owner: pipeline
    group: pipeline
    mode: "0644"

- name: Deploy analyze-dotnet.py
  ansible.builtin.template:
    src: analyze-dotnet.py.j2
    dest: "{{ dotnet_analysis_install_dir }}/build/analyze-dotnet.py"
    owner: pipeline
    group: pipeline
    mode: "0755"

# Fetched HERE, as root, not inside the container build.
#
# The build runs as `pipeline`, whose outbound is restricted to loopback:5432 and
# loopback:8000 — it cannot resolve DNS at all (#343). Two deploys failed on
# `Could not resolve host: github.com` before that was understood. Ansible already
# runs as root, which has network, so fetching here puts the download where the
# network exists and leaves the build hermetic.
#
# `checksum` is the point, not a formality: it verifies the exact bytes BEFORE the
# build starts. A commit sha alone still trusts whatever the network hands back
# mid-build, and a build is a bad place to discover you got something else.
- name: Fetch pinned de4dotEx source into the build context
  ansible.builtin.get_url:
    url: >-
      https://codeload.github.com/GDATAAdvancedAnalytics/de4dotEx/tar.gz/{{ de4dotex_commit }}
    dest: "{{ dotnet_analysis_install_dir }}/build/de4dotEx.tar.gz"
    checksum: "sha256:{{ de4dotex_sha256 }}"
    owner: pipeline
    group: pipeline
    mode: "0644"

- name: Build dotnet-analysis container image
  ansible.builtin.command:
    cmd: >
      podman build
      --network=host
      -t localhost/dotnet-analysis:latest
      -f {{ dotnet_analysis_install_dir }}/build/Containerfile
      {{ dotnet_analysis_install_dir }}/build
  become: true
  become_user: pipeline
  changed_when: true

- name: Deploy dotnet-analysis wrapper script
  ansible.builtin.template:
    src: run-dotnet-analysis-wrapper.sh.j2
    dest: "{{ dotnet_analysis_install_dir }}/run-dotnet-analysis"
    owner: pipeline
    group: pipeline
    mode: "0750"

- name: Create convenience symlink
  ansible.builtin.file:
    src: "{{ dotnet_analysis_install_dir }}/run-dotnet-analysis"
    dest: /usr/local/bin/run-dotnet-analysis
    state: link
