---
# =============================================================================
# roles/mongodb/tasks/main.yml
# Installs and configures MongoDB 8.0 as a standalone service.
# No Cape-specific logic — reusable for any service needing MongoDB.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Remove broken repos and keyrings left by Cape installer
  ansible.builtin.shell: |
    rm -f /etc/apt/keyrings/mongo.gpg
    rm -f /usr/share/keyrings/mongodb-server-8.0.gpg
    rm -f /etc/apt/sources.list.d/mongodb*.list
    rm -f /etc/apt/sources.list.d/tor*.list
    rm -f /etc/apt/sources.list.d/pgdg*.list
  args:
    executable: /bin/bash
  changed_when: false

- name: Add MongoDB 8.0 GPG key
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc \
      | gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
    chmod 644 /usr/share/keyrings/mongodb-server-8.0.gpg
  args:
    executable: /bin/bash
  changed_when: true

- name: Add MongoDB 8.0 repository
  ansible.builtin.copy:
    content: "deb [signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse\n"
    dest: /etc/apt/sources.list.d/mongodb-org-8.0.list
    mode: "0644"

- name: Install MongoDB
  ansible.builtin.apt:
    name: mongodb-org
    state: present
    update_cache: true

# CAPE's installer ships its own unit (/lib/systemd/system/mongodb.service,
# not the package's mongod.service) and sets GLIBC_TUNABLES=glibc.pthread.rseq=0
# in it. MongoDB 8.0.21's vendored TCMalloc then refuses to start on kernels
# 6.19 and newer (SERVER-121912): rseq=0 -> failed, rseq=1 -> active, measured
# on the 2026-09-02 reboot (#528). This drop-in restores glibc's default. It
# lived only on the host for six weeks; a rebuilt host would have lost it on
# the first reboot into a current kernel.
- name: Create the MongoDB unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/mongodb.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Keep rseq enabled for MongoDB despite CAPE's unit disabling it (#528)
  ansible.builtin.copy:
    dest: /etc/systemd/system/mongodb.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/mongodb). See tasks/main.yml for why (#528).
      [Service]
      Environment="GLIBC_TUNABLES=glibc.pthread.rseq=1"
  notify: Reload systemd and restart MongoDB

- name: Enable and start MongoDB
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - mongod
    - mongodb
  failed_when: false
