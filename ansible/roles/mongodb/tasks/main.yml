---
# =============================================================================
# roles/mongodb/tasks/main.yml
# Installs and configures MongoDB 8.0 as a standalone service.
# No Cape-specific logic — reusable for any service needing MongoDB.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Remove broken repos and keyrings left by Cape installer
  ansible.builtin.shell: |
    rm -f /etc/apt/keyrings/mongo.gpg
    rm -f /usr/share/keyrings/mongodb-server-8.0.gpg
    rm -f /etc/apt/sources.list.d/mongodb*.list
    rm -f /etc/apt/sources.list.d/tor*.list
    rm -f /etc/apt/sources.list.d/pgdg*.list
  args:
    executable: /bin/bash
  changed_when: false

- name: Add MongoDB 8.0 GPG key
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc \
      | gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
    chmod 644 /usr/share/keyrings/mongodb-server-8.0.gpg
  args:
    executable: /bin/bash
  changed_when: true

- name: Add MongoDB 8.0 repository
  ansible.builtin.copy:
    content: "deb [signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse\n"
    dest: /etc/apt/sources.list.d/mongodb-org-8.0.list
    mode: "0644"

# The package ships mongod.service; CAPE's installer removed it and runs its own
# mongodb.service instead. A package upgrade re-extracts the file, and the role
# used to enable and start BOTH names. Masked, so neither an upgrade nor a boot
# can bring up a second mongod against an empty /var/lib/mongodb on 27017.
- name: Mask the package's mongod.service (CAPE's mongodb.service is the instance)
  ansible.builtin.systemd:
    name: mongod
    masked: true

- name: Read the installed MongoDB server version
  ansible.builtin.command: dpkg-query -W -f='${Version}' mongodb-org-server
  register: mongodb_installed
  changed_when: false
  failed_when: false

# CLAUDE.md §5: a database change states its way back before it happens. A
# patch release within 8.0 keeps FCV 8.0, so the way back is the previous pin
# and a redeploy; this archive is the backstop if the data ever moved anyway.
- name: Dump the cuckoo database before a version change
  ansible.builtin.shell:
    cmd: >
      set -o pipefail;
      mkdir -p {{ mongodb_rollback_dir }} && chmod 700 {{ mongodb_rollback_dir }} &&
      mongodump --quiet --gzip --db cuckoo
      --archive={{ mongodb_rollback_dir }}/cuckoo-{{ mongodb_installed.stdout | default('unknown') }}-{{ ansible_date_time.date }}.archive.gz
    executable: /bin/bash
    creates: "{{ mongodb_rollback_dir }}/cuckoo-{{ mongodb_installed.stdout | default('unknown') }}-{{ ansible_date_time.date }}.archive.gz"
  when:
    - mongodb_installed.rc == 0
    - mongodb_installed.stdout != mongodb_version

- name: Install MongoDB at the pinned version
  ansible.builtin.apt:
    name:
      - "mongodb-org={{ mongodb_version }}"
      - "mongodb-org-server={{ mongodb_version }}"
      - "mongodb-org-mongos={{ mongodb_version }}"
      - "mongodb-org-shell={{ mongodb_version }}"
      - "mongodb-org-tools={{ mongodb_version }}"
      - "mongodb-org-database={{ mongodb_version }}"
      - "mongodb-org-database-tools-extra={{ mongodb_version }}"
    state: present
    allow_downgrade: true
    update_cache: true
  notify: Reload systemd and restart MongoDB

# CAPE's installer ships its own unit (/lib/systemd/system/mongodb.service,
# not the package's mongod.service) and sets GLIBC_TUNABLES=glibc.pthread.rseq=0
# in it. MongoDB 8.0.21's vendored TCMalloc then refuses to start on kernels
# 6.19 and newer (SERVER-121912): rseq=0 -> failed, rseq=1 -> active, measured
# on the 2026-09-02 reboot (#528). This drop-in restores glibc's default. It
# lived only on the host for six weeks; a rebuilt host would have lost it on
# the first reboot into a current kernel.
- name: Create the MongoDB unit drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/mongodb.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Keep rseq enabled for MongoDB despite CAPE's unit disabling it (#528)
  ansible.builtin.copy:
    dest: /etc/systemd/system/mongodb.service.d/override.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/mongodb). See tasks/main.yml for why (#528).
      [Service]
      Environment="GLIBC_TUNABLES=glibc.pthread.rseq=1"
  notify: Reload systemd and restart MongoDB

- name: Enable and start MongoDB
  ansible.builtin.systemd:
    name: "{{ mongodb_unit }}"
    state: started
    enabled: true

# The running binary is the old one until the handler restarts the unit, and a
# deploy that reports ok with the old server still serving is the failure this
# repo keeps finding. Flush the handler here and read the version from the
# server itself, not from dpkg.
- name: Flush handlers so the restart happens before the version check
  ansible.builtin.meta: flush_handlers

- name: Verify the running server is the pinned version
  ansible.builtin.command: mongosh --quiet --eval "db.version()"
  register: mongodb_running
  changed_when: false
  retries: 10
  delay: 3
  until: mongodb_running.rc == 0
  failed_when: mongodb_running.rc != 0 or mongodb_running.stdout | trim != mongodb_version
