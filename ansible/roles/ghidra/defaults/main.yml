---
# roles/ghidra/defaults/main.yml

# Ghidra install directory on the host
ghidra_install_dir: /opt/ghidra
ghidra_output_dir: /opt/ghidra/output
ghidra_projects_dir: /opt/ghidra/projects

# Ghidra version — pinned release from GitHub
ghidra_version: "12.0.4"
ghidra_release_date: "20260303"

# Split out so the get_url line stays inside the 160-char lint limit. A folded
# scalar is not an option here: `>-` joins its lines with SPACES, which would
# quietly corrupt the URL.
ghidra_release_base: "https://github.com/NationalSecurityAgency/ghidra/releases/download"

# sha256 of the release zip, computed from the bytes fetched on 2026-08-09.
# Upstream publishes no checksum file alongside the asset, so this is the record
# of what we actually got — which is the point: the version says what to ASK for,
# the hash says which bytes are acceptable, and it fails before the build starts.
# https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.0.4_build/ghidra_12.0.4_PUBLIC_20260303.zip
# 509952513 bytes
ghidra_sha256: c3b458661d69e26e203d739c0c82d143cc8a4a29d9e571f099c2cf4bda62a120

# Container resource limits — Ghidra's JVM needs significant memory
# for decompilation of large binaries
ghidra_container_memory: "4g"
ghidra_container_cpus: "2"
ghidra_container_timeout: "600"

# --- ADR-023: hermetic build inputs ------------------------------------------
# The base image of both stages, by digest: eclipse-temurin:21-jdk-jammy as it sat
# in pipeline's store on 2026-10-11 (built 2026-05-15T21:16:07Z), the image this
# role has run on. Moving it is a deliberate change to this line.
ghidra_base_image: "docker.io/library/eclipse-temurin@sha256:801b7e1a9c4befaf82bf9a2a58025ef43a7694bbc84779187ad0524d84742772"
# Its image ID (config digest): what the build uses FROM and what the hand-off
# asserts. The registry digest above cannot survive save/load (ADR-023,
# 2026-10-12 amendment); this can. Read from the image pulled by that digest.
ghidra_base_image_id: "ae6f65b7c39f6b5a0ae86782024e2c821a46c65e1f90257fb2b5c355be3f3d9c"
# The Ubuntu archive at 2026-10-10. Not the base image's build date: the running
# image installed from the live mirror later, and an older snapshot would rebuild it
# with older security fixes. apt still verifies the signed Release files.
# https: snapshot.ubuntu.com redirects http.
ghidra_ubuntu_snapshot: "20261010T000000Z"
ghidra_snapshot_url: "https://snapshot.ubuntu.com/ubuntu/{{ ghidra_ubuntu_snapshot }}"
ghidra_keyring: "signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg"
ghidra_apt_components: "main restricted universe multiverse"
ghidra_apt_sources:
  - "deb [{{ ghidra_keyring }}] {{ ghidra_snapshot_url }} jammy {{ ghidra_apt_components }}"
  - "deb [{{ ghidra_keyring }}] {{ ghidra_snapshot_url }} jammy-updates {{ ghidra_apt_components }}"
  - "deb [{{ ghidra_keyring }}] {{ ghidra_snapshot_url }} jammy-backports {{ ghidra_apt_components }}"
  - "deb [{{ ghidra_keyring }}] {{ ghidra_snapshot_url }} jammy-security {{ ghidra_apt_components }}"
# One set per stage. The unpack stage only unzips the release; the final stage
# runs run-ghidra.py. unzip is deliberately not in the final image.
ghidra_unpack_debs:
  - unzip
ghidra_runtime_debs:
  - python3
  - python3-pip
