---
# roles/ghidra/defaults/main.yml

# Ghidra install directory on the host
ghidra_install_dir: /opt/ghidra
ghidra_output_dir: /opt/ghidra/output
ghidra_projects_dir: /opt/ghidra/projects

# Ghidra version — pinned release from GitHub
ghidra_version: "12.0.4"
ghidra_release_date: "20260303"

# sha256 of the release zip, computed from the bytes fetched on 2026-08-09.
# Upstream publishes no checksum file alongside the asset, so this is the record
# of what we actually got — which is the point: the version says what to ASK for,
# the hash says which bytes are acceptable, and it fails before the build starts.
# https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.0.4_build/ghidra_12.0.4_PUBLIC_20260303.zip
# 509952513 bytes
ghidra_sha256: c3b458661d69e26e203d739c0c82d143cc8a4a29d9e571f099c2cf4bda62a120

# Container resource limits — Ghidra's JVM needs significant memory
# for decompilation of large binaries
ghidra_container_memory: "4g"
ghidra_container_cpus: "2"
ghidra_container_timeout: "600"
