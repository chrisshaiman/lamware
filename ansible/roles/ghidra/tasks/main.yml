---
# =============================================================================
# roles/ghidra/tasks/main.yml
# Builds the Ghidra headless analysis container image.
#
# Ghidra runs inside a rootless Podman container with no network access
# and all capabilities dropped. PE binaries are mounted read-only.
#
# Future: LLM-assisted interpretation of decompiled output — send Ghidra's
# pseudocode to Claude for automated reverse engineering insights.
#
# Depends on: podman role (container runtime must be installed)
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

# -------------------------------------------------------------------------
# Host directories
# -------------------------------------------------------------------------

- name: Create ghidra directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: lamware
    mode: "0750"
  loop:
    - "{{ ghidra_install_dir }}"

- name: Create the data directories (pipeline's; ADR-025)
  # Runtime output only. Everything else under the install directory is
  # root-owned code the pipeline reads and runs but cannot change.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: pipeline
    group: lamware
    mode: "0750"
  loop:
    - "{{ ghidra_output_dir }}"
    - "{{ ghidra_projects_dir }}"

- name: Root-own what is already in the build context (ADR-025)
  # Earlier deploys left these pipeline-owned, and a file this role no longer
  # ships would keep its old owner. follow: false: never chown a link's target.
  ansible.builtin.file:
    path: "{{ ghidra_install_dir }}/build"
    state: directory
    owner: root
    group: lamware
    # g+rX: the pipeline (group lamware) must read the context it builds;
    # go-w: and must not write it. Symbolic, so existing 0644/0755 files keep
    # their modes and a deploy does not change the context for nothing.
    mode: "u+rwX,g+rX,go-w"
    recurse: true
    follow: false

# -------------------------------------------------------------------------
# Container image build
# -------------------------------------------------------------------------

- name: Create container build directory
  ansible.builtin.file:
    path: "{{ ghidra_install_dir }}/build"
    state: directory
    owner: root
    group: lamware
    mode: "0750"

- name: Deploy Containerfile
  ansible.builtin.template:
    src: Containerfile.j2
    dest: "{{ ghidra_install_dir }}/build/Containerfile"
    owner: root
    group: lamware
    mode: "0644"

- name: Deploy run-ghidra.py into build context
  ansible.builtin.template:
    src: run-ghidra.py.j2
    dest: "{{ ghidra_install_dir }}/build/run-ghidra.py"
    owner: root
    group: lamware
    mode: "0755"

- name: Deploy ExportAnalysis.java into build context
  ansible.builtin.template:
    src: ExportAnalysis.java.j2
    dest: "{{ ghidra_install_dir }}/build/ExportAnalysis.java"
    owner: root
    group: lamware
    mode: "0644"

- name: Deploy GhidraTool.java into build context
  ansible.builtin.template:
    src: GhidraTool.java.j2
    dest: "{{ ghidra_install_dir }}/build/GhidraTool.java"
    owner: root
    group: lamware
    mode: "0644"

# The build runs as `pipeline`, whose outbound is an iptables owner-match
# allowlist covering loopback:5432 and loopback:8000 — it cannot resolve DNS at
# all, so the `wget` this replaces could never have worked from a cold cache. It
# survived only because the image was already built on this host; a rebuilt host
# would have failed the same way pyinstaller-analysis and java-analysis did.
#
# Ansible runs as root, which does have network. Fetch here, COPY in the build.
- name: Fetch pinned Ghidra release into the build context
  ansible.builtin.get_url:
    url: "{{ ghidra_release_base }}/Ghidra_{{ ghidra_version }}_build/ghidra_{{ ghidra_version }}_PUBLIC_{{ ghidra_release_date }}.zip"
    dest: "{{ ghidra_install_dir }}/build/ghidra.zip"
    checksum: "sha256:{{ ghidra_sha256 }}"
    owner: root
    group: lamware
    mode: "0644"

- name: Build the ghidra image hermetically (ADR-023)
  ansible.builtin.include_role:
    name: build-fetch
    tasks_from: image
  vars:
    hb_name: ghidra
    hb_build_dir: "{{ ghidra_install_dir }}/build"
    hb_tag: localhost/ghidra:latest
    hb_base_images:
      - ref: "{{ ghidra_base_image }}"
        id: "{{ ghidra_base_image_id }}"
    hb_deb_sets:
      - name: unpack
        image: "{{ ghidra_base_image }}"
        sources: "{{ ghidra_apt_sources }}"
        packages: "{{ ghidra_unpack_debs }}"
      - name: runtime
        image: "{{ ghidra_base_image }}"
        sources: "{{ ghidra_apt_sources }}"
        packages: "{{ ghidra_runtime_debs }}"

# -------------------------------------------------------------------------
# Host-side wrapper script
# -------------------------------------------------------------------------

- name: Deploy ghidra wrapper script
  ansible.builtin.template:
    src: run-ghidra-wrapper.sh.j2
    dest: "{{ ghidra_install_dir }}/run-ghidra"
    owner: root
    group: lamware
    mode: "0750"

- name: Create convenience symlink
  ansible.builtin.file:
    src: "{{ ghidra_install_dir }}/run-ghidra"
    dest: /usr/local/bin/run-ghidra
    state: link
