---
# =============================================================================
# roles/llama-cpp/tasks/main.yml
# Brings the llama.cpp inference server under configuration management. It ran
# for months as an ad-hoc `podman run` out of /opt/llamacpp-spike with no unit
# and no restart policy, which made the sampling config unchangeable-in-code and
# the service unable to survive a reboot.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

- name: Create llama.cpp dirs
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"        # container reads the models dir as a non-root uid
  loop:
    - "{{ llamacpp_install_dir }}"
    - "{{ llamacpp_models_dir }}"

# One-time migration off the spike directory. Same filesystem, so this is a
# rename of ~23GB, not a copy. Safe to re-run: `creates` makes it a no-op once
# the file is in place.
- name: Migrate GGUFs off the spike directory (one-time, same-fs rename)
  ansible.builtin.command:
    argv:
      - mv
      - "{{ llamacpp_legacy_models_dir }}/{{ item }}"
      - "{{ llamacpp_models_dir }}/{{ item }}"
    creates: "{{ llamacpp_models_dir }}/{{ item }}"
    removes: "{{ llamacpp_legacy_models_dir }}/{{ item }}"
  loop:
    - "{{ llamacpp_model_file }}"
    - "{{ llamacpp_mmproj_file }}"

# Fail here rather than starting a server that will never answer. The GGUFs are
# fetched out of band (~23GB); this role does not download them.
- name: Assert the model files are present
  ansible.builtin.stat:
    path: "{{ llamacpp_models_dir }}/{{ item }}"
  register: _llamacpp_models
  failed_when: not _llamacpp_models.stat.exists
  loop:
    - "{{ llamacpp_model_file }}"
    - "{{ llamacpp_mmproj_file }}"

# Fail fast, BEFORE the ~10-minute model mmap. llama-server does not reject an unknown
# --reasoning-format; it silently falls back to `none` (observed 2026-07-29 with `auto`,
# which is the help text's default-when-unspecified, not an accepted value). Without this
# the only thing standing between a typo and a silently-unreasoning server is the /props
# assertion at the end of a full restart cycle.
- name: Assert the configured reasoning_format is one this build accepts
  ansible.builtin.assert:
    that:
      - llamacpp_reasoning_format in llamacpp_reasoning_format_choices
    fail_msg: >-
      llamacpp_reasoning_format={{ llamacpp_reasoning_format }} is not accepted by this
      build; valid values are {{ llamacpp_reasoning_format_choices | join(', ') }}.
      llama-server would NOT error on this — it would silently apply `none` and the #197
      trail would record thinking=0 on every turn.
    quiet: true

- name: Install llama-cpp unit
  ansible.builtin.template:
    src: llama-cpp.service.j2
    dest: /etc/systemd/system/llama-cpp.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart llama-cpp

# Retire the predecessor. The hand-run container holds the port and the 23GB of
# RAM; leaving it up would make the new unit fail to bind and mask the failure.
- name: Remove the unmanaged spike container if it is still running
  ansible.builtin.command:
    argv: [podman, rm, -f, llamacpp]
  register: _llamacpp_rm
  changed_when: _llamacpp_rm.rc == 0
  failed_when: false
  when: not ansible_check_mode

- name: Enable + start llama-cpp
  ansible.builtin.systemd:
    name: llama-cpp
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the llama.cpp API (model mmap takes minutes on a cold page cache)
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llamacpp_port }}/health"
    status_code: 200
  register: _llamacpp_up
  retries: 60
  delay: 10
  until: _llamacpp_up.status == 200

# --- Verification -------------------------------------------------------------
# RUNTIME verification, deliberately. A previous timeout fix (#218) was guarded
# only by a static test asserting the value appeared in the file — the value was
# in the file and never reached the socket. Asking the running server what it
# actually applied is the only check that can catch that class of bug.
- name: Read the sampling params the server actually applied
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llamacpp_port }}/props"
    return_content: true
  register: _llamacpp_props

- name: Assert the applied sampling profile matches the intended one
  vars:
    _applied: "{{ _llamacpp_props.json.default_generation_settings.params }}"
    _intended:
      seed: "{{ llamacpp_seed }}"
      temperature: "{{ llamacpp_temp }}"
      top_p: "{{ llamacpp_top_p }}"
      top_k: "{{ llamacpp_top_k }}"
      min_p: "{{ llamacpp_min_p }}"
      presence_penalty: "{{ llamacpp_presence_penalty }}"
  ansible.builtin.assert:
    # Float tolerance: llama.cpp round-trips these through float32, so 0.95
    # comes back as 0.949999988079071. An equality check would fail on a
    # correctly-configured server.
    that:
      - (_applied[item.key] | float - item.value | float) | abs < 0.0001
    fail_msg: >-
      llama-server applied {{ item.key }}={{ _applied[item.key] }} but the role
      intended {{ item.value }}. The flag did not reach the sampler — do not
      trust any eval result produced against this server.
    quiet: true
  loop: "{{ _intended | dict2items }}"

# Reasoning is verified by ACTUALLY ASKING THE MODEL, not by reading /props.
#
# DO NOT "simplify" this back to a /props check. `default_generation_settings.params.
# reasoning_format` reports `none` even when reasoning demonstrably works: on 2026-07-29 a
# server running `--reasoning-format deepseek` reported `none` there while real requests
# returned a fully populated `reasoning_content`. That block describes the DEFAULT
# PER-REQUEST generation settings — note `chat_format: Content-only` sitting next to it —
# not the chat-time parser that --jinja + /v1/chat/completions actually use. A /props
# assertion here failed two consecutive correct deploys before the mistake was found.
#
# One small completion costs a few seconds and is the only check that distinguishes
# "configured" from "working", which is the entire point of verifying this flag: its
# failure mode is an empty reasoning field in the #197 trail and no other symptom.
- name: Ask the model a question that requires thinking
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ llamacpp_port }}/v1/chat/completions"
    method: POST
    body_format: json
    body:
      # llama-server serves a single model and ignores this field; it is required by the
      # OpenAI schema only. Kept as a literal so the probe cannot fail on a filter change.
      model: "local-qwen"
      max_tokens: 200
      messages:
        - role: user
          content: "What is 17*23? Think it through."
    timeout: 180
  register: _llamacpp_reasoning_probe

- name: Assert the server actually surfaces chain-of-thought
  vars:
    _msg: "{{ (_llamacpp_reasoning_probe.json.choices | first).message }}"
  ansible.builtin.assert:
    that:
      - _msg.reasoning_content is defined
      - (_msg.reasoning_content | default('') | trim) | length > 0
    fail_msg: >-
      llama-server returned no reasoning_content for a prompt that requires thinking, so
      reasoning_format={{ llamacpp_reasoning_format }} is not in effect. Chain-of-thought
      will not reach the client and the #197 trail will record thinking=0 on every turn
      with no other symptom. Valid values for this build:
      {{ llamacpp_reasoning_format_choices | join(', ') }}.
    quiet: true

- name: Assert the context size the server actually applied
  ansible.builtin.assert:
    that:
      - _llamacpp_props.json.default_generation_settings.n_ctx | int == llamacpp_ctx_size | int
    fail_msg: >-
      llama-server applied n_ctx={{ _llamacpp_props.json.default_generation_settings.n_ctx }},
      not {{ llamacpp_ctx_size }}. --ctx-size is PER SLOT; check --parallel is 1.
    quiet: true

# Exposure assertion, mirroring the ollama role: the inference server must be
# reachable by the host-networked LiteLLM proxy and by nothing on wg0/eth0.
- name: Assert llama.cpp listens on host loopback only (not externally exposed)
  ansible.builtin.command: ss -tlnH
  register: _llamacpp_listeners
  changed_when: false
  failed_when: >
    ('127.0.0.1:' ~ (llamacpp_port | string)) not in _llamacpp_listeners.stdout
    or ('0.0.0.0:' ~ (llamacpp_port | string)) in _llamacpp_listeners.stdout
    or ('*:' ~ (llamacpp_port | string)) in _llamacpp_listeners.stdout
