---
# =============================================================================
# roles/llama-cpp/defaults/main.yml
# llama.cpp (llama-server) serving Qwen3.6-35B-A3B for the agentic RE stage and
# the vision stage. Replaces the hand-run container that lived in
# /opt/llamacpp-spike with no systemd unit and no restart policy.
#
# Author: Christopher Shaiman
# License: Apache 2.0
# =============================================================================

# Pinned by DIGEST, not by tag. A moving tag would silently change the inference
# engine underneath a benchmark and make every previous eval result unreproducible.
llamacpp_image: >-
  ghcr.io/ggml-org/llama.cpp@sha256:6c9257ee7187fd01bb479a9a3142e59c3d4f37bb6c3fc4c12326bcffcbfcf2ba

llamacpp_install_dir: /opt/llama-cpp
llamacpp_models_dir: /opt/llama-cpp/models
llamacpp_port: 11435

# The two GGUFs are downloaded out of band (~23GB) and are NOT fetched by this
# role — see the README. The role asserts they are present and fails loudly if
# they are not, rather than starting a server that will never answer.
llamacpp_model_file: "Qwen3.6-35B-A3B-UD-Q4_K_M.gguf"
llamacpp_mmproj_file: "mmproj-F16.gguf"       # vision projector; same model serves both

# Where the spike left the model files. The role migrates them once (a same-
# filesystem mv, so it is instant) and this can be dropped once every host is
# converged.
llamacpp_legacy_models_dir: /opt/llamacpp-spike

llamacpp_threads: 8
llamacpp_ctx_size: 131072       # PER SLOT — must be paired with --parallel 1
llamacpp_parallel: 1
llamacpp_cache_type_k: q8_0
llamacpp_cache_type_v: q8_0
llamacpp_memory: "34g"          # container cap; observed peak ~27GB at full 128k context

# --- Sampling -----------------------------------------------------------------
# Qwen's published "thinking / precise coding" profile. We deliberately do NOT
# use the thinking/general profile (temperature 1.0): agentic RE wants correct
# symbol names and addresses, not diverse reasoning paths — emitting FUN_0040b478
# for FUN_0040b477 is precisely the failure the grounding metric measures.
#
# Every value is passed EXPLICITLY. Before this role, min_p came from llama.cpp's
# own default of 0.05, silently overriding Qwen's recommended 0.0 — a value nobody
# had chosen. An unset flag is not a neutral flag.
llamacpp_temp: 0.6
llamacpp_top_p: 0.95
llamacpp_top_k: 20
llamacpp_min_p: 0.0
llamacpp_presence_penalty: 0.0

# Fixed so runs are reproducible and comparisons are PAIRED (the same seed across
# arms cancels shared sampling variance). This value is arbitrary and is meant to
# be reported, never tuned: picking the best-scoring seed is selection on noise
# and would invalidate any published result. See issue #222.
llamacpp_seed: 42

# How the server surfaces the model's chain-of-thought.
#
# Never passed until now, so the server ran at its default and `/props` reported
# `reasoning_format: none`. Consequence: Qwen3.6's reasoning never reached the client as
# a separate field, so the forensic trail (#197) recorded `thinking=0c` on every turn —
# the capture mechanism was correct and there was simply nothing to capture.
#
# This is the SECOND flag on this unit to bite that way, after min_p silently taking
# llama.cpp's 0.05 over Qwen's recommended 0.0. The comment written then applies again:
# an unset flag is not a neutral flag.
#
# `auto` lets llama.cpp pick the parser matching the model's template and populate
# `reasoning_content`. Verify END TO END after deploy, not just via /props: reasoning has
# to survive LiteLLM's OpenAI->Anthropic translation as a `thinking` block, and that path
# is already known to drop `enable_thinking`.
llamacpp_reasoning_format: "auto"
